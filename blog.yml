# =============================================================================
# Playbook: blog.yml
# Provisions a WordPress blog on a fresh AlmaLinux 9 server.
#
# QUICK START – first-time setup on a new host
# -----------------------------------------------------------------------------
# 1. Add the server IP to inventory/hosts.yml  (ansible_host: "x.x.x.x")
#
# 2. Fill in host_vars:
#    inventory/host_vars/<host>/vars.yml   – network, hostnames, paths
#    inventory/host_vars/<host>/vault.yml  – passwords (see template for keys)
#    Encrypt the vault before committing:
#      ansible-vault encrypt inventory/host_vars/<host>/vault.yml
#
# 3. Ensure ansible_port is set to 22 in vars.yml (fresh server default).
#
# 4. Run the playbook:
#      ansible-playbook blog.yml --limit <host> --ask-vault-pass
#
# 5. WITHOUT disconnecting your SSH session, reboot the server:
#      ssh root@<host> reboot
#    After the reboot sshd listens on port 10022 and the firewall is active.
#
# 6. Change ansible_port from 22 to 10022 in vars.yml.
#
# 7. All subsequent runs:
#      ansible-playbook blog.yml --limit <host> --ask-vault-pass
#
# Usage:
# -----------------------------------------------------------------------------
#
#   # First-time setup (fresh server, ansible_port: 22):
#   ansible-playbook blog.yml --limit <host> --ask-vault-pass
#
#   # Re-run after config changes or updates:
#   ansible-playbook blog.yml --limit <host> --ask-vault-pass
#
#   # Specific host examples:
#   ansible-playbook blog.yml --limit test           --ask-vault-pass
#   ansible-playbook blog.yml --limit www.example.de --ask-vault-pass
#
#   # After first run: reboot the server, then change ansible_port to 10022.
#
# Prerequisites:
#   1. cp inventory/hosts.yml.example           inventory/hosts.yml
#   2. cp inventory/host_vars/<h>/vars.yml.example  .../vars.yml  → fill in
#   3. cp inventory/host_vars/<h>/vault.yml.example .../vault.yml → fill in
#   4. ansible-vault encrypt inventory/host_vars/<host>/vault.yml
#
# SWITCHING BETWEEN BLOG AND NEXTCLOUD ON THE TEST SERVER
# -----------------------------------------------------------------------------
# The test server can run either blog.yml or nextcloud-k3s.yml.
# Before switching scenarios, wipe the K3s state on the server:
#   k3s-uninstall.sh && rm -rf /srv/wordpress-* /srv/nextcloud-*
# Then run the desired playbook from scratch.
#
# ADDING A NEW BLOG HOST
# -----------------------------------------------------------------------------
# 1. Add the host under the 'blog' group in inventory/hosts.yml
# 2. Copy inventory/host_vars/test/vars.yml.example → host_vars/<host>/vars.yml
# 3. Copy inventory/host_vars/test/vault.yml.example → host_vars/<host>/vault.yml
# 4. Fill in vars.yml (IPs, hostname) and vault.yml (passwords)
# 5. Follow the Quick Start steps above.
# =============================================================================
- name: Install and configure WordPress blog
  hosts: blog
  # gather_subset: collect only OS/network/virtual facts.
  # Skips slow hardware inventory (lspci, dmidecode) → saves ~3-5 s.
  # Full facts are cached to /tmp/ansible_facts_cache for 1 h (see ansible.cfg).
  gather_facts: true
  gather_subset:
    - min
    - network
    - virtual
  become: false


  roles:
    - common_version_check  # Pre-flight: show component versions + available updates
    - blog_packages         # Host packages: nftables, SELinux tools, utilities only
    - common_ssh            # SSH hardening (port, key-only auth)
    - common_firewall       # nftables IPv4/IPv6 rules
    - common_sysctl         # Kernel tuning: TCP BBR, connection timeouts, backlog
    - blog_selinux          # SELinux enforcing + container_file_t for HostPath  ← before deploy!
    - common_k3s            # K3s + Helm + cert-manager + nginx-ingress (F5)
    - blog_k3s_deploy       # WordPress K8s manifests applied (pods start in background)

    # These roles run while K8s pods initialise – saves 2-3 min wall-clock time.
    - common_node_exporter  # Node Exporter (metrics, port 9100)
    - common_prometheus     # Prometheus (scrapes node:9100 + K3s NodePorts, port 9090)
    - common_grafana        # Grafana (dashboards 1860/7362/4912, port 3000)
    - common_fail2ban       # Fail2Ban: SSH + nginx + WordPress login protection
    - common_msmtp          # msmtp sendmail relay (rkhunter, cron, dnf-automatic)
    - common_dnf_automatic  # Automatic security-only updates via dnf-automatic
    - common_rkhunter       # Rootkit detection with daily scan
    - common_auditd         # Linux Audit Daemon with security-relevant rules
    - common_logrotate      # Log rotation for Grafana, Prometheus, fail2ban, rkhunter

    # WordPress setup waits for pod readiness → by now pods are Running.
    - blog_wordpress        # WordPress install + plugins via kubectl exec
    - blog_verify           # Post-deployment smoke tests (services, K8s, HTTPS, security, performance)

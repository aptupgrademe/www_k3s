---
# Ansible Galaxy collections required by this project.
# Install before running any playbook:
#   ansible-galaxy collection install -r requirements.yml
#
# Used by:
#   community.mysql  → next_mariadb   (mysql_user, mysql_db modules)
#   ansible.posix    → next_selinux   (seboolean module)

collections:
  - name: community.mysql
    version: ">=3.0.0"
  - name: ansible.posix
    version: ">=1.4.0"

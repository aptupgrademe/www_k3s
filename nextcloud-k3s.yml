---
# =============================================================================
# Playbook: nextcloud-k3s.yml
# Purpose:  Full infrastructure deployment and configuration.
#           Idempotent – safe to re-run on an existing installation.
#
# Run this playbook to:
#   - Provision a new server from scratch
#   - Apply configuration changes (vars, templates, occ settings)
#   - Roll out new image tags or Helm chart versions after editing
#     inventory/group_vars/all/versions.yml
#
# -----------------------------------------------------------------------------
# Update workflow – see also nextcloud-update.yml:
#
#   Patch update (same tag, e.g. 33.0.2 → 33.0.3):
#     → ansible-playbook nextcloud-update.yml --limit <host>
#
#   Version bump (tag/chart change in group_vars/all/versions.yml):
#     → ansible-playbook nextcloud-k3s.yml --limit <host>
#
#   Full maintenance cycle (patch + version bumps):
#     → run nextcloud-update.yml first, then nextcloud-k3s.yml
# -----------------------------------------------------------------------------
#
# First run on a fresh server: ansible_port must be 22 in host_vars. The run
# reboots the server by itself once SSH and the firewall are configured
# (common_firewall/tasks/first_run_reboot.yml) and finishes on port 10022.
# Afterwards change ansible_port to 10022 in host_vars - the switch only
# lasts for that one run.
#
# Production hosts (cvjm, sofie) require host_vars and encrypted vault.yml
# before running without --limit.
#
# Usage:
# -----------------------------------------------------------------------------
#
#   # First-time setup (fresh server, ansible_port: 22):
#   ansible-playbook nextcloud-k3s.yml --limit <host> --ask-vault-pass
#
#   # Re-run after config changes or updates:
#   ansible-playbook nextcloud-k3s.yml --limit <host> --ask-vault-pass
#
#   # Specific host examples:
#   ansible-playbook nextcloud-k3s.yml --limit test  --ask-vault-pass
#   ansible-playbook nextcloud-k3s.yml --limit cvjm  --ask-vault-pass
#   ansible-playbook nextcloud-k3s.yml --limit sofie --ask-vault-pass
#
#   # All nextcloud hosts at once:
#   ansible-playbook nextcloud-k3s.yml --ask-vault-pass
#
# Prerequisites:
#   1. cp inventory/hosts.yml.example           inventory/hosts.yml
#   2. cp inventory/host_vars/<h>/vars.yml.example  .../vars.yml  → fill in
#   3. cp inventory/host_vars/<h>/vault.yml.example .../vault.yml → fill in
#   4. ansible-vault encrypt inventory/host_vars/<host>/vault.yml
# =============================================================================
- name: Install packages and configure server
  hosts: nextcloud
  # Which stack this play installs. Shared roles read it instead of asking the
  # inventory group (the test host is in both groups), and the profile roles
  # (common_selinux, common_clamav) pick their settings with it.
  vars:
    stack: nextcloud
  # gather_subset: only "min" – the sole facts actually used anywhere in
  # this repo are kernel (next_packages reboot check), distribution (common_firewall),
  # fqdn/hostname (monit, MariaDB) and date_time, all part of "min" - read as
  # ansible_facts['...'], not as top-level ansible_* variables (deprecated). network/
  # virtual facts (interfaces, virtualization type) aren't referenced by any
  # role, so skipping them saves the interface-enumeration/dmidecode time
  # without losing anything actually used.
  gather_facts: true
  gather_subset:
    - min
  become: false


  roles:
    - { role: common_version_check,  tags: [common_version_check] }  # Pre-flight: show component versions + available updates
    - { role: next_packages,         tags: [next_packages] }         # Repositories, packages (MariaDB 10.11, Redis) – nginx/PHP run in K3s pods
    - { role: common_ssh,            tags: [common_ssh] }            # SSH hardening (port, key-only auth)
    - { role: common_firewall,       tags: [common_firewall] }       # nftables IPv4/IPv6 rules (incl. K3s pod CIDR exceptions)
    - { role: common_sysctl,         tags: [common_sysctl] }         # Kernel tuning: TCP BBR, connection timeouts, backlog
    - { role: common_cis_hardening,  tags: [common_cis_hardening] }  # CIS AlmaLinux 9 Benchmark: AIDE, kernel modules, cron/sudo, mount options
    - { role: next_mariadb,          tags: [next_mariadb] }          # MariaDB setup + Nextcloud database and user
    # Must run BEFORE next_k3s_deploy: Redis requires a password now, and the
    # Nextcloud pods are handed that password the moment they start. Started
    # in the other order, a fresh install (or the first run after the password
    # was introduced) has pods authenticating against a Redis that does not
    # expect a password yet, which Redis rejects outright.
    - { role: next_redis,            tags: [next_redis] }            # Redis (host service) – must precede the pods that authenticate to it
    - { role: common_selinux,        tags: [common_selinux] }  # SELinux enforcing + container_file_t contexts for K3s HostPath vols  ← before deploy!
    - { role: common_k3s,            tags: [common_k3s] }            # K3s single-node cluster + Helm + cert-manager + nginx-ingress (F5)
    - { role: common_calico,         tags: [common_calico] }         # Calico policy-only mode: NetworkPolicy enforcement (Flannel alone ignores it)
    - { role: common_kube_metrics,   tags: [common_kube_metrics] }   # Container metrics: cAdvisor scraper token + kube-state-metrics (NodePort 30808)
    - { role: next_k3s_deploy,       tags: [next_k3s_deploy] }       # Nextcloud + Collabora K8s workloads; waits until the pods are ready

    # Host-side services. Several watch what the deploy just created: Prometheus
    # scrapes the exporter NodePorts, fail2ban reads the ingress logs, Monit checks
    # the pods.
    - { role: common_node_exporter,  tags: [common_node_exporter] }  # Node Exporter (metrics, port 9100)
    - { role: common_mysqld_exporter, tags: [common_mysqld_exporter] } # mysqld_exporter (MariaDB metrics, port 9104)
    - { role: common_prometheus,     tags: [common_prometheus] }     # Prometheus (scrapes localhost:9100/9104 + K3s NodePorts, port 9090)
    - { role: common_grafana,        tags: [common_grafana] }        # Grafana (dashboard, port 3000)
    - { role: common_fail2ban,       tags: [common_fail2ban] }       # Fail2Ban: SSH + Nextcloud login protection
    - { role: common_msmtp,          tags: [common_msmtp] }          # msmtp sendmail relay (used by rkhunter, cron, dnf-automatic)
    - { role: common_dnf_automatic,  tags: [common_dnf_automatic] }  # Automatic security-only updates via dnf-automatic
    - { role: common_rkhunter,       tags: [common_rkhunter] }       # Rootkit detection with daily scan
    - { role: common_clamav,         tags: [common_clamav] }  # ClamAV: nightly antivirus scan of Nextcloud user data
    - { role: common_auditd,         tags: [common_auditd] }         # Linux Audit Daemon with security-relevant rules
    - { role: common_logrotate,      tags: [common_logrotate] }      # Log rotation for Grafana, Prometheus, fail2ban, rkhunter
    - { role: common_monit,          tags: [common_monit] }          # Watchdog: emails on service/resource failures, auto-restarts fail2ban

    # occ configuration inside the running Nextcloud pod (ready since next_k3s_deploy).
    - { role: next_config,           tags: [next_config] }           # Post-install: occ config via kubectl exec
    - { role: nextcloud_verify,      tags: [nextcloud_verify] }      # Post-deployment smoke tests (services, K8s, HTTPS, security, performance)
    - { role: common_version_active,  tags: [common_version_active] }  # Are the pinned versions ACTIVE (kubelet, charts, running images, reboot)?

    # Always last: refresh the AIDE baseline if this run changed anything it
    # watches, so tomorrow's scheduled AIDE check isn't a false alarm about
    # today's own approved changes.
    - { role: common_aide_refresh,   tags: [common_aide_refresh] }

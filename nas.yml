---
# =============================================================================
# Playbook: nas.yml
# Purpose:  Configure hp1 (192.168.10.50) as a NAS with OpenZFS RAIDZ1,
#           Samba shares and Jenkins backup jobs.
#
# Hardware:
#   sdb (465 GB SSD)     – Debian OS (do not touch)
#   sda/sdc/sdd (1.8 TB SSD each) – OpenZFS RAIDZ1 pool "data" → /raid5
#   sde (1.8 TB HDD)     – external backup disk, not managed here
#
# MIGRATION NOTE – read before first run:
#   The three data SSDs currently run a Linux md RAID5 (md0) with ~2 TB of data.
#   The nas_zfs role will ABORT if md0 still exists.
#   Manual migration steps (run once before this playbook):
#     1. Back up all data from /raid5 to an external location (sde or remote)
#     2. systemctl stop smbd nmbd jenkins
#     3. umount /raid5
#     4. mdadm --stop /dev/md0
#     5. mdadm --zero-superblock /dev/sda /dev/sdc /dev/sdd
#     6. Remove md0 from /etc/mdadm/mdadm.conf and /etc/fstab
#     7. Re-run this playbook → ZFS pool will be created
#     8. Restore data to /raid5/shared and /raid5/angelika
#
# Usage:
#   ansible-playbook nas.yml --ask-vault-pass
# =============================================================================
- name: Configure NAS (hp1)
  hosts: nas
  gather_facts: true
  become: true
  become_method: su

  roles:
    - nas_packages        # Install ZFS, Samba, Jenkins (Java), utilities
    - common_sysctl       # Kernel tuning: BBR, TCP, backlog, THP madvise
    - common_msmtp        # E-Mail relay (for Jenkins/cron notifications)
    - common_apt_automatic # Automatic security updates (unattended-upgrades)
    - nas_zfs             # Create RAIDZ1 pool + datasets (aborts if md0 exists)
    - nas_samba           # Deploy smb.conf and ensure service runs
    - nas_jenkins         # Deploy Jenkins config, jobs and ensure service runs
    # Optional – add when ready:
    # - common_node_exporter
    # - common_prometheus
    # - common_grafana

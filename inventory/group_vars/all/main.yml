---
# =============================================================================
# Settings shared by all hosts. ALL version pins are in versions.yml next to
# this file; per-host values are in inventory/host_vars/<host>/.
# =============================================================================

# =============================================================================
# K3s / Kubernetes cluster settings
# =============================================================================

# CIDR for K3s pods (Flannel default).  Used in:
#   - nftables rules (common_firewall) to allow pod → host access
#   - Nginx sidecar set_real_ip_from directive
k3s_pod_cidr: "10.42.0.0/16"

# CIDR for K3s Services.  Collabora's ClusterIP is in this range;
# add it to wopi_allowed_hosts in host_vars so Nextcloud accepts WOPI callbacks.
k3s_service_cidr: "10.43.0.0/16"

# HostPath directory for Nextcloud application files (PHP, apps, config, themes).
nextcloud_k3s_www_dir: /srv/nextcloud-www

# HostPath directory for WordPress application files (PHP core, wp-content).
blog_k3s_www_dir: /srv/wordpress-www

# HostPath directory for MariaDB data files (InnoDB, system tables).
blog_k3s_db_dir: /srv/wordpress-db

# HostPath directory for the WordPress admin country list (nginx "geo" file,
# written weekly by ssh-geo-update from the same RIPE data as the SSH filter).
# Only used when fw_ssh_geo_countries is set on the blog: /wp-login.php and
# /wp-admin/ then answer 403 to addresses outside those countries.
blog_admin_geo_dir: /srv/wordpress-admin-geo

# fail2ban -> nftables: ONE set pair per jail, f2b_<name>4 / f2b_<name>6
# (common_firewall creates the sets and the drop rules, common_fail2ban points
# each jail's action at its own set). Until 2026-10-21 all jails shared
# banned4/banned6: when two jails banned the same address (a scanner hits
# bad-paths for 24 h and scanner for 1 h), the first unban DELETED it from the
# shared set although the other ban was still running - 1 to 5 addresses per
# host were "banned" in fail2ban but let through by the firewall, and recidive's
# 30-day bans could end after a day. banned4/banned6 stay for manual bans.
fail2ban_nft_jails:
  sshd: sshd
  nginx-k3s-wp-login: wp_login
  nginx-k3s-nc-login: nc_login
  nginx-k3s-grafana-login: grafana_login
  nginx-k3s-scanner: scanner
  nginx-k3s-bad-paths: bad_paths
  recidive: recidive

# HostPath directory for the same country list in the ingress controller
# (every host, since 2026-10-20): /grafana answers 403 outside those
# countries. Mounted read-only into the nginx-ingress DaemonSet (common_k3s).
ingress_admin_geo_dir: /srv/ingress-admin-geo
# On whenever the SSH country filter is configured (fw_ssh_geo_countries).
ingress_admin_geo_enabled: "{{ fw_ssh_geo_countries | default([]) | length > 0 }}"

# =============================================================================
# Kubernetes API access for the kubernetes.core modules (k8s, k8s_info, helm,
# helm_repository). They run on the host itself and use the K3s admin
# kubeconfig, like "k3s kubectl" does. Needs python3-kubernetes on the host
# (installed by common_k3s) and kubernetes.core >= 6.5.0 on the controller
# for Helm 4 (requirements.yml).
# =============================================================================
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

# =============================================================================
# Monitoring
# =============================================================================
# (node_exporter / prometheus versions: versions.yml)
prometheus_retention:  "30d"
# grafana_admin_pass: set per host in host_vars/<host>/vault.yml

# =============================================================================
# Per-host resource sizing (K3s requests/limits + Collabora concurrency)
# =============================================================================
# These were hardcoded in the deployment templates and sized for the original
# ~8 GB production hosts. They are variables now so each host can size to its
# own hardware - override in inventory/host_vars/<host>/vars.yml. A roomy host
# (cvjm: 8 vCPU / 24 GB) keeps/raises them; a smaller host (e.g. sofie) lowers
# them. The defaults below reproduce the previous hardcoded values, so any host
# that overrides nothing behaves exactly as before.
#
# Nextcloud PHP-FPM container (worker counts are separate: nextcloud_fpm_max_children etc.)
nextcloud_fpm_mem_request: "512Mi"
nextcloud_fpm_cpu_request: "250m"
nextcloud_fpm_mem_limit:   "4Gi"
nextcloud_fpm_cpu_limit:   "1500m"
#
# Collabora container. Concurrent-document capacity is bounded mainly by memory
# (~150-200 MB per open document): the 3Gi default comfortably serves ~12
# simultaneous editors, the realistic ceiling here (151 users total, far fewer
# editing at once). num_prealloc_children pre-forks kit processes for faster
# first opens; max_concurrency is CPU threads per open document.
collabora_mem_request:    "1Gi"
collabora_cpu_request:    "500m"
collabora_mem_limit:      "3Gi"
collabora_cpu_limit:      "2000m"
collabora_num_prealloc:    4
collabora_max_concurrency: 4

# =============================================================================
# K3s / Kubernetes cluster settings
# =============================================================================

# CIDR for K3s pods (Flannel default).  Used in:
#   - nftables rules (common_firewall) to allow pod → host access
#   - Nginx sidecar set_real_ip_from directive
k3s_pod_cidr: "10.42.0.0/16"

# CIDR for K3s Services.  Collabora's ClusterIP is in this range;
# add it to wopi_allowed_hosts in host_vars so Nextcloud accepts WOPI callbacks.
k3s_service_cidr: "10.43.0.0/16"

# HostPath directory for Nextcloud application files (PHP, apps, config, themes).
nextcloud_k3s_www_dir: /srv/nextcloud-www

# HostPath directory for WordPress application files (PHP core, wp-content).
blog_k3s_www_dir: /srv/wordpress-www

# HostPath directory for MariaDB data files (InnoDB, system tables).
blog_k3s_db_dir: /srv/wordpress-db

# =============================================================================
# K3s version – pinned (not "latest") so upgrades are deliberate and
# reproducible. common_k3s compares this against the installed version and
# upgrades in place (binary swap + service restart) if they differ.
# Verify latest: https://github.com/k3s-io/k3s/releases
# =============================================================================
k3s_version: "v1.36.4+k3s1"  # bumped 2026-09-13, was v1.36.3+k3s1 (Kubernetes
                             # v1.36.4; containerd 2.3.4, runc 1.4.2, etcd 3.6.14).
                             # The release also moves the bundled Traefik chart to
                             # v40.x, which renames kubernetesIngressNginx to
                             # kubernetesIngressNGINX - irrelevant here, Traefik is
                             # in the disable list (see install_k3s.yml).

# =============================================================================
# Helm version – pinned (not the v3-only get-helm-3 installer script) so
# upgrades are deliberate and reproducible, same pattern as k3s_version above.
# Migrated from Helm v3 to v4 (2026-07-12): checked against this repo's Helm
# usage (classic helm repo add/search/update, helm upgrade --install, no
# --atomic/--force flags, no OCI registries, no Go SDK usage) – none of the
# known v4 breaking changes apply. Helm 3 itself stopped receiving bugfixes
# 2026-07-08, security patches end 2026-11-11.
# Verify latest: https://github.com/helm/helm/releases
# =============================================================================
helm_version: "v4.3.0"  # bumped 2026-09-13, was v4.2.4. Additions only
                        # (duration template functions, rollback --description,
                        # ownership check before uninstall deletes). No breaking
                        # changes to repo add/update or upgrade --install, which is
                        # all this repo uses.

# =============================================================================
# Calico version – pinned, same pattern as k3s_version/helm_version above.
# Installed in "policy-only" mode (common_calico, Nextcloud only): only
# Felix + kube-controllers, reading Pod/NetworkPolicy objects straight from
# the Kubernetes API. K3s's built-in Flannel keeps doing all pod networking/
# IPAM/CNI plugin duties untouched – Calico here only adds NetworkPolicy
# enforcement, which Flannel alone silently ignores (verified live: a
# deny-all policy had zero effect before this was installed).
# Verify latest: https://github.com/projectcalico/calico/releases
# =============================================================================
calico_version: "v3.32.2"  # bumped 2026-09-13, was v3.32.1. Bugfix/CVE release, no
                           # breaking changes. Two fixes matter here: a panic in
                           # kube-controllers when the informer delivers a tombstone
                           # to a delete handler, and IP-set programming errors in
                           # nftables mode - both components this host actually runs.
                           # Note: the manifest in common_calico/templates is vendored
                           # and only its image tags are templated, so a bump like this
                           # swaps images while the manifest structure stays at the
                           # version it was derived from. Fine for a patch release with
                           # no CRD or RBAC changes - re-derive the manifest for a minor
                           # or major bump instead of just moving this string.

# =============================================================================
# Helm chart versions – update here to roll out across all hosts
# Verify latest: https://artifacthub.io/packages/helm/nginx-stable/nginx-ingress  (F5)
#                https://artifacthub.io/packages/helm/cert-manager/cert-manager
# =============================================================================
ingress_nginx_chart_version: "2.6.4"   # appVersion 5.5.4 (controller image) - re-checked 2026-08-20 against
                                        # the published helm.nginx.com/stable index; still the newest chart
                                        # actually released (2.7.0 exists on GitHub's main branch but hasn't
                                        # been packaged/published to the repo yet - don't trust Chart.yaml on
                                        # main as a proxy for "latest available", check the index.yaml itself)
cert_manager_chart_version:  "1.21.2"   # bumped 2026-09-13, was 1.21.1 (appVersion
                                        # v1.21.2). Taken from charts.jetstack.io
                                        # index.yaml, not GitHub - same reason as the
                                        # nginx-ingress note above. The index lists it
                                        # as "v1.21.2"; helm --version accepts it
                                        # without the prefix, as before.

# =============================================================================
# Monitoring stack versions – update here to roll out across all hosts
# =============================================================================
node_exporter_version: "1.12.1"
prometheus_version:    "3.14.0"  # bumped 2026-08-28, was 3.13.2
prometheus_retention:  "30d"
# grafana_admin_pass: set per host in host_vars/<host>/vault.yml

# =============================================================================
# Container image versions – pin explicitly so upgrades are a conscious choice.
# imagePullPolicy defaults to IfNotPresent for tagged images, meaning K3s will
# NOT pull a new version automatically – only when you change the tag here and
# re-run the playbook (which triggers a rollout restart).
#
# Check for new versions:
#   Nextcloud:  https://hub.docker.com/_/nextcloud/tags  (filter: *-fpm)
#   Collabora:  https://hub.docker.com/r/collabora/code/tags
#   WordPress:  https://hub.docker.com/_/wordpress/tags  (filter: *-fpm)
#   MariaDB:    https://hub.docker.com/_/mariadb/tags
#   Nginx:      https://hub.docker.com/_/nginx/tags      (filter: *-alpine)
# =============================================================================
# Was floating on the major-only tag "34-fpm" (silently drifts to whatever
# Docker Hub rebuilds under that tag - inconsistent with every other image in
# this file being pinned to an exact patch). Pinned to the current patch
# 2026-08-20; check the URL above for newer 34.0.x builds periodically.
nextcloud_image_fpm:       "nextcloud:34.0.3-fpm"
# nginx stable branch (even minor). Was 1.31 (mainline) – moved to the stable
# 1.30.x line for a production deployment. Pinned to the exact patch on purpose:
# the floating 1.30-alpine tag stayed on a cached 1.30.3 under imagePullPolicy
# IfNotPresent, and 1.30.3 is still vulnerable. 1.30.4 carries the fixes for
# CVE-2026-42533 (map+regex buffer overflow), CVE-2026-60005 (slice-module
# memory disclosure) and CVE-2026-56434 (ssi-module use-after-free); 1.30.5 adds
# the fix for CVE-2026-90439 (HTTP/3 module buffer overflow). Pinning the patch
# forces a fresh pull. Shared by blog + nextcloud.
nextcloud_image_nginx:     "nginx:1.30.5-alpine"   # bumped 2026-09-18, was 1.30.4
nextcloud_image_collabora: "collabora/code:26.04.3.1.1"   # checked 2026-08-20, was 26.04.1.4.1
nextcloud_image_busybox:   "busybox:1"
blog_image_busybox:        "busybox:1"

blog_image_wordpress:      "wordpress:7.1.1-php8.4-fpm"  # bumped 2026-09-20, was 7.1.0 (7.1.1 = maintenance+security, 11 security fixes; image confirmed present on Docker Hub 2026-09-20 after a 2-day lag)
# MariaDB 10.11 LTS, pinned to the exact patch for the same reason as nginx
# above: the floating 10.11 tag left the node on a stale cached layer under
# imagePullPolicy IfNotPresent (verified 2026-08-16 – node had digest
# be981e4113326 while Docker Hub's 10.11 tag was rebuilt to de61fed4a40d3 on
# 2026-08-04). 10.11.18 IS that rebuilt image, byte for byte – same digest –
# so this pin changes no content, it only forces the pull that the floating
# tag silently skipped. 10.11 is supported until Feb 2028.
blog_image_mariadb:        "mariadb:10.11.19"  # bumped 2026-08-28, was 10.11.18
blog_image_nginx:          "nginx:1.30.5-alpine"   # bumped 2026-09-18, was 1.30.4 (see nextcloud_image_nginx note; 1.30.5 = CVE-2026-90439)
# Redis: object cache for WordPress (pure in-memory, no persistence)
# Exact patch pin, same stale-cache reason as MariaDB above (node was on
# 6ab0b6e738177, Hub's 7-alpine had moved to e7723ff73d963). 7.4.10-alpine is
# that same image by digest. 7.4 is the last Redis 7 LTS line; moving to 8.x
# is a deliberate major upgrade, not a patch bump – left for a separate change.
# Check: https://hub.docker.com/_/redis/tags  (filter: *-alpine)
blog_image_redis:          "redis:7.4.11-alpine"  # bumped 2026-09-02, was 7.4.10-alpine

# -----------------------------------------------------------------------------
# WP-CLI – pinned version + checksum (supply-chain protection)
# -----------------------------------------------------------------------------
# The init container downloads this phar and the blog_wordpress role then
# executes it with --allow-root, so an altered binary would mean arbitrary
# code execution as root. busybox wget does NOT validate TLS certificates
# ("TLS certificate validation not implemented"), which makes the SHA-512
# check the actual integrity control here, not a nice-to-have.
#
# To upgrade, take both values from the release page (the .sha512 asset sits
# next to the .phar):
#   https://github.com/wp-cli/wp-cli/releases
blog_wp_cli_version: "2.12.0"
blog_wp_cli_sha512:  "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832"

# =============================================================================
# Monitoring exporters – host + sidecar images
# Check for new versions:
#   mysqld_exporter:  https://github.com/prometheus/mysqld_exporter/releases
#   php-fpm_exporter: https://github.com/hipages/php-fpm_exporter/releases
# =============================================================================
mysqld_exporter_version:      "0.20.0"
blog_image_mysqld_exporter:   "prom/mysqld-exporter:v0.20.0"
blog_image_fpm_exporter:      "hipages/php-fpm_exporter:2.2.0"
nextcloud_image_fpm_exporter: "hipages/php-fpm_exporter:2.2.0"

# =============================================================================
# Per-host resource sizing (K3s requests/limits + Collabora concurrency)
# =============================================================================
# These were hardcoded in the deployment templates and sized for the original
# ~8 GB production hosts. They are variables now so each host can size to its
# own hardware - override in inventory/host_vars/<host>/vars.yml. A roomy host
# (cvjm: 8 vCPU / 24 GB) keeps/raises them; a smaller host (e.g. sofie) lowers
# them. The defaults below reproduce the previous hardcoded values, so any host
# that overrides nothing behaves exactly as before.
#
# Nextcloud PHP-FPM container (worker counts are separate: nextcloud_fpm_max_children etc.)
nextcloud_fpm_mem_request: "512Mi"
nextcloud_fpm_cpu_request: "250m"
nextcloud_fpm_mem_limit:   "4Gi"
nextcloud_fpm_cpu_limit:   "1500m"
#
# Collabora container. Concurrent-document capacity is bounded mainly by memory
# (~150-200 MB per open document): the 3Gi default comfortably serves ~12
# simultaneous editors, the realistic ceiling here (151 users total, far fewer
# editing at once). num_prealloc_children pre-forks kit processes for faster
# first opens; max_concurrency is CPU threads per open document.
collabora_mem_request:    "1Gi"
collabora_cpu_request:    "500m"
collabora_mem_limit:      "3Gi"
collabora_cpu_limit:      "2000m"
collabora_num_prealloc:    4
collabora_max_concurrency: 4

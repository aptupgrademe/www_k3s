---
# =============================================================================
# Role: common_sysctl
# Purpose: Kernel tuning for web server performance (TCP BBR, connection
#          timeouts, backlog).  Applied via /etc/sysctl.d/ – persistent
#          across reboots.
# =============================================================================
#
# Also deploys the CIS network hardening sysctls (98-cis-hardening.conf) and
# sets Transparent Huge Pages to madvise.
#
# How it works: files in /etc/sysctl.d/ are read at boot (persistent);
# "sysctl --system" applies them now. A file in /etc/modules-load.d/ loads
# a kernel module at every boot.
#
# Ansible concepts used here:
#   template + notify "apply sysctl"  re-apply only when a file changed...
#   ...plus an unconditional "Apply settings immediately" task: that one
#                  also restores values someone changed at runtime with
#                  "sysctl -w", which no file change would notice.
#                  changed_when: false because it cannot tell either way.
#   systemd-run    see the comments below - the SSH session is sandboxed
#                  by common_ssh, so kernel tunables are written from a
#                  transient unit under PID 1 instead

# community.general.modprobe reads /lib/modules/<kernel>/modules.builtin to
# check module state. sshd's hardening drop-in (common_ssh, already deployed
# and active by this point in the play – common_ssh runs before common_sysctl)
# masks /lib/modules as empty inside the SSH session's private mount
# namespace, so that read fails with a misleading "No such file or directory"
# instead of a permission error. Load it via systemd-run instead, escaping
# that sandbox, and write the persistent modules-load.d entry directly (what
# modprobe's persistent=present does internally) so it also loads at boot via
# systemd-modules-load.service – unaffected since that's not an SSH session.
- name: Sysctl | Load tcp_bbr kernel module
  ansible.builtin.command: systemd-run --wait --pipe --quiet -- modprobe tcp_bbr
  changed_when: false

- name: Sysctl | Persist tcp_bbr kernel module across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/tcp_bbr.conf
    content: |
      tcp_bbr
    owner: root
    group: root
    mode: "0644"

- name: Sysctl | Deploy web server kernel tuning
  ansible.builtin.template:
    src: 99-webserver.conf.j2
    dest: /etc/sysctl.d/99-webserver.conf
    owner: root
    group: root
    mode: "0644"
  notify: apply sysctl

- name: Sysctl | Deploy CIS network hardening
  ansible.builtin.template:
    src: 98-cis-hardening.conf.j2
    dest: /etc/sysctl.d/98-cis-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: apply sysctl

# Run via systemd-run (transient unit under PID 1) rather than directly in
# the SSH session: sshd's hardening drop-in (common_ssh, ProtectKernelTunables=yes)
# masks /proc/sys read-only inside the SSH session's private mount namespace,
# so a plain `sysctl --system` here always fails with "permission denied".
# systemd-run escapes that namespace without touching the hardening itself.
- name: Sysctl | Apply settings immediately
  ansible.builtin.command: systemd-run --wait --pipe --quiet -- sysctl --system
  changed_when: false


# -----------------------------------------------------------------------------
# Transparent Huge Pages – set to madvise (not a sysctl, needs systemd service)
# THP=always causes latency spikes in K3s pods, MariaDB, Redis.
# -----------------------------------------------------------------------------
- name: Sysctl | Deploy THP systemd service (madvise at boot)
  ansible.builtin.copy:
    dest: /etc/systemd/system/set-thp-madvise.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Set Transparent Huge Pages to madvise
      DefaultDependencies=no
      After=sysinit.target local-fs.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo madvise > /sys/kernel/mm/transparent_hugepage/enabled'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  notify: apply thp madvise

- name: Sysctl | Enable THP madvise service
  ansible.builtin.systemd:
    name: set-thp-madvise.service
    enabled: true
    state: started
    daemon_reload: true

# Pressure stall information (PSI): the EL9 kernel is built with PSI off by
# default (CONFIG_PSI_DEFAULT_DISABLED), so /proc/pressure is missing, the
# node_exporter "pressure" collector fails and the Pressure panel of the node
# dashboard stays empty. psi=1 on the kernel command line turns it on - for
# the installed kernels (grubby), for kernels installed later
# (/etc/kernel/cmdline, GRUB_CMDLINE_LINUX). Takes effect at the next boot;
# nothing is rebooted here. Since 2026-10-26.
- name: Sysctl | Boot entries of the installed kernels
  ansible.builtin.command: grubby --info=ALL
  register: sysctl_grubby
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: Sysctl | psi=1 for the installed kernels
  ansible.builtin.command: grubby --update-kernel=ALL --args=psi=1
  when: >-
    sysctl_grubby.stdout_lines | select('match', '^args=')
    | reject('search', '\bpsi=1\b') | list | length > 0
  changed_when: true

- name: Sysctl | psi=1 for kernels installed later (/etc/kernel/cmdline)
  ansible.builtin.replace:
    path: /etc/kernel/cmdline
    regexp: '^(?!.*\bpsi=1\b)(\S.*?)\s*$'
    replace: '\1 psi=1'

- name: Sysctl | psi=1 in GRUB_CMDLINE_LINUX (grub2-mkconfig)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX="(?![^"]*\bpsi=1\b)[^"]*?)\s*"'
    replace: '\1 psi=1"'

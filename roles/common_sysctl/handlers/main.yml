---
# Both handlers run via systemd-run (transient unit under PID 1) rather than
# directly in the SSH session: sshd's hardening drop-in (common_ssh,
# ProtectKernelTunables=yes) masks /proc/sys and /sys read-only inside the
# SSH session's private mount namespace, so writing there directly always
# fails with "permission denied" / "Read-only file system". systemd-run
# escapes that namespace without touching the hardening itself.
- name: apply sysctl
  ansible.builtin.command: systemd-run --wait --pipe --quiet -- sysctl --system
  changed_when: false

- name: apply thp madvise
  ansible.builtin.shell: systemd-run --wait --pipe --quiet -- sh -c 'echo madvise > /sys/kernel/mm/transparent_hugepage/enabled'
  changed_when: false

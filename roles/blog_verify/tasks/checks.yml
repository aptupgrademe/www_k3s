---
# =============================================================================
# BLOCK 1 – SYSTEMDIENSTE (remote: runs on server)
# =============================================================================

- name: Verify | nftables – service active?
  ansible.builtin.command: systemctl is-active nftables
  register: _v_nft_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | nftables – inet filter table loaded?
  ansible.builtin.command: nft list tables
  register: _v_nft_tables
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | nftables – policy drop present?
  ansible.builtin.shell: |
    set -o pipefail
    nft list chain inet filter input 2>/dev/null | grep -c 'policy drop'
  register: _v_nft_policy
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | nftables – banned4 set exists?
  ansible.builtin.command: nft list set inet filter banned4
  register: _v_nft_banned4
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | fail2ban – service active?
  ansible.builtin.command: systemctl is-active fail2ban
  register: _v_f2b_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | fail2ban – jail status
  ansible.builtin.command: fail2ban-client status
  register: _v_f2b_status
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | k3s – service active?
  ansible.builtin.command: systemctl is-active k3s
  register: _v_k3s_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | auditd – service active?
  ansible.builtin.command: systemctl is-active auditd
  register: _v_auditd_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | SELinux – enforcing mode?
  ansible.builtin.command: getenforce
  register: _v_selinux
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false


# =============================================================================
# BLOCK 2 – KUBERNETES WORKLOADS (remote)
# =============================================================================

- name: Verify | K8s – wordpress namespace pods
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get pods -n wordpress --no-headers 2>/dev/null | \
      awk '{print $3}' | sort | uniq -c | awk '{print $2": "$1"x"}'
  register: _v_wp_pods
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | K8s – ingress-nginx pods
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get pods -n ingress-nginx --no-headers 2>/dev/null | \
      awk '{print $3}' | sort | uniq -c | awk '{print $2": "$1"x"}'
  register: _v_ingress_pods
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | K8s – cert-manager pods
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get pods -n cert-manager --no-headers 2>/dev/null | \
      awk '{print $3}' | sort | uniq -c | awk '{print $2": "$1"x"}'
  register: _v_cm_pods
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | K8s – pods in error state (any namespace)?
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get pods -A --no-headers 2>/dev/null | \
      grep -E 'CrashLoopBackOff|OOMKilled|Error' | awk '{print $1"/"$2}' || true
  register: _v_error_pods
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false


# =============================================================================
# BLOCK 3 – HTTPS / WORDPRESS (local: delegate_to localhost)
# =============================================================================

# External connectivity test only – GET / returns 200, never triggers fail2ban.
- name: Verify | HTTPS – external connectivity (HTTP 200)
  ansible.builtin.uri:
    url: "{{ blog_url }}/"
    method: GET
    validate_certs: true
    timeout: "{{ verify_http_timeout }}"
    status_code: 200
    return_content: false
  register: _v_https
  failed_when: false
  delegate_to: localhost
  become: false

# All further HTTP checks run on the server via --resolve → 127.0.0.1.
# fail2ban sees source IP 127.0.0.1 (always in ignoreip) → no self-ban risk.

- name: Verify | HTTPS – response headers via 127.0.0.1 (HSTS, Server, X-Powered-By)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -I "https://{{ blog_hostname }}/" 2>/dev/null | tr '[:upper:]' '[:lower:]'
  register: _v_headers
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | HTTPS – /wp-login.php accessible (200 = login page reachable)
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/wp-login.php" 2>/dev/null || echo 000
  register: _v_wp_login
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false


# =============================================================================
# BLOCK 4 – SECURITY BLOCKING (local)
# =============================================================================

# Security checks run via curl on the server itself (--resolve → 127.0.0.1).
# Source IP is 127.0.0.1, which is always in fail2ban ignoreip.
# This prevents the Ansible controller from getting banned during smoke tests.

- name: Verify | Security – /xmlrpc.php blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/xmlrpc.php" 2>/dev/null || echo 200
  register: _v_xmlrpc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | Security – /.env blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/.env" 2>/dev/null || echo 200
  register: _v_env
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | Security – /readme.html blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/readme.html" 2>/dev/null || echo 200
  register: _v_readme
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | Security – REST API /wp/v2/users (no username leak)
  ansible.builtin.shell: |
    set -o pipefail
    _tmp=$(mktemp)
    _status=$(curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o "$_tmp" -w "%{http_code}" \
      "https://{{ blog_hostname }}/wp-json/wp/v2/users" 2>/dev/null || echo 200)
    _slugs=$(grep -c '"slug"' "$_tmp" 2>/dev/null || echo 0)
    rm -f "$_tmp"
    echo "${_status}|${_slugs}"
  register: _v_rest_users
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false


# =============================================================================
# BLOCK 5 – PERFORMANCE (remote)
# =============================================================================

- name: Verify | Performance – TCP BBR active?
  ansible.builtin.command: sysctl -n net.ipv4.tcp_congestion_control
  register: _v_bbr
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | Performance – OPcache enabled in FPM container?
  ansible.builtin.shell: |
    k3s kubectl exec deployment/wordpress -n wordpress \
      --container wordpress-fpm -- \
      php -r "echo ini_get('opcache.enable') === '1' ? 'yes' : 'no';" 2>/dev/null
  register: _v_opcache
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | Performance – MariaDB reachable from WordPress pod?
  ansible.builtin.shell: |
    k3s kubectl exec deployment/wordpress -n wordpress \
      --container wordpress-fpm -- \
      php -r "
        \$fp = @fsockopen('mariadb', 3306, \$e, \$s, 3);
        echo \$fp ? 'ok' : 'fail';
        if (\$fp) fclose(\$fp);
      " 2>/dev/null || echo "fail"
  register: _v_mariadb
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

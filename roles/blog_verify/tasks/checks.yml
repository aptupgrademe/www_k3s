---
# =============================================================================
# BLOCK 1 – SYSTEMDIENSTE (remote: runs on server)
# =============================================================================
#
# Part 1 of blog_verify: collect. Every task registers its raw result
# (_v_*) with failed_when: false / changed_when: false / check_mode: false
# - see common_verify/tasks/host.yml for why. report.yml judges them.
#
# HTTP status checks: curl -o /dev/null -w "%{http_code}" prints nothing but
# the three-digit status. The fallback after "||" is chosen per check so a
# broken check FAILS instead of passing: "000" where 200 is expected, "200"
# where a block (403/404) is expected.

- name: Verify | Shared host checks (common_verify)
  ansible.builtin.import_role:
    name: common_verify
    tasks_from: host

# =============================================================================
# BLOCK 2 – KUBERNETES WORKLOADS (remote)
# =============================================================================

- name: Verify | K8s – wordpress namespace pods
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get pods -n wordpress --no-headers 2>/dev/null | \
      awk '{print $3}' | sort | uniq -c | awk '{print $2": "$1"x"}'
  register: _v_wp_pods
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | Shared k8s checks (common_verify)
  ansible.builtin.import_role:
    name: common_verify
    tasks_from: k8s

# =============================================================================
# BLOCK 3 – HTTPS / WORDPRESS (first check from the controller, the rest on the server)
# =============================================================================

- name: Verify | Shared http checks (common_verify)
  ansible.builtin.import_role:
    name: common_verify
    tasks_from: http
  vars:
    verify_url: "{{ blog_url }}"
    verify_hostname: "{{ blog_hostname }}"

# All further HTTP checks run on the server via --resolve → 127.0.0.1.
# fail2ban sees source IP 127.0.0.1 (always in ignoreip) → no self-ban risk.

- name: Verify | HTTPS – /wp-login.php accessible (200 = login page reachable)
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/wp-login.php" 2>/dev/null || echo 000
  register: _v_wp_login
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false


# =============================================================================
# BLOCK 4 – SECURITY BLOCKING (on the server, via 127.0.0.1)
# =============================================================================

# Security checks run via curl on the server itself (--resolve → 127.0.0.1).
# Source IP is 127.0.0.1, which is always in fail2ban ignoreip.
# This prevents the Ansible controller from getting banned during smoke tests.

- name: Verify | Security – /xmlrpc.php blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/xmlrpc.php" 2>/dev/null || echo 200
  register: _v_xmlrpc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | Security – /readme.html blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/readme.html" 2>/dev/null || echo 200
  register: _v_readme
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# WordPress lists user accounts (with their login "slug") at this REST
# endpoint unless blocked - half of what a brute-force attack needs. The
# output is "status|number of slugs"; report.yml accepts either a refusal
# (401/403) or a response without any slug.
- name: Verify | Security – REST API /wp/v2/users (no username leak)
  ansible.builtin.shell: |
    set -o pipefail
    _tmp=$(mktemp)
    _status=$(curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o "$_tmp" -w "%{http_code}" \
      "https://{{ blog_hostname }}/wp-json/wp/v2/users" 2>/dev/null || echo 200)
    _slugs=$(grep -c '"slug"' "$_tmp" 2>/dev/null || echo 0)
    rm -f "$_tmp"
    echo "${_status}|${_slugs}"
  register: _v_rest_users
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false


# =============================================================================
# BLOCK 5 – PERFORMANCE (remote)
# =============================================================================

# kubectl exec runs a command inside the running pod; php -r runs one
# line of PHP there and prints yes/no from the live PHP configuration.
- name: Verify | Performance – OPcache enabled in FPM container?
  ansible.builtin.shell: |
    k3s kubectl exec deployment/wordpress -n wordpress \
      --container wordpress-fpm -- \
      php -r "echo ini_get('opcache.enable') === '1' ? 'yes' : 'no';" 2>/dev/null
  register: _v_opcache
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# A plain TCP connect from the WordPress pod to the "mariadb" Service -
# proves DNS, the NetworkPolicy and the database port, without a login.
# MariaDB logs each of these as "Aborted connection ... unauthenticated"
# (a warning, harmless - it is this check).
- name: Verify | Performance – MariaDB reachable from WordPress pod?
  ansible.builtin.shell: |
    k3s kubectl exec deployment/wordpress -n wordpress \
      --container wordpress-fpm -- \
      php -r "
        \$fp = @fsockopen('mariadb', 3306, \$e, \$s, 3);
        echo \$fp ? 'ok' : 'fail';
        if (\$fp) fclose(\$fp);
      " 2>/dev/null || echo "fail"
  register: _v_mariadb
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

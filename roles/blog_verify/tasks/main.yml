---
# =============================================================================
# Role: blog_verify
# Purpose: Post-deployment smoke tests for the WordPress blog stack.
#          All checks run regardless of individual failures (failed_when: false).
#          Results are collected and displayed as a colored terminal report.
#          The play fails at the end if any CRITICAL check did not pass.
# =============================================================================

# ANSI color codes – double-quoted YAML strings interpret \x1b as ESC (ASCII 27)
- name: Verify | Set report color codes
  ansible.builtin.set_fact:
    _g: "\x1b[32m"     # green   – check passed
    _r: "\x1b[31m"     # red     – check failed
    _y: "\x1b[33m"     # yellow  – warning
    _h: "\x1b[1;36m"   # bold cyan – section headings
    _b: "\x1b[1m"      # bold
    _z: "\x1b[0m"      # reset
    _ok: "\x1b[32m✓\x1b[0m"
    _fail: "\x1b[31m✗\x1b[0m"


# =============================================================================
# BLOCK 1 – SYSTEMDIENSTE (remote: runs on server)
# =============================================================================

- name: Verify | nftables – service active?
  ansible.builtin.command: systemctl is-active nftables
  register: _v_nft_svc
  changed_when: false
  failed_when: false

- name: Verify | nftables – inet filter table loaded?
  ansible.builtin.command: nft list tables
  register: _v_nft_tables
  changed_when: false
  failed_when: false

- name: Verify | nftables – policy drop present?
  ansible.builtin.shell: nft list chain inet filter input 2>/dev/null | grep -c 'policy drop'
  register: _v_nft_policy
  changed_when: false
  failed_when: false

- name: Verify | nftables – banned4 set exists?
  ansible.builtin.command: nft list set inet filter banned4
  register: _v_nft_banned4
  changed_when: false
  failed_when: false

- name: Verify | fail2ban – service active?
  ansible.builtin.command: systemctl is-active fail2ban
  register: _v_f2b_svc
  changed_when: false
  failed_when: false

- name: Verify | fail2ban – jail status
  ansible.builtin.command: fail2ban-client status
  register: _v_f2b_status
  changed_when: false
  failed_when: false

- name: Verify | k3s – service active?
  ansible.builtin.command: systemctl is-active k3s
  register: _v_k3s_svc
  changed_when: false
  failed_when: false

- name: Verify | auditd – service active?
  ansible.builtin.command: systemctl is-active auditd
  register: _v_auditd_svc
  changed_when: false
  failed_when: false

- name: Verify | SELinux – enforcing mode?
  ansible.builtin.command: getenforce
  register: _v_selinux
  changed_when: false
  failed_when: false


# =============================================================================
# BLOCK 2 – KUBERNETES WORKLOADS (remote)
# =============================================================================

- name: Verify | K8s – wordpress namespace pods
  ansible.builtin.shell: |
    k3s kubectl get pods -n wordpress --no-headers 2>/dev/null | \
      awk '{print $3}' | sort | uniq -c | awk '{print $2": "$1"x"}'
  register: _v_wp_pods
  changed_when: false
  failed_when: false

- name: Verify | K8s – ingress-nginx pods
  ansible.builtin.shell: |
    k3s kubectl get pods -n ingress-nginx --no-headers 2>/dev/null | \
      awk '{print $3}' | sort | uniq -c | awk '{print $2": "$1"x"}'
  register: _v_ingress_pods
  changed_when: false
  failed_when: false

- name: Verify | K8s – cert-manager pods
  ansible.builtin.shell: |
    k3s kubectl get pods -n cert-manager --no-headers 2>/dev/null | \
      awk '{print $3}' | sort | uniq -c | awk '{print $2": "$1"x"}'
  register: _v_cm_pods
  changed_when: false
  failed_when: false

- name: Verify | K8s – pods in error state (any namespace)?
  ansible.builtin.shell: |
    k3s kubectl get pods -A --no-headers 2>/dev/null | \
      grep -E 'CrashLoopBackOff|OOMKilled|Error' | awk '{print $1"/"$2}' || true
  register: _v_error_pods
  changed_when: false
  failed_when: false


# =============================================================================
# BLOCK 3 – HTTPS / WORDPRESS (local: delegate_to localhost)
# =============================================================================

# External connectivity test only – GET / returns 200, never triggers fail2ban.
- name: Verify | HTTPS – external connectivity (HTTP 200)
  ansible.builtin.uri:
    url: "{{ blog_url }}/"
    method: GET
    validate_certs: true
    timeout: "{{ verify_http_timeout }}"
    status_code: 200
    return_content: false
  register: _v_https
  failed_when: false
  delegate_to: localhost
  become: false

# All further HTTP checks run on the server via --resolve → 127.0.0.1.
# fail2ban sees source IP 127.0.0.1 (always in ignoreip) → no self-ban risk.

- name: Verify | HTTPS – response headers via 127.0.0.1 (HSTS, Server, X-Powered-By)
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -I "https://{{ blog_hostname }}/" 2>/dev/null | tr '[:upper:]' '[:lower:]'
  register: _v_headers
  changed_when: false
  failed_when: false

- name: Verify | HTTPS – /wp-login.php accessible (200 = login page reachable)
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/wp-login.php" 2>/dev/null || echo 000
  register: _v_wp_login
  changed_when: false
  failed_when: false


# =============================================================================
# BLOCK 4 – SECURITY BLOCKING (local)
# =============================================================================

# Security checks run via curl on the server itself (--resolve → 127.0.0.1).
# Source IP is 127.0.0.1, which is always in fail2ban ignoreip.
# This prevents the Ansible controller from getting banned during smoke tests.

- name: Verify | Security – /xmlrpc.php blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/xmlrpc.php" 2>/dev/null || echo 200
  register: _v_xmlrpc
  changed_when: false
  failed_when: false

- name: Verify | Security – /.env blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/.env" 2>/dev/null || echo 200
  register: _v_env
  changed_when: false
  failed_when: false

- name: Verify | Security – /readme.html blocked?
  ansible.builtin.shell: |
    curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o /dev/null -w "%{http_code}" \
      "https://{{ blog_hostname }}/readme.html" 2>/dev/null || echo 200
  register: _v_readme
  changed_when: false
  failed_when: false

- name: Verify | Security – REST API /wp/v2/users (no username leak)
  ansible.builtin.shell: |
    _tmp=$(mktemp)
    _status=$(curl -sk --max-time {{ verify_http_timeout }} \
      --resolve "{{ blog_hostname }}:443:127.0.0.1" \
      -o "$_tmp" -w "%{http_code}" \
      "https://{{ blog_hostname }}/wp-json/wp/v2/users" 2>/dev/null || echo 200)
    _slugs=$(grep -c '"slug"' "$_tmp" 2>/dev/null || echo 0)
    rm -f "$_tmp"
    echo "${_status}|${_slugs}"
  register: _v_rest_users
  changed_when: false
  failed_when: false


# =============================================================================
# BLOCK 5 – PERFORMANCE (remote)
# =============================================================================

- name: Verify | Performance – TCP BBR active?
  ansible.builtin.command: sysctl -n net.ipv4.tcp_congestion_control
  register: _v_bbr
  changed_when: false
  failed_when: false

- name: Verify | Performance – OPcache enabled in FPM container?
  ansible.builtin.shell: |
    k3s kubectl exec deployment/wordpress -n wordpress \
      --container wordpress-fpm -- \
      php -r "echo ini_get('opcache.enable') === '1' ? 'yes' : 'no';" 2>/dev/null
  register: _v_opcache
  changed_when: false
  failed_when: false

- name: Verify | Performance – MariaDB reachable from WordPress pod?
  ansible.builtin.shell: |
    k3s kubectl exec deployment/wordpress -n wordpress \
      --container wordpress-fpm -- \
      php -r "
        \$fp = @fsockopen('mariadb', 3306, \$e, \$s, 3);
        echo \$fp ? 'ok' : 'fail';
        if (\$fp) fclose(\$fp);
      " 2>/dev/null || echo "fail"
  register: _v_mariadb
  changed_when: false
  failed_when: false


# =============================================================================
# COMPUTE BOOLEAN RESULTS
# =============================================================================

- name: Verify | Compute pass/fail for each check
  ansible.builtin.set_fact:
    # Dienste
    _r_nft_svc:     "{{ _v_nft_svc.stdout | default('') == 'active' }}"
    _r_nft_tables:  "{{ 'inet filter' in (_v_nft_tables.stdout | default('')) }}"
    _r_nft_policy:  "{{ (_v_nft_policy.stdout | default('0') | trim | int) > 0 }}"
    _r_nft_banned4: "{{ _v_nft_banned4.rc | default(1) == 0 }}"
    _r_f2b_svc:     "{{ _v_f2b_svc.stdout | default('') == 'active' }}"
    _r_f2b_jails:   "{{ (_v_f2b_status.stdout | default('') | regex_search('Number of jail:\\s*(\\d+)', '\\1') | default([], true) | first | default('0') | int) >= verify_f2ban_min_jails }}"
    _r_k3s:         "{{ _v_k3s_svc.stdout | default('') == 'active' }}"
    _r_auditd:      "{{ _v_auditd_svc.stdout | default('') == 'active' }}"
    _r_selinux:     "{{ _v_selinux.stdout | default('') == 'Enforcing' }}"
    # K8s
    _r_wp_pods:     "{{ 'Running' in (_v_wp_pods.stdout | default('')) }}"
    _r_ingress:     "{{ 'Running' in (_v_ingress_pods.stdout | default('')) }}"
    _r_certmgr:     "{{ 'Running' in (_v_cm_pods.stdout | default('')) }}"
    _r_noerror:     "{{ (_v_error_pods.stdout | default('') | trim) == '' }}"
    # HTTPS – basic connectivity from external (uri module, delegate_to: localhost)
    _r_https:       "{{ _v_https.status | default(0) == 200 }}"
    _r_tls:         "{{ _v_https.status | default(0) == 200 }}"
    # Headers – parsed from curl -I via 127.0.0.1 (all lowercase, safe from fail2ban)
    _r_hsts:        "{{ 'strict-transport-security' in (_v_headers.stdout | default('')) }}"
    _r_server:      "{{ 'nginx/' not in (_v_headers.stdout | default('')) }}"
    _r_no_xpb:      "{{ 'x-powered-by' not in (_v_headers.stdout | default('')) }}"
    # wp-login – curl stdout is the HTTP status code
    _r_wp_login:    "{{ _v_wp_login.stdout | default('000') | trim | int == 200 }}"
    # Security (curl via 127.0.0.1 → stdout is the HTTP status code)
    _r_xmlrpc:      "{{ _v_xmlrpc.stdout | default('200') | trim | int in [400, 401, 403, 404, 444] }}"
    _r_env:         "{{ _v_env.stdout | default('200') | trim | int in [400, 401, 403, 404, 444] }}"
    _r_readme:      "{{ _v_readme.stdout | default('200') | trim | int in [400, 401, 403, 404, 444] }}"
    _r_restapi:     "{{ (_v_rest_users.stdout.split('|')[1] | default('1') | int == 0) or (_v_rest_users.stdout.split('|')[0] | default('200') | int in [401, 403]) }}"
    # Performance
    _r_bbr:         "{{ (_v_bbr.stdout | default('') | trim) == 'bbr' }}"
    _r_opcache:     "{{ (_v_opcache.stdout | default('') | trim) == 'yes' }}"
    _r_mariadb:     "{{ (_v_mariadb.stdout | default('') | trim) == 'ok' }}"

    # Detail strings for the report
    _d_f2b_jails:   "{{ _v_f2b_status.stdout | default('') | regex_search('Jail list:\\s*(.*)', '\\1') | default([], true) | first | default('?') | trim }}"
    _d_wp_pods:     "{{ _v_wp_pods.stdout | default('?') | trim | replace('\n', '  ') }}"
    _d_ingress:     "{{ _v_ingress_pods.stdout | default('?') | trim | replace('\n', '  ') }}"
    _d_certmgr:     "{{ _v_cm_pods.stdout | default('?') | trim | replace('\n', '  ') }}"
    _d_error_pods:  "{{ _v_error_pods.stdout | default('') | trim | replace('\n', ', ') | default('none', true) }}"
    _d_server_hdr:  "{{ _v_headers.stdout | default('') | regex_search('server: ([^\r\n]+)', '\\1') | default([], true) | first | default('(not set)') }}"
    _d_rest:        "{{ 'no username leak' if (_v_rest_users.stdout.split('|')[1] | default('1') | int == 0) else 'USERNAME LEAK – check!' }}"


# =============================================================================
# COUNT TOTAL PASS / FAIL
# =============================================================================

- name: Verify | Count passing checks
  ansible.builtin.set_fact:
    _pass_count: >-
      {{
        [_r_nft_svc, _r_nft_tables, _r_nft_policy, _r_nft_banned4,
         _r_f2b_svc, _r_f2b_jails, _r_k3s, _r_auditd, _r_selinux,
         _r_wp_pods, _r_ingress, _r_certmgr, _r_noerror,
         _r_https, _r_tls, _r_hsts, _r_server, _r_no_xpb, _r_wp_login,
         _r_xmlrpc, _r_env, _r_readme, _r_restapi,
         _r_bbr, _r_opcache, _r_mariadb]
        | select | list | length
      }}
    _total_count: 26


# =============================================================================
# COLORED REPORT
# =============================================================================

- name: Verify | Print report
  ansible.builtin.debug:
    msg: |

      {{ _h }}╔══════════════════════════════════════════════════════════╗{{ _z }}
      {{ _h }}║       DEPLOYMENT VERIFICATION  ·  blog.yml              ║{{ _z }}
      {{ _h }}╚══════════════════════════════════════════════════════════╝{{ _z }}

      {{ _h }}── System Services ───────────────────────────────────────────{{ _z }}
        {{ _ok if _r_nft_svc | bool else _fail }}  nftables service             {{ 'active' if _r_nft_svc | bool else _r ~ 'INACTIVE' ~ _z }}
        {{ _ok if _r_nft_tables | bool else _fail }}  nftables inet filter         {{ 'loaded' if _r_nft_tables | bool else _r ~ 'NOT LOADED' ~ _z }}
        {{ _ok if _r_nft_policy | bool else _fail }}  nftables policy drop         {{ 'active' if _r_nft_policy | bool else _r ~ 'MISSING – firewall is open!' ~ _z }}
        {{ _ok if _r_nft_banned4 | bool else _fail }}  nftables banned4 set         {{ 'present' if _r_nft_banned4 | bool else _r ~ 'MISSING – fail2ban bans have no effect!' ~ _z }}
        {{ _ok if _r_f2b_svc | bool else _fail }}  fail2ban service             {{ 'active' if _r_f2b_svc | bool else _r ~ 'INACTIVE' ~ _z }}
        {{ _ok if _r_f2b_jails | bool else _fail }}  fail2ban jails               {{ _d_f2b_jails }}
        {{ _ok if _r_k3s | bool else _fail }}  k3s service                  {{ 'active' if _r_k3s | bool else _r ~ 'INACTIVE' ~ _z }}
        {{ _ok if _r_auditd | bool else _fail }}  auditd service               {{ 'active' if _r_auditd | bool else _r ~ 'INACTIVE' ~ _z }}
        {{ _ok if _r_selinux | bool else _fail }}  SELinux                      {{ _v_selinux.stdout | default('?') }}

      {{ _h }}── Kubernetes Workloads ─────────────────────────────────────{{ _z }}
        {{ _ok if _r_wp_pods | bool else _fail }}  wordpress namespace          {{ _d_wp_pods if _d_wp_pods != '?' else _r ~ 'no pods found' ~ _z }}
        {{ _ok if _r_ingress | bool else _fail }}  ingress-nginx namespace      {{ _d_ingress if _d_ingress != '?' else _r ~ 'no pods found' ~ _z }}
        {{ _ok if _r_certmgr | bool else _fail }}  cert-manager namespace       {{ _d_certmgr if _d_certmgr != '?' else _r ~ 'no pods found' ~ _z }}
        {{ _ok if _r_noerror | bool else _fail }}  pods in error state          {{ _r ~ _d_error_pods ~ _z if not (_r_noerror | bool) else 'none' }}

      {{ _h }}── HTTPS / WordPress ─────────────────────────────────────────{{ _z }}
        {{ _ok if _r_https | bool else _fail }}  GET {{ blog_url }}/     HTTP {{ _v_https.status | default('TIMEOUT') }}
        {{ _ok if _r_tls | bool else _fail }}  TLS certificate              {{ 'valid' if _r_tls | bool else _r ~ 'INVALID or expired!' ~ _z }}
        {{ _ok if _r_hsts | bool else _fail }}  HSTS header                  {{ 'present' if _r_hsts | bool else _r ~ 'MISSING' ~ _z }}
        {{ _ok if _r_server | bool else _fail }}  Server header (no leak)      {{ _d_server_hdr }}
        {{ _ok if _r_no_xpb | bool else _fail }}  X-Powered-By                 {{ 'not present' if _r_no_xpb | bool else _r ~ 'FOUND – PHP version leaked!' ~ _z }}
        {{ _ok if _r_wp_login | bool else _fail }}  /wp-login.php reachable      HTTP {{ _v_wp_login.stdout | default('TIMEOUT') | trim }}

      {{ _h }}── Security / Blocking ───────────────────────────────────────{{ _z }}
        {{ _ok if _r_xmlrpc | bool else _fail }}  /xmlrpc.php                  HTTP {{ _v_xmlrpc.stdout | default('?') | trim }}{{ '' if _r_xmlrpc | bool else _r ~ '  ← must be blocked!' ~ _z }}
        {{ _ok if _r_env | bool else _fail }}  /.env                        HTTP {{ _v_env.stdout | default('?') | trim }}{{ '' if _r_env | bool else _r ~ '  ← must be blocked!' ~ _z }}
        {{ _ok if _r_readme | bool else _fail }}  /readme.html                 HTTP {{ _v_readme.stdout | default('?') | trim }}{{ '' if _r_readme | bool else _r ~ '  ← must be blocked!' ~ _z }}
        {{ _ok if _r_restapi | bool else _fail }}  REST API /wp/v2/users        {{ _d_rest }}

      {{ _h }}── Performance ───────────────────────────────────────────────{{ _z }}
        {{ _ok if _r_bbr | bool else _fail }}  TCP BBR                      {{ _v_bbr.stdout | default('?') | trim }}
        {{ _ok if _r_opcache | bool else _fail }}  PHP OPcache                  {{ 'enabled' if _r_opcache | bool else _r ~ 'disabled' ~ _z }}
        {{ _ok if _r_mariadb | bool else _fail }}  MariaDB connection           {{ 'ok' if _r_mariadb | bool else _r ~ 'FAILED' ~ _z }}

      {{ _h }}══════════════════════════════════════════════════════════════{{ _z }}
      {% if _pass_count | int == _total_count | int %}
        {{ _g }}{{ _b }}  RESULT:  {{ _pass_count }}/{{ _total_count }} checks passed  ✓  ALL OK{{ _z }}
      {% else %}
        {{ _r }}{{ _b }}  RESULT:  {{ _pass_count }}/{{ _total_count }} checks passed  ✗  {{ _total_count | int - _pass_count | int }} FAILED{{ _z }}
      {% endif %}
      {{ _h }}══════════════════════════════════════════════════════════════{{ _z }}


# =============================================================================
# ASSERT – kritische Checks müssen bestehen, sonst schlägt das Play fehl
# =============================================================================

- name: Verify | Assert critical checks
  ansible.builtin.assert:
    that:
      - _r_nft_svc | bool
      - _r_nft_tables | bool
      - _r_nft_policy | bool
      - _r_k3s | bool
      - _r_wp_pods | bool
      - _r_ingress | bool
      - _r_noerror | bool
      - _r_https | bool
      - _r_tls | bool
      - _r_xmlrpc | bool
      - _r_env | bool
    quiet: true
    fail_msg: >-
      {{ _r ~ _b }}Critical checks failed – see report above for details.{{ _z }}
    success_msg: >-
      {{ _g ~ _b }}All critical checks passed.{{ _z }}

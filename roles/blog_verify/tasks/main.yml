---
# =============================================================================
# Role: blog_verify
# Purpose: Post-deployment smoke tests for the WordPress blog stack.
#          All checks run regardless of individual failures (failed_when: false).
#          Results are collected and displayed as a colored terminal report.
#          The play fails at the end if any CRITICAL check did not pass.
# =============================================================================

# ANSI color codes – double-quoted YAML strings interpret \x1b as ESC (ASCII 27)
- name: Verify | Set report color codes
  ansible.builtin.set_fact:
    _g: "\x1b[32m"     # green   – check passed
    _r: "\x1b[31m"     # red     – check failed
    _y: "\x1b[33m"     # yellow  – warning
    _h: "\x1b[1;36m"   # bold cyan – section headings
    _b: "\x1b[1m"      # bold
    _z: "\x1b[0m"      # reset
    _ok: "\x1b[32m✓\x1b[0m"
    _fail: "\x1b[31m✗\x1b[0m"

- name: blog_verify | Checks (services, K8s, HTTPS, security, performance)
  ansible.builtin.import_tasks: checks.yml

- name: blog_verify | Results, report, e-mail, assert, optional Monit selftest
  ansible.builtin.import_tasks: report.yml

---
# Minimum days before TLS cert expiry to consider it "valid"
#
# defaults/ = lowest-priority role variables (any inventory value wins).
# verify_cert_min_days is currently not read by any task - the TLS check
# relies on validate_certs (valid chain, not expired) instead.

verify_cert_min_days: 30

# HTTP timeout for URL checks (seconds)
verify_http_timeout: 15

# Minimum number of expected fail2ban jails
verify_f2ban_min_jails: 4

---
# First run only (included from main.yml with "when: ssh_first_run"): reboot
# to activate the new SSH port and firewall together, then reconnect on 10022.
# A separate file because meta: reset_connection ignores "when" - inside a
# conditional block it ran (as a no-op reconnect) on every run and printed
# "reset_connection task does not support when conditional". include_tasks
# evaluates its condition before any task in here is loaded.

# The reboot must be SENT over the current connection (port 22): sshd only
# moves to 10022 when it starts again. An earlier version used the reboot
# module with task-level "vars: ansible_port: 10022" - but task vars apply
# to the whole task, including the connection that issues the reboot, so it
# failed right away with "port 10022: Connection refused" and the host was
# never rebooted (found on the sofie VPS, 2026-09-29). Fire-and-forget over
# port 22, then switch the port and wait for the host to come back.
- name: First run | Reboot (sent over the current port-22 connection)
  ansible.builtin.shell: sleep 2 && systemctl reboot
  async: 1
  poll: 0

- name: First run | Use the new SSH port for the rest of this run
  ansible.builtin.set_fact:
    ansible_port: 10022

- name: First run | Drop the old multiplexed connection on port 22
  ansible.builtin.meta: reset_connection

- name: First run | Wait until the host answers on port 10022
  ansible.builtin.wait_for_connection:
    delay: 30
    timeout: 300

- name: First run | Reminder to persist the new port for future runs
  ansible.builtin.debug:
    msg: >-
      This run has switched to port 10022 and will finish over it, but
      that's only in-memory for this run. Before the next separate
      playbook invocation, change ansible_port from 22 to 10022 in
      inventory/host_vars/{{ inventory_hostname }}/vars.yml - otherwise
      Ansible won't know where to connect and this run's automation
      can't help with that part.

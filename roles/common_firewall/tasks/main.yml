---
# =============================================================================
# Role: firewall
# Purpose: Deploy IPv4/IPv6 nftables packet-filter rules via a single template.
#          /etc/sysconfig/nftables.conf is the file read by the nftables systemd
#          service on AlmaLinux 9 at boot (ExecStart) and on reload (ExecReload).
#          The commonly referenced /etc/nftables.conf is NOT used by the service.
#          Using the systemd service is safe on a live K3s node: K3s manages
#          its own KUBE-* chains in iptables (a separate subsystem), so there
#          is no lock contention with nftables.
# Target:  AlmaLinux 9
# =============================================================================


# -----------------------------------------------------------------------------
# Prerequisites
# -----------------------------------------------------------------------------
- name: Install nftables
  ansible.builtin.package:
    name:
      - nftables
    state: present


# -----------------------------------------------------------------------------
# Deploy ruleset to the file the nftables systemd service actually reads.
# AlmaLinux 9: ExecStart=/sbin/nft -f /etc/sysconfig/nftables.conf
# -----------------------------------------------------------------------------
- name: Upload nftables ruleset (templated)
  ansible.builtin.template:
    src: fw.nft.j2
    dest: /etc/sysconfig/nftables.conf
    owner: root
    group: root
    mode: "0640"
  notify: Reload nftables

# On AlmaLinux 9 the active config is /etc/sysconfig/nftables.conf.
# /etc/nftables.conf is a distro default stub that is NOT loaded by the
# systemd unit — but a stale copy could cause confusion on manual reloads.
- name: Remove stale /etc/nftables.conf if it differs from the active config
  ansible.builtin.file:
    path: /etc/nftables.conf
    state: absent
  when: ansible_distribution == 'AlmaLinux'

- name: Enable and start nftables service
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true

---
# =============================================================================
# Role: common_firewall
# Purpose: Deploy IPv4/IPv6 nftables packet-filter rules via a single template.
#          /etc/sysconfig/nftables.conf is the file read by the nftables systemd
#          service on AlmaLinux 9 at boot (ExecStart) and on reload (ExecReload).
#          The commonly referenced /etc/nftables.conf is NOT used by the service.
#          K3s (kube-proxy, flannel, its network policy controller) writes
#          its rules through iptables-nft into its OWN nftables tables (all
#          hosts since 2026-10-19; the blog used iptables-legacy before). For
#          the second case this role only ever replaces table
#          "inet filter" ("delete table" + recreate in fw.nft.j2, and the
#          systemd drop-in below scopes reload/stop the same way) - never
#          "flush ruleset", which would wipe K3s's tables too.
# Target:  AlmaLinux 9
# Variables: addresses come from the inventory (group_vars/all/main.yml and
#            host_vars/<host>/vars.yml); the only role defaults are the
#            optional SSH country filter (fw_ssh_geo_countries/_extra).
# =============================================================================
#
# How it works (top to bottom):
#   1. detect DHCP vs static addressing (the template needs to know)
#   2. optional SSH country allowlist: script, config, list, weekly timer
#   3. render the ruleset template to /etc/sysconfig/nftables.conf,
#      VALIDATED with "nft -c" before it replaces the live file
#   4. systemd drop-in so reload/stop only touch our own table
#   5. enable nftables; start it now - except on the very first run, which
#      ends with a reboot instead (first_run_reboot.yml)
#   6. clean-up of leftovers (old iptables scripts, /etc/nftables.conf,
#      firewalld)
#
# Ansible concepts used here:
#   template validate: "nft -c -f %s"  Ansible writes the rendered file to a
#                  temp path, runs the command on it (%s = that path) and only
#                  replaces the destination if it exits 0. A syntax error can
#                  never reach the live firewall config.
#   block + when   the whole country-filter part on/off with one condition
#   to_nice_json   renders a dict as pretty JSON (the geo config file)
#   daemon_reload: "{{ _geo_units.changed }}"  a module option computed
#                  from an earlier result: reload systemd only if a unit
#                  file changed
#   include_tasks + when + apply  see the comment at the first-run include
#                  at the end (and first_run_reboot.yml)
#   cron state: absent  removes a crontab entry identified by its name


# -----------------------------------------------------------------------------
# Prerequisites
# -----------------------------------------------------------------------------
- name: Firewall | Install nftables
  ansible.builtin.package:
    name:
      - nftables
    state: present


# -----------------------------------------------------------------------------
# Static or DHCP? Decides whether the template renders the DHCP rules at all.
# The blog provider hands out IPv4 by DHCP (IPv6 is static); the Nextcloud VPS provider (cvjm, sofie)
# is static for both families. Read from NetworkManager instead of an
# inventory flag, so a provider change can never leave a stale setting behind.
# If detection fails, both default to true: allowing DHCP is harmless, a
# missing rule on a DHCP host can cost the address on the next renewal.
# -----------------------------------------------------------------------------
- name: Firewall | Detect whether IPv4/IPv6 are configured by DHCP (NetworkManager)
  ansible.builtin.shell: |
    set -o pipefail
    dev=$(ip -4 route show default | awk '{print $5; exit}')
    con=$(nmcli -g GENERAL.CONNECTION device show "$dev")
    nmcli -g ipv4.method,ipv6.method connection show "$con"
  register: _fw_ipmethods
  changed_when: false
  failed_when: false
  check_mode: false

- name: Firewall | Remember the address configuration for the template
  ansible.builtin.set_fact:
    fw_dhcp4: "{{ _fw_ipmethods.rc != 0 or _fw_ipmethods.stdout_lines[0] | default('auto') == 'auto' }}"
    fw_dhcp6: "{{ _fw_ipmethods.rc != 0 or _fw_ipmethods.stdout_lines[1] | default('auto') in ['auto', 'dhcp'] }}"


# -----------------------------------------------------------------------------
# SSH country allowlist (fw_ssh_geo_countries, off by default - see defaults).
# Runs BEFORE the ruleset template: the template includes
# /etc/nftables/ssh-geo.nft and its "nft -c" validation reads that file, so
# the list must exist first. If the very first download fails, the play
# stops here - before any rule that could lock SSH out is written.
# The list lives in /etc/nftables (etc_t): the nftables unit loads the
# ruleset in a confined SELinux domain that reads etc_t, not var_lib_t; a
# file it cannot read would make the whole ruleset fail at boot.
# -----------------------------------------------------------------------------
- name: Firewall | SSH country allowlist
  when: fw_ssh_geo_countries | length > 0
  block:
    - name: SSH geo | Install the update script
      ansible.builtin.copy:
        src: ssh-geo-update
        dest: /usr/local/sbin/ssh-geo-update
        owner: root
        group: root
        mode: "0755"

    - name: SSH geo | Write the country list
      ansible.builtin.copy:
        dest: /etc/ssh-geo.conf
        owner: root
        group: root
        mode: "0644"
        content: "{{ {'countries': fw_ssh_geo_countries, 'extra': fw_ssh_geo_extra,
                      'nginx_targets': [_geo_ingress] + ([_geo_blog] if stack == 'wordpress' else [])}
                     | to_nice_json }}\n"
      register: _geo_conf
      vars:
        # Every host: the same list as an nginx geo file for the ingress
        # controller, which answers 403 on /grafana outside these countries
        # (common_k3s mounts the directory, the Grafana ingresses check it).
        # The reload fails harmlessly on a fresh host before K3s exists.
        _geo_ingress:
          out: "{{ ingress_admin_geo_dir }}/admin-geo.conf"
          reload: [/usr/local/bin/k3s, kubectl, -n, ingress-nginx, exec, ds/ingress-nginx-nginx-ingress-controller, --, nginx, -s, reload]
        # Blog: the WordPress admin filter (blog_k3s_deploy), reloaded in the
        # running nginx container of the WordPress pod.
        _geo_blog:
          out: "{{ blog_admin_geo_dir }}/admin-geo.conf"
          reload: [/usr/local/bin/k3s, kubectl, -n, wordpress, exec, deploy/wordpress, -c, nginx, --, nginx, -s, reload]

    - name: SSH geo | Is there a list already?
      ansible.builtin.stat:
        path: /etc/nftables/ssh-geo.nft
      register: _geo_list

    # --no-apply: only write the file. The reload handler loads it together
    # with the (possibly new) ruleset; applying it live here would fail on the
    # first run anyway, because the sets don't exist yet.
    - name: SSH geo | Build the list (first run, or the countries changed)
      ansible.builtin.command: /usr/local/sbin/ssh-geo-update --no-apply
      when: _geo_conf.changed or not _geo_list.stat.exists
      changed_when: true
      notify: Reload nftables

    - name: SSH geo | Weekly refresh (service + timer)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: ssh-geo-update.service
          content: |
            # Managed by Ansible (role common_firewall)
            [Unit]
            Description=Refresh the SSH country allowlist (nftables)
            Wants=network-online.target
            After=network-online.target nftables.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/ssh-geo-update
        - name: ssh-geo-update.timer
          content: |
            # Managed by Ansible (role common_firewall)
            # Sun 02:30-03:00: after the 00:00 AIDE check, before the 04:00
            # AIDE baseline refresh - the new list never triggers an AIDE mail.
            [Unit]
            Description=Weekly refresh of the SSH country allowlist

            [Timer]
            OnCalendar=Sun *-*-* 02:30
            RandomizedDelaySec=30m
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      register: _geo_units

    - name: SSH geo | Enable the weekly refresh
      ansible.builtin.systemd:
        name: ssh-geo-update.timer
        enabled: true
        state: started
        daemon_reload: "{{ _geo_units.changed }}"


# -----------------------------------------------------------------------------
# Deploy ruleset to the file the nftables systemd service actually reads.
# AlmaLinux 9: ExecStart=/sbin/nft -f /etc/sysconfig/nftables.conf
# -----------------------------------------------------------------------------
# validate: a syntax error must never reach the live file (the service would
# fail to load it on the next boot). `nft -c` only checks, nothing is applied.
- name: Firewall | Upload nftables ruleset (templated)
  ansible.builtin.template:
    src: fw.nft.j2
    dest: /etc/sysconfig/nftables.conf
    owner: root
    group: root
    mode: "0640"
    validate: nft -c -f %s
  notify: Reload nftables

# Country filter switched off (or never on): remove its pieces. The ruleset
# above no longer includes the list, so deleting it is safe.
- name: Firewall | Remove the SSH country allowlist when it is not configured
  when: fw_ssh_geo_countries | length == 0
  block:
    - name: SSH geo | Stop the weekly refresh
      ansible.builtin.systemd:
        name: ssh-geo-update.timer
        enabled: false
        state: stopped
      failed_when: false

    - name: SSH geo | Remove script, config, list and units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/ssh-geo-update.timer
        - /etc/systemd/system/ssh-geo-update.service
        - /usr/local/sbin/ssh-geo-update
        - /etc/ssh-geo.conf
        - /etc/nftables/ssh-geo.nft

# The stock unit reloads with 'flush ruleset; include ...' and stops with
# 'flush ruleset'. That also wipes kube-proxy's / flannel's / K3s's tables,
# which live in nftables too, and breaks Service traffic until they re-sync.
# Scope reload/stop to our own table. It must be in place before the reload
# handler fires at the end of the play.
- name: Firewall | Create nftables drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Firewall | Scope nftables reload/stop to our own table (keep K3s tables)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/10-own-table-only.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role common_firewall) - do not edit
      [Service]
      ExecReload=
      ExecReload=/sbin/nft -f /etc/sysconfig/nftables.conf
      ExecStop=
      ExecStop=/sbin/nft delete table inet filter
  register: _nft_dropin

- name: Firewall | Reload systemd after the nftables drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: _nft_dropin.changed

# On AlmaLinux 9 the active config is /etc/sysconfig/nftables.conf.
# /etc/nftables.conf is a distro default stub that is NOT loaded by the
# systemd unit — but a stale copy could cause confusion on manual reloads.
# (Despite the task name, it is removed unconditionally on AlmaLinux - there
# is no comparison with the active config.)
- name: Firewall | Remove stale /etc/nftables.conf if it differs from the active config
  ansible.builtin.file:
    path: /etc/nftables.conf
    state: absent
  when: ansible_facts['distribution'] == 'AlmaLinux'

- name: Firewall | Enable nftables (starts automatically on the next boot)
  ansible.builtin.service:
    name: nftables
    enabled: true

# Skipped on the initial hardening run (ssh_first_run, set by common_ssh):
# starting nftables live here, on a host where it has never run before, means
# an already-open SSH connection that predates it (this one) has no conntrack
# entry yet. The new ruleset only explicitly accepts *new* connections on
# 10022 - this untracked pre-existing one matches neither that rule nor
# "ct state established,related", so its packets just get dropped: the
# connection goes silently dead mid-play instead of erroring out (observed
# live 2026-09-10 as a multi-minute hang right at this task). The "First run
# only" block below reboots instead, so nftables and the new SSH port both
# come up together from a clean boot, with nothing pre-dating either.
- name: Firewall | Start nftables now (first run activates it via reboot instead, see below)
  ansible.builtin.service:
    name: nftables
    state: started
  when: not (ssh_first_run | default(false))   # set by common_ssh; undefined in a --tags common_firewall run

# Leftover of the pre-nftables era: the blog was filtered by
# /root/fw/fw_ipv{4,6}.sh (iptables-legacy, applied by an @reboot cron job).
# The migration to this role never removed it, so the blog ran two stacked
# firewalls; the old one has OUTPUT policy DROP without a DHCP rule and
# dropped the IPv4 lease renewals ("IPTables-Dropped ... DPT=67", found
# 2026-09-29). No-op on hosts that never had it (cvjm, sofie). The rules
# already loaded stay active until the next reboot.
- name: Firewall | Remove the legacy iptables @reboot job
  ansible.builtin.cron:
    name: Apply iptables rules at reboot
    special_time: reboot
    user: root
    state: absent

- name: Firewall | Remove the legacy iptables scripts
  ansible.builtin.file:
    path: /root/fw
    state: absent
  register: _legacy_fw

- name: Firewall | Legacy iptables rules are still loaded until the next reboot
  ansible.builtin.debug:
    msg: >-
      /root/fw removed. The old iptables-legacy rules stay loaded until the
      next reboot - reboot this host at a convenient time.
  when: _legacy_fw.changed

# nftables only (2026-10-19): with iptables-legacy installed, /usr/sbin/iptables
# points to the legacy backend (alternatives), and K3s and Flannel (and then
# still Calico),
# which use the host's iptables, put all their rules into the legacy tables -
# that was the case on the blog (EPEL packages from its first install, never
# used: iptables.service was disabled). Without these packages iptables is
# iptables-nft on every host. Removing them changes nothing that is running;
# the switch of a running K3s needs the one-time migration in the docs
# ("nftables only"). Checked with dnf --assumeno: nothing depends on them.
- name: Firewall | Remove the legacy iptables packages (iptables is iptables-nft)
  ansible.builtin.dnf:
    name:
      - iptables-services
      - iptables-legacy
      - iptables-legacy-libs
    state: absent

# firewalld ships installed-but-inactive on this image and is never used to
# manage packet filtering here - nftables rules above are applied directly.
# Masking (not removing the package) prevents it from ever being started by
# accident and silently taking over/conflicting with the ruleset above;
# removing the package outright was considered and rejected (2026-08-21) -
# it depends on nftables itself, so `dnf remove firewalld` cascades into
# removing nftables and fail2ban too (verified live via dnf --assumeno).
- name: Firewall | Mask firewalld (unused, would conflict with hand-rolled nftables rules)
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    masked: true
    state: stopped
  failed_when: false  # package may not be present on every host


# -----------------------------------------------------------------------------
# First run only: activate the new SSH port + firewall together via a reboot
# -----------------------------------------------------------------------------
# Replaces the old manual dance (reboot by hand without disconnecting, then
# edit ansible_port in host_vars, then re-run) with a single unattended
# playbook run. sshd_config/the hardening drop-in (common_ssh) and the
# nftables ruleset (above) are already on disk at this point but neither is
# live yet on a first run - nftables was deliberately left un-started above,
# and sshd only listens on 10022 (files/sshd_config has no fallback Port 22).
# A clean boot brings both up together with nothing pre-dating either, so the
# reconnect afterward is a genuinely new, correctly-tracked connection - see
# the comment on "Start nftables now" above for why doing this live instead
# hangs.
# -----------------------------------------------------------------------------
- name: Firewall | First run only – reboot to activate the new SSH port and firewall together
  ansible.builtin.include_tasks:
    file: first_run_reboot.yml
    apply:
      tags: [common_firewall]   # tags of a dynamic include do not reach the tasks inside
  when: ssh_first_run | default(false)
  tags: [common_firewall]

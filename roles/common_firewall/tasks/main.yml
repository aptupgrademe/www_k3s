---
# =============================================================================
# Role: firewall
# Purpose: Deploy IPv4/IPv6 nftables packet-filter rules via a single template.
#          /etc/sysconfig/nftables.conf is the file read by the nftables systemd
#          service on AlmaLinux 9 at boot (ExecStart) and on reload (ExecReload).
#          The commonly referenced /etc/nftables.conf is NOT used by the service.
#          Using the systemd service is safe on a live K3s node: K3s manages
#          its own KUBE-* chains in iptables (a separate subsystem), so there
#          is no lock contention with nftables.
# Target:  AlmaLinux 9
# Variables: all values come from the inventory (group_vars/all.yml and
#            host_vars/<host>/vars.yml); this role defines none of its own.
# =============================================================================


# -----------------------------------------------------------------------------
# Prerequisites
# -----------------------------------------------------------------------------
- name: Firewall | Install nftables
  ansible.builtin.package:
    name:
      - nftables
    state: present


# -----------------------------------------------------------------------------
# Deploy ruleset to the file the nftables systemd service actually reads.
# AlmaLinux 9: ExecStart=/sbin/nft -f /etc/sysconfig/nftables.conf
# -----------------------------------------------------------------------------
- name: Firewall | Upload nftables ruleset (templated)
  ansible.builtin.template:
    src: fw.nft.j2
    dest: /etc/sysconfig/nftables.conf
    owner: root
    group: root
    mode: "0640"
  notify: Reload nftables

# On AlmaLinux 9 the active config is /etc/sysconfig/nftables.conf.
# /etc/nftables.conf is a distro default stub that is NOT loaded by the
# systemd unit — but a stale copy could cause confusion on manual reloads.
- name: Firewall | Remove stale /etc/nftables.conf if it differs from the active config
  ansible.builtin.file:
    path: /etc/nftables.conf
    state: absent
  when: ansible_distribution == 'AlmaLinux'

- name: Firewall | Enable nftables (starts automatically on the next boot)
  ansible.builtin.service:
    name: nftables
    enabled: true

# Skipped on the initial hardening run (ssh_first_run, set by common_ssh):
# starting nftables live here, on a host where it has never run before, means
# an already-open SSH connection that predates it (this one) has no conntrack
# entry yet. The new ruleset only explicitly accepts *new* connections on
# 10022 - this untracked pre-existing one matches neither that rule nor
# "ct state established,related", so its packets just get dropped: the
# connection goes silently dead mid-play instead of erroring out (observed
# live 2026-09-10 as a multi-minute hang right at this task). The "First run
# only" block below reboots instead, so nftables and the new SSH port both
# come up together from a clean boot, with nothing pre-dating either.
- name: Firewall | Start nftables now (first run activates it via reboot instead, see below)
  ansible.builtin.service:
    name: nftables
    state: started
  when: not ssh_first_run

# firewalld ships installed-but-inactive on this image and is never used to
# manage packet filtering here - nftables rules above are applied directly.
# Masking (not removing the package) prevents it from ever being started by
# accident and silently taking over/conflicting with the ruleset above;
# removing the package outright was considered and rejected (2026-08-21) -
# it depends on nftables itself, so `dnf remove firewalld` cascades into
# removing nftables and fail2ban too (verified live via dnf --assumeno).
- name: Firewall | Mask firewalld (unused, would conflict with hand-rolled nftables rules)
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    masked: true
    state: stopped
  failed_when: false  # package may not be present on every host


# -----------------------------------------------------------------------------
# First run only: activate the new SSH port + firewall together via a reboot
# -----------------------------------------------------------------------------
# Replaces the old manual dance (reboot by hand without disconnecting, then
# edit ansible_port in host_vars, then re-run) with a single unattended
# playbook run. sshd_config/the hardening drop-in (common_ssh) and the
# nftables ruleset (above) are already on disk at this point but neither is
# live yet on a first run - nftables was deliberately left un-started above,
# and sshd only listens on 10022 (files/sshd_config has no fallback Port 22).
# A clean boot brings both up together with nothing pre-dating either, so the
# reconnect afterward is a genuinely new, correctly-tracked connection - see
# the comment on "Start nftables now" above for why doing this live instead
# hangs.
# -----------------------------------------------------------------------------
- name: Firewall | First run only – reboot to activate the new SSH port and firewall together
  when: ssh_first_run
  block:
    - name: First run | Reboot
      ansible.builtin.reboot:
        reboot_timeout: 180
        connect_timeout: 20
        test_command: whoami
      vars:
        ansible_port: 10022

    - name: First run | Use the new SSH port for the rest of this run
      ansible.builtin.set_fact:
        ansible_port: 10022

    - name: First run | Reminder to persist the new port for future runs
      ansible.builtin.debug:
        msg: >-
          This run has switched to port 10022 and will finish over it, but
          that's only in-memory for this run. Before the next separate
          playbook invocation, change ansible_port from 22 to 10022 in
          inventory/host_vars/{{ inventory_hostname }}/vars.yml - otherwise
          Ansible won't know where to connect and this run's automation
          can't help with that part.

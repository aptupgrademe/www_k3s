---
# Inputs from the playbook and host_vars - keep in sync with inventory/host_vars/*/*.example.
#
# meta/argument_specs.yml: the role's declared inputs, checked by Ansible when
# the role starts (type, required). How it works in detail: see
# roles/common_mysqld_exporter/meta/argument_specs.yml.

argument_specs:
  main:
    short_description: Nightly antivirus scan of WordPress uploads or Nextcloud user data
    description:
      - clamav_target (set in blog.yml / nextcloud-k3s.yml) selects the profile in defaults/main.yml.
      - Ansible validates these inputs when the role starts. Values with no_log never show up in output.
    options:
      clamav_target:
        description: Which stack to scan
        type: str
        required: true
        choices: [wordpress, nextcloud]
      email:
        description: Admin e-mail address for alerts, reports and Let's Encrypt
        type: str
        required: true
        no_log: true
      blog_k3s_www_dir:
        description: HostPath of the WordPress files (clamav_target wordpress)
        type: str
      nextcloud_data_dir:
        description: Nextcloud data directory on the host (clamav_target nextcloud)
        type: str

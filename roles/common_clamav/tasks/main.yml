---
# =============================================================================
# Role: common_clamav
# Purpose: Nightly antivirus scan of the user-supplied files of one stack -
#          WordPress uploads (clamav_target: wordpress) or Nextcloud user data
#          (clamav_target: nextcloud). On-demand only (nightly clamscan sweep
#          via cron) - no clamd daemon, no real-time on-access scanning. That
#          keeps resource usage low on a modest VPS, at the cost of only
#          catching malware the morning after it was uploaded/synced rather
#          than instantly. Mirrors rkhunter's philosophy: silent on a clean
#          run, an email only when something is actually found - detection
#          only, nothing is deleted or moved automatically.
#          Replaces the former blog_clamav and next_clamav roles, which were
#          identical apart from the values now in clamav_profiles.
# =============================================================================

- name: ClamAV | Pick the scan profile
  ansible.builtin.set_fact:
    clamav: "{{ clamav_profiles[clamav_target] }}"

- name: ClamAV | Install packages
  ansible.builtin.dnf:
    name:
      - clamav
      - clamav-update
    state: present


# -----------------------------------------------------------------------------
# Signature updates (freshclam)
# -----------------------------------------------------------------------------
# The packaged freshclam.conf ships with a placeholder "Example" line that
# must be removed before freshclam will run at all – otherwise every
# invocation (including the systemd service below) just errors out.
- name: ClamAV | Remove the "Example" placeholder line from freshclam.conf
  ansible.builtin.lineinfile:
    path: /etc/freshclam.conf
    regexp: '^Example'
    state: absent

# First run can take a few minutes (full signature database download).
# Needed before the very first scan can find anything at all.
# creates: freshclam writes freshclam.dat on its first successful run. Later
# updates are the clamav-freshclam service's job - running freshclam on every
# play reported "changed" every time and only duplicated that service.
- name: ClamAV | Initial virus signature download
  ansible.builtin.command: freshclam
  args:
    creates: /var/lib/clamav/freshclam.dat
  changed_when: true
  failed_when: false

- name: ClamAV | Enable freshclam auto-update service
  ansible.builtin.systemd:
    name: clamav-freshclam.service
    enabled: true
    state: started


# -----------------------------------------------------------------------------
# Nightly scan
# -----------------------------------------------------------------------------
- name: ClamAV | Ensure log directory exists
  ansible.builtin.file:
    path: /var/log/clamav
    state: directory
    owner: root
    group: root
    mode: "0750"

# nice/ionice keep the scan from competing with the web stack/K3s during the
# night; --max-filesize/--max-scansize skip implausibly large files (viruses
# are not hiding in multi-hundred-MB blobs, and scanning them wastes time).
# Media files listed in clamav_skip_extensions are skipped where the profile
# says so (see defaults/main.yml for the trade-off).
- name: ClamAV | Build the case-insensitive exclude pattern for media files
  ansible.builtin.set_fact:
    clamav_skip_regex: >-
      \.({% for e in clamav_skip_extensions %}{% for ch in e %}{% if ch.isalpha() %}[{{ ch }}{{ ch | upper }}]{% else %}{{ ch }}{% endif %}{% endfor %}{% if not loop.last %}|{% endif %}{% endfor %})$
  when: clamav.skip_media | bool

- name: ClamAV | Deploy nightly scan script
  ansible.builtin.copy:
    dest: "/usr/local/sbin/{{ clamav_target }}-clamav-scan.sh"
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/bin/bash
      # Managed by Ansible (common_clamav) - do not edit manually.
      # Nightly scan of {{ clamav.label }}. Mails {{ clamav_mail }} only when
      # clamscan actually finds something (exit code 1) - a clean scan stays
      # silent, mirroring rkhunter's --report-warnings-only philosophy.
      set -u
      SCAN_LOG="/var/log/clamav/{{ clamav_target }}-scan.log"
      SCAN_DIR="{{ clamav.scan_dir }}"

      nice -n 19 ionice -c3 clamscan --recursive --infected --no-summary \
        --max-filesize=200M --max-scansize=200M \
      {% for d in clamav.exclude_dirs %}
        --exclude-dir='{{ d }}' \
      {% endfor %}
      {% if clamav.skip_media | bool %}
        --exclude='{{ clamav_skip_regex }}' \
      {% endif %}
        "$SCAN_DIR" > "$SCAN_LOG" 2>&1
      RC=$?

      if [ "$RC" -eq 1 ]; then
        mail -s "[$(hostname -f)] ClamAV: infected file(s) found in {{ clamav.label }}" {{ clamav_mail }} < "$SCAN_LOG"
      fi

      exit 0

- name: ClamAV | Configure nightly cron scan
  ansible.builtin.cron:
    name: "clamav nightly {{ clamav.label }} scan"
    hour: "{{ clamav.hour }}"
    minute: "{{ clamav.minute }}"
    job: "/usr/local/sbin/{{ clamav_target }}-clamav-scan.sh"
    user: root

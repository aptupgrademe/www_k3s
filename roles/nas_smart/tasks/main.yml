---
# =============================================================================
# Role: nas_smart
# Purpose: Install and configure smartd for disk health monitoring.
#          Runs short self-tests daily, long tests weekly.
#          Sends email via msmtp on errors or temperature warnings.
# =============================================================================

- name: SMART | Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: SMART | Deploy smartd.conf
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart smartd

- name: SMART | Enable and start smartd
  ansible.builtin.systemd:
    name: smartd
    enabled: true
    state: started

# --- Quick status check (informational, never fails) ---
- name: SMART | Show drive health overview
  ansible.builtin.command: smartctl --scan
  register: _smart_scan
  changed_when: false
  failed_when: false

- name: SMART | Print detected drives
  ansible.builtin.debug:
    msg: "{{ _smart_scan.stdout_lines }}"

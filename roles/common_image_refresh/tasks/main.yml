---
# =============================================================================
# Role: common_image_refresh
# Purpose: Pull the current build of every image used by the Deployments of
#          one namespace and report which Deployments run an outdated build
#          (same tag, rebuilt upstream). Used by blog-update.yml and
#          nextcloud-update.yml to restart only what actually needs it.
#          tasks/prune.yml (since 2026-10-22, end of both update playbooks):
#          remove the images no container uses any more.
# Input:   image_refresh_namespace
# Output:  image_refresh_rebuilt - dict {deployment: [rebuilt images]}
#          ({} in a --check run: pulling is skipped there, it changes the host)
# =============================================================================
#
# How it works: one Python script (files/rebuilt-images.py) does the work on
# the server - for each Deployment in the namespace it pulls the image tag
# the pods use and compares the digest of the fresh pull with the digest
# the running pod was started from. It prints a JSON dict of Deployments
# whose image was rebuilt; the update playbooks restart exactly those.
#
# Ansible concepts used here:
#   ansible.builtin.script  copies a script from the role's files/ folder to
#                  the server, runs it there and removes it again - handy for
#                  logic too long for a shell one-liner
#   "is skipped"   a test on a registered result: true when the task did not
#                  run (here: script is skipped in --check)
#   dict2items     turns {a: [...], b: [...]} into [{key: a, value: [...]}, ...]
#                  so the keys (Deployment names) can be listed

# changed_when: something "changed" only when a rebuilt image was found
# (a pull of an unchanged tag changes nothing that matters).
- name: Image refresh | Pull current tags, compare with the running pods
  ansible.builtin.script:
    cmd: rebuilt-images.py {{ image_refresh_namespace }}
    executable: python3
  register: _image_refresh
  changed_when: (_image_refresh.stdout | from_json) | length > 0

- name: Image refresh | Deployments with a rebuilt image
  ansible.builtin.set_fact:
    image_refresh_rebuilt: "{{ (_image_refresh.stdout | from_json) if _image_refresh is not skipped else {} }}"

- name: Image refresh | Report
  ansible.builtin.debug:
    msg: >-
      {{ image_refresh_rebuilt | dict2items | map(attribute='key') | join(', ')
         if image_refresh_rebuilt else 'no rebuilt images' }}

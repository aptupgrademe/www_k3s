---
# =============================================================================
# Role: common_msmtp
# Purpose: Install msmtp as a lightweight sendmail replacement so that
#          system services (cron, rkhunter, dnf-automatic) can relay mail
#          through an external SMTP account (any provider with SMTP AUTH).
#          No daemon – msmtp is called directly by /usr/sbin/sendmail.
# =============================================================================
#
# How it works: three tasks - package, /etc/msmtprc (relay, port, login,
# sender) from a template, and the log file. No service: every program that
# calls "sendmail" or "mail" runs msmtp, which delivers the mail to the
# relay right away and exits.
#
# Ansible concepts used here:
#   ansible.builtin.package  the distro-neutral package module (picks dnf,
#                  apt ... itself); fine for a single package without
#                  dnf-specific options
#   file state: touch + preserve  see common_fail2ban: create the log once
#                  without "changed" on every later run


# -----------------------------------------------------------------------------
# Package
# The msmtp package on AlmaLinux creates a /usr/sbin/sendmail symlink so that
# cron, rkhunter and dnf-automatic can send mail without a full MTA.
# -----------------------------------------------------------------------------
- name: msmtp | Install package (distro-agnostic)
  ansible.builtin.package:
    name: msmtp
    state: present


# -----------------------------------------------------------------------------
# Configuration  (owner root, mode 0600 – contains plaintext password)
# -----------------------------------------------------------------------------
# no_log: the rendered file holds the SMTP password, and --diff (check-drift.sh)
# or a failing task would otherwise print it in clear text.
- name: msmtp | Deploy /etc/msmtprc
  ansible.builtin.template:
    src:   msmtprc.j2
    dest:  /etc/msmtprc
    owner: root
    group: root
    mode:  "0600"
  no_log: true


# -----------------------------------------------------------------------------
# Log file – create with correct permissions so msmtp can write to it
# -----------------------------------------------------------------------------
- name: msmtp | Create log file
  ansible.builtin.file:
    path:  /var/log/msmtp.log
    state: touch
    owner: root
    group: root
    mode:  "0640"
    modification_time: preserve
    access_time:       preserve

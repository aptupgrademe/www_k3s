---
# =============================================================================
# Role: common_fail2ban  (K3s mode)
# Purpose: SSH brute-force protection via Fail2Ban.
#
# HTTP-level protection is handled by nginx-ingress (F5) rate-limiting inside K3s.
# Only the sshd jail runs on the host.
# =============================================================================


# -----------------------------------------------------------------------------
# Package  (fail2ban is in EPEL)
# -----------------------------------------------------------------------------
- name: Fail2Ban | Install package
  ansible.builtin.dnf:
    name: fail2ban
    state: present


# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
- name: Fail2Ban | Deploy nftables ban action (writes to banned4/banned6 sets)
  ansible.builtin.template:
    src: nftables-banned-sets.conf.j2
    dest: /etc/fail2ban/action.d/nftables-banned-sets.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Fail2Ban | Deploy nginx-k3s filters (parse containerd-prefixed access logs)
  ansible.builtin.template:
    src: "filter.d/{{ item }}.j2"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nginx-k3s-wp-login.conf
    - nginx-k3s-nc-login.conf
    - nginx-k3s-grafana-login.conf
    - nginx-k3s-scanner.conf
    - nginx-k3s-bad-paths.conf
  notify: restart fail2ban

- name: Fail2Ban | Deploy jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban


# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
# On a genuinely fresh host, fail2ban's own log file doesn't exist yet. The
# recidive jail (jail.local) reads it (logpath = /var/log/fail2ban.log), and
# fail2ban parses all jail configs *before* its own logger creates that file
# on first start – so on a first-ever start this fails immediately with
# "Have not found any log file for recidive jail" (exit-code 255, service
# never comes up). Pre-creating the file avoids the chicken-and-egg race.
- name: Fail2Ban | Ensure fail2ban.log exists (needed by recidive jail on first-ever start)
  ansible.builtin.file:
    path: /var/log/fail2ban.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Fail2Ban | Enable and start service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
    daemon_reload: true


# -----------------------------------------------------------------------------
# Keep the nginx-k3s jails on the CURRENT ingress log file
# -----------------------------------------------------------------------------
# The logpath glob is only expanded when a jail starts, but the ingress
# container writes a new N.log after every restart/reboot, so the jails
# silently went blind (see the script). A timer reloads them when the
# set of log files changes.
- name: Fail2Ban | Deploy ingress log watcher script
  ansible.builtin.template:
    src: fail2ban-ingress-logwatch.sh.j2
    dest: /usr/local/sbin/fail2ban-ingress-logwatch
    owner: root
    group: root
    mode: "0755"

- name: Fail2Ban | Deploy ingress log watcher service + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: fail2ban-ingress-logwatch.service
      content: |
        # Managed by Ansible (role common_fail2ban) - do not edit
        [Unit]
        Description=Reload fail2ban nginx-k3s jails when the ingress log file changes
        After=fail2ban.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/fail2ban-ingress-logwatch
    - name: fail2ban-ingress-logwatch.timer
      content: |
        # Managed by Ansible (role common_fail2ban) - do not edit
        [Unit]
        Description=Check every 2 minutes whether the ingress log file changed

        [Timer]
        OnBootSec=3min
        OnUnitActiveSec=2min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Fail2Ban | Enable and start ingress log watcher timer
  ansible.builtin.systemd:
    name: fail2ban-ingress-logwatch.timer
    enabled: true
    state: started
    daemon_reload: true

# Fix a blind jail immediately instead of waiting for the first timer tick.
- name: Fail2Ban | Run ingress log watcher once now
  ansible.builtin.systemd:
    name: fail2ban-ingress-logwatch.service
    state: started
  changed_when: false

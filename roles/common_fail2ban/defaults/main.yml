---
fail2ban_bantime:  3600    # seconds a bad IP stays banned (1 h)
fail2ban_findtime:  600    # observation window (10 min)
fail2ban_maxretry:    5    # allowed failures before ban

# Application-specific jails – enable per play via vars:
fail2ban_jail_nextcloud: false
fail2ban_jail_wordpress: false

# Extra IPs/CIDRs to never ban (e.g. Ansible controller, home IP).
# Set in host_vars/<host>/vars.yml – never put secrets here.
# Example: fail2ban_ignoreip_extra: "1.2.3.4 5.6.7.0/24"
fail2ban_ignoreip_extra: ""

---
# =============================================================================
# Nextcloud exporter NodePort Service
# Exposes php-fpm_exporter (nextcloud pod) to host-side Prometheus via NodePort.
# mysqld_exporter for Nextcloud's host MariaDB is handled by common_mysqld_exporter.
# =============================================================================

- name: Exporters | Apply exporter NodePort service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 33), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'exporters.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: exporters_apply

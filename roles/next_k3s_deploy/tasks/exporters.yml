---
# =============================================================================
# Nextcloud exporter NodePort Service
# Exposes php-fpm_exporter (nextcloud pod) to host-side Prometheus via NodePort.
# mysqld_exporter for Nextcloud's host MariaDB is handled by common_mysqld_exporter.
# =============================================================================

- name: Exporters | Apply exporter NodePort service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # One loop item per object in the template, so --diff shows each
  # object's change (with a list definition the module reports no diff).
  loop: "{{ lookup('ansible.builtin.template', 'exporters.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: exporters_apply

---
# =============================================================================
# ValidatingAdmissionPolicy – nextcloud namespace image registry allowlist
# =============================================================================
# GA since Kubernetes 1.30, built into the apiserver — no extra component to
# install, unlike common_calico for NetworkPolicy.

- name: ImagePolicy | Template nextcloud image allowlist manifest
  ansible.builtin.template:
    src: image-policy.yml.j2
    dest: /tmp/k8s-nc-image-policy.yml
    mode: "0644"

- name: ImagePolicy | Apply nextcloud image allowlist
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-nc-image-policy.yml
  register: image_policy_apply
  changed_when: "'created' in image_policy_apply.stdout or 'configured' in image_policy_apply.stdout"

- name: ImagePolicy | Remove temporary manifest
  ansible.builtin.file:
    path: /tmp/k8s-nc-image-policy.yml
    state: absent

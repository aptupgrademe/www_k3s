---
# =============================================================================
# Nextcloud background jobs (Kubernetes CronJob)
# Runs occ cron.php every 5 minutes inside the nextcloud-fpm container.
# =============================================================================

- name: CronJob | Apply Nextcloud CronJob
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # One loop item per object in the template, so --diff shows each
  # object's change (with a list definition the module reports no diff).
  loop: "{{ lookup('ansible.builtin.template', 'cronjob.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: cronjob_apply

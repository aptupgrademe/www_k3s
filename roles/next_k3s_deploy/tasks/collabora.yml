---
# =============================================================================
# Collabora CODE Deployment + Service
# =============================================================================
# Collabora CODE runs as a dedicated Deployment. TLS is terminated by
# F5 nginx-ingress; the container runs without built-in SSL.
# Collabora connects back to Nextcloud for WOPI from its pod IP (10.42.x.x),
# so wopi_allowed_hosts must include k3s_pod_cidr (see next_config/wopi.yml).
# =============================================================================

# WOPI proof key. The collabora/code image (26.04+) starts coolwsd directly,
# without the old start script that generated /etc/coolwsd/proof_key, so it
# logged "Could not open proof RSA key" and served discovery without a
# proof-key: Nextcloud could not verify that WOPI requests really come from
# our Collabora (found 2026-10-02). Generated once into a Secret, so the key
# survives pod restarts; never written to disk on the host, never logged.
- name: Collabora | Does the WOPI proof key secret exist?
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig }}"
    kind: Secret
    namespace: nextcloud
    name: collabora-proof-key
  register: _collabora_proof_key
  no_log: true   # k8s_info returns the Secret's data (private keys)

- name: Collabora | Generate the WOPI proof key (first run only)
  ansible.builtin.shell: |
    set -o pipefail
    openssl genrsa -traditional 2048 2>/dev/null \
      | k3s kubectl -n nextcloud create secret generic collabora-proof-key --from-file=proof_key=/dev/stdin
  when: _collabora_proof_key.resources | length == 0
  changed_when: true   # only runs when the Secret is missing, so it always creates it
  no_log: true

- name: Collabora | Apply Deployment + Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # One loop item per object in the template, so --diff shows each
  # object's change (with a list definition the module reports no diff).
  loop: "{{ lookup('ansible.builtin.template', 'collabora-deployment.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: collabora_apply

- name: Collabora | Wait for Deployment to be ready (up to 3 min)
  ansible.builtin.command: >
    k3s kubectl rollout status deployment/collabora
    --namespace nextcloud
    --timeout=180s
  changed_when: false
  when: collabora_apply.changed

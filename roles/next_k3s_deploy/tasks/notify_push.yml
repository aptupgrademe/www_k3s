---
# =============================================================================
# notify_push (High Performance Backend)
# Gated by nextcloud_notify_push_enabled. Order: install the app (binary lands
# in the shared code volume) -> deploy the notify-push Deployment/Service (its
# init-wait picks up the binary) -> run `occ notify_push:setup` self-test.
# Runs last in the role, so a failure here never leaves the rest half-applied.
# Nextcloud only starts using push once :setup has passed and saved the
# endpoint; until then clients keep polling, so a failed run is harmless.
# Rollback: `occ app:disable notify_push` (clients fall back to polling
# immediately), then delete deployment/service notify-push + ingress
# nextcloud-push-routes.
# =============================================================================
#
# Every task carries "when: nextcloud_notify_push_enabled | bool" (one switch
# per host). Order: install + enable the app (it ships the binary), read its
# version, deploy the notify-push pod for exactly that version, wait, then
# "occ notify_push:setup" configures Nextcloud and runs a self-test.

- name: notify_push | Set occ prefix
  ansible.builtin.set_fact:
    np_occ: >-
      k3s kubectl exec deployment/nextcloud
      --namespace nextcloud
      --container nextcloud-fpm
      -- runuser -u www-data -- php /var/www/html/occ
  when: nextcloud_notify_push_enabled | bool

# Not in the image: an image upgrade rsyncs apps/ and removes it (same as
# richdocuments), so this reinstalls it on the next run.
- name: notify_push | Install the notify_push app
  ansible.builtin.command: "{{ np_occ }} app:install notify_push"
  register: np_install
  changed_when: np_install.rc == 0
  failed_when:
    - np_install.rc != 0
    - "'already installed' not in (np_install.stdout + np_install.stderr)"
  when: nextcloud_notify_push_enabled | bool

- name: notify_push | Enable the notify_push app
  ansible.builtin.command: "{{ np_occ }} app:enable notify_push"
  register: np_enable
  changed_when: "'already enabled' not in np_enable.stdout"
  when: nextcloud_notify_push_enabled | bool

# The binary ships inside the app, and the running process keeps the old one
# after an app update. The version goes into a pod-template annotation, so a
# new app version rolls the Deployment and keeps binary and app in lockstep.
- name: notify_push | Read the installed app version
  ansible.builtin.command: "{{ np_occ }} config:app:get notify_push installed_version"
  register: np_version
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  when: nextcloud_notify_push_enabled | bool

# notify_push parses only config.php (see the Deployment), and there the
# installer wrote the Redis password once. Nextcloud itself reads the current
# one from redis.config.php (Secret), which wins - so after a password
# rotation Nextcloud worked and the push daemon did not (found 2026-10-20).
# This copies the Secret's value into config.php when they differ, inside
# the pod, so the password never appears on the host's command line.
- name: notify_push | Keep the Redis password in config.php in sync
  ansible.builtin.command:
    argv: [k3s, kubectl, exec, -i, deployment/nextcloud, --namespace, nextcloud,
           --container, nextcloud-fpm, --, runuser, -u, www-data, --, sh, -s]
    stdin: |
      set -e
      cd /var/www/html
      want=$(php -r 'include "config/redis.config.php"; echo $CONFIG["redis"]["password"] ?? "";')
      have=$(php -r 'include "config/config.php"; echo $CONFIG["redis"]["password"] ?? "";')
      [ -n "$want" ] || { echo "no password in redis.config.php"; exit 1; }
      if [ "$want" = "$have" ]; then echo unchanged; exit 0; fi
      php occ config:system:set redis password --value="$want" >/dev/null
      echo updated
  register: np_redis_pw
  changed_when: "'updated' in np_redis_pw.stdout"
  when:
    - nextcloud_notify_push_enabled | bool
    - not ansible_check_mode

- name: notify_push | Apply the Deployment + Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change; otherwise one call for all objects (see the other
  # Apply tasks). The loop is evaluated before "when", so it must not render
  # the template (which needs np_version) when notify_push is disabled.
  loop: >-
    {{ [] if not (nextcloud_notify_push_enabled | bool)
       else (k8s_objects if ansible_diff_mode else [k8s_objects]) }}
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    notify_push_app_version: "{{ np_version.stdout | trim }}"
    k8s_objects: "{{ lookup('ansible.builtin.template', 'notify-push-deployment.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: np_apply
  when: nextcloud_notify_push_enabled | bool

# The daemon reads config.php only at start.
- name: notify_push | Restart it after a Redis password change
  ansible.builtin.command: k3s kubectl rollout restart deployment/notify-push -n nextcloud
  changed_when: true
  when:
    - nextcloud_notify_push_enabled | bool
    - np_redis_pw is changed

- name: notify_push | Wait for the notify-push deployment to be ready
  ansible.builtin.command: >-
    k3s kubectl rollout status deployment/notify-push -n nextcloud --timeout=180s
  changed_when: false
  when: nextcloud_notify_push_enabled | bool

# Self-test: push server reachable via the public /push route, can reach
# Nextcloud back, and is seen as a trusted proxy. Saves the endpoint only on
# success, so a failure leaves clients on polling.
# "notify_push:setup" saves the endpoint and prints "configuration saved" on
# EVERY run, so it reported "changed" every time (found 2026-10-13 on sofie).
# Read the stored endpoint first: setup only when it differs (first run, new
# host name), otherwise the read-only "notify_push:self-test" - same checks,
# nothing written. Both fail the task when a check fails.
- name: notify_push | Read the configured push endpoint
  ansible.builtin.command: "{{ np_occ }} config:app:get notify_push base_endpoint"
  register: np_endpoint
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false  # rc 1 = not configured yet
  when: nextcloud_notify_push_enabled | bool

- name: notify_push | Configure + self-test (occ notify_push:setup)
  ansible.builtin.command: "{{ np_occ }} notify_push:setup https://{{ nextcloud_hostname }}/push"
  register: np_setup
  changed_when: "'configuration saved' in (np_setup.stdout | lower)"
  when:
    - nextcloud_notify_push_enabled | bool
    - (np_endpoint.stdout | default('') | trim) != 'https://' ~ nextcloud_hostname ~ '/push'

- name: notify_push | Self-test only (endpoint already configured)
  ansible.builtin.command: "{{ np_occ }} notify_push:self-test"
  register: np_selftest
  changed_when: false
  when:
    - nextcloud_notify_push_enabled | bool
    - np_setup is skipped

- name: notify_push | Report setup result
  ansible.builtin.debug:
    var: (np_selftest if np_setup is skipped else np_setup).stdout_lines
  when: nextcloud_notify_push_enabled | bool

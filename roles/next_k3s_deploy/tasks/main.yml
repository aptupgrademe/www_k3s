---
# =============================================================================
# Role: next_k3s_deploy
# Purpose: Deploy Nextcloud (FPM + Nginx sidecar) and Collabora CODE as
#          Kubernetes workloads, plus Ingress resources with cert-manager TLS.
#          MariaDB and Redis remain on the host and are exposed as K8s Services
#          with manually managed Endpoints.
# Target:  K3s single-node on AlmaLinux 9
# =============================================================================
#
# Also deploys notify_push (the "High Performance Backend" that pushes file
# changes to clients) and reconciles enabled/disabled apps.
#
# How it works: one task file per component, in dependency order. Unlike the
# blog, MariaDB and Redis run on the HOST (next_mariadb, next_redis); pods
# reach them through "external services" - a Service without selector +
# an Endpoints object with the host IP. Every component is a Jinja template
# in templates/, applied with kubernetes.core.k8s (THE K8S APPLY PATTERN,
# see common_calico/tasks/main.yml). "rollout status" waits run only
# "when: <apply>.changed", so an unchanged run never waits.

- name: next_k3s_deploy | HostPath directories
  ansible.builtin.import_tasks: dirs.yml
- name: next_k3s_deploy | Namespace, Secret, ConfigMaps
  ansible.builtin.import_tasks: namespace_secrets.yml
- name: next_k3s_deploy | External Services (host MariaDB, Redis, Grafana)
  ansible.builtin.import_tasks: external_services.yml
- name: next_k3s_deploy | Nextcloud Deployment + Service
  ansible.builtin.import_tasks: nextcloud.yml
- name: next_k3s_deploy | Collabora Deployment + Service
  ansible.builtin.import_tasks: collabora.yml
- name: next_k3s_deploy | NetworkPolicy (requires common_calico)
  ansible.builtin.import_tasks: networkpolicy.yml
- name: next_k3s_deploy | Image registry allowlist (ValidatingAdmissionPolicy)
  ansible.builtin.import_tasks: image_policy.yml
- name: next_k3s_deploy | Ingress + TLS
  ansible.builtin.import_tasks: ingress.yml
- name: next_k3s_deploy | Background-job CronJob
  ansible.builtin.import_tasks: cronjob.yml
- name: next_k3s_deploy | Exporter NodePort Services
  ansible.builtin.import_tasks: exporters.yml
- name: next_k3s_deploy | Apps (enable/disable after the pod is up)
  ansible.builtin.import_tasks: apps.yml
- name: next_k3s_deploy | notify_push (High Performance Backend)
  ansible.builtin.import_tasks: notify_push.yml

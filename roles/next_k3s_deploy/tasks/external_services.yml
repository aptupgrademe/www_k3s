---
# =============================================================================
# K8s Services + Endpoints for host-side services (MariaDB, Redis, Grafana)
# =============================================================================
# MariaDB and Redis run on the host. We expose them to the K3s pods via
# headless-like Services backed by manually-managed Endpoints that point to
# the host's public IP.  Pods connect to e.g. mariadb.nextcloud.svc.cluster.local
# which resolves to the node's IP.
# nftables rules (common_firewall) restrict access to these ports to the K3s
# pod CIDR ({{ k3s_pod_cidr }}) only.
# =============================================================================
#
# Uses THE K8S APPLY PATTERN (explained in common_calico/tasks/main.yml): the
# template is rendered on the controller, parsed into objects and applied via
# the API; "changed" only when a live object really differs.
# Points the Services "mariadb", "redis" and the Grafana service at the host
# IP, so pods use plain DNS names while the daemons run outside K3s.

- name: ExtSvc | Apply external services (MariaDB, Redis, Grafana)
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 34), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'external-services.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: ext_svc_apply

---
# =============================================================================
# Kubernetes namespace and secrets
# =============================================================================

# --dry-run=client -o yaml | apply is the idempotent way to create a namespace
# without the task failing when the namespace already exists.
- name: NS | Ensure nextcloud namespace exists
  ansible.builtin.shell: >
    k3s kubectl create namespace nextcloud --dry-run=client -o yaml
    | k3s kubectl apply -f -
  changed_when: false

# CIS 5.2.1 (Pod Security Standards): warn/audit only, deliberately NOT
# enforce. nextcloud and nextcloud-cron use HostPath volumes (RWO app/data
# dirs), which the "baseline" standard disallows - enforce would reject every
# future pod (the every-5-min nextcloud-cron CronJob and any deploy rollout).
# warn/audit surface the same violations without blocking anything.
- name: NS | Label nextcloud namespace with Pod Security Standards (warn/audit only)
  ansible.builtin.command: >
    k3s kubectl label namespace nextcloud
    pod-security.kubernetes.io/warn=baseline
    pod-security.kubernetes.io/audit=baseline
    --overwrite
  register: ns_label
  changed_when: "'labeled' in ns_label.stdout"

# CIS 5.1.5/5.1.6: belt-and-suspenders alongside automountServiceAccountToken:
# false already set on every Pod template in this namespace - kube-bench's
# automated check looks at the ServiceAccount object itself, not just
# whether any Pod using it happens to override the setting.
- name: NS | Disable SA token automount on the default ServiceAccount (CIS 5.1.5/5.1.6)
  ansible.builtin.command: >
    k3s kubectl patch serviceaccount default -n nextcloud
    --patch "{\"automountServiceAccountToken\": false}"
  register: sa_patch
  changed_when: "'patched' in sa_patch.stdout"

# -----------------------------------------------------------------------------
# Secret: nextcloud-secrets
# Contains DB credentials, admin credentials, and mail credentials.
# Rendered to a temp file (no_log) so passwords never appear in Ansible output.
# -----------------------------------------------------------------------------
- name: Secrets | Template K8s Secret manifest
  ansible.builtin.template:
    src: secret.yml.j2
    dest: /tmp/k8s-nc-secret.yml
    mode: "0600"
  no_log: true

- name: Secrets | Apply K8s Secret
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-nc-secret.yml
  register: secret_apply
  changed_when: "'created' in secret_apply.stdout or 'configured' in secret_apply.stdout"
  no_log: true

- name: Secrets | Remove temporary Secret manifest
  ansible.builtin.file:
    path: /tmp/k8s-nc-secret.yml
    state: absent

# -----------------------------------------------------------------------------
# ConfigMap: nextcloud-custom-config
# Mounted as /var/www/html/config/custom.config.php inside the FPM container.
# Nextcloud automatically loads all *.php files from the config/ directory.
# -----------------------------------------------------------------------------
- name: ConfigMap | Template nextcloud-custom-config ConfigMap
  ansible.builtin.template:
    src: custom-config-cm.yml.j2
    dest: /tmp/k8s-nc-custom-config-cm.yml
    mode: "0600"
  no_log: true

- name: ConfigMap | Apply nextcloud-custom-config ConfigMap
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-nc-custom-config-cm.yml
  register: custom_cm_apply
  changed_when: "'created' in custom_cm_apply.stdout or 'configured' in custom_cm_apply.stdout"

- name: ConfigMap | Remove temporary custom-config ConfigMap manifest
  ansible.builtin.file:
    path: /tmp/k8s-nc-custom-config-cm.yml
    state: absent

# -----------------------------------------------------------------------------
# ConfigMap: nextcloud-fpm-pool-config
# Extra PHP-FPM pool settings: status page + slow log for monitoring.
# Mounted as /usr/local/etc/php-fpm.d/z-monitoring.conf in the FPM container.
# -----------------------------------------------------------------------------
- name: ConfigMap | Template nextcloud-fpm-pool-config ConfigMap
  ansible.builtin.template:
    src: fpm-pool-cm.yml.j2
    dest: /tmp/k8s-nc-fpm-pool-cm.yml
    mode: "0644"

- name: ConfigMap | Apply nextcloud-fpm-pool-config ConfigMap
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-nc-fpm-pool-cm.yml
  register: fpm_pool_cm_apply
  changed_when: "'created' in fpm_pool_cm_apply.stdout or 'configured' in fpm_pool_cm_apply.stdout"

- name: ConfigMap | Remove temporary fpm-pool ConfigMap manifest
  ansible.builtin.file:
    path: /tmp/k8s-nc-fpm-pool-cm.yml
    state: absent

# -----------------------------------------------------------------------------
# ConfigMap: nextcloud-nginx-config
# nginx.conf for the Nginx sidecar container (proxies to FPM on 127.0.0.1:9000)
# -----------------------------------------------------------------------------
- name: ConfigMap | Template nextcloud-nginx-config ConfigMap
  ansible.builtin.template:
    src: nginx-cm.yml.j2
    dest: /tmp/k8s-nc-nginx-cm.yml
    mode: "0644"

- name: ConfigMap | Apply nextcloud-nginx-config ConfigMap
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-nc-nginx-cm.yml
  register: nginx_cm_apply
  changed_when: "'created' in nginx_cm_apply.stdout or 'configured' in nginx_cm_apply.stdout"

- name: ConfigMap | Remove temporary nginx ConfigMap manifest
  ansible.builtin.file:
    path: /tmp/k8s-nc-nginx-cm.yml
    state: absent

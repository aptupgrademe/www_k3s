---
# =============================================================================
# Defaults: next_k3s_deploy
# =============================================================================

# --- App reconcile (see tasks/apps.yml) -------------------------------------
# Make the enabled/disabled app layout reproducible from the playbook instead
# of only living in the running instance. Empty by default so a plain deploy is
# a no-op; the real per-host lists live in host_vars (they differ per instance).
nextcloud_apps_manage: true          # enforce the two lists below
nextcloud_apps_update: false         # also run `occ app:update --all` (network, opt-in)

# Non-default apps to ensure ENABLED -- but only if a version compatible with
# the running major exists. If an app was dropped or not yet ported to a new
# major, enabling is tolerated to fail and the app simply stays disabled (the
# same thing Nextcloud's own upgrader does). Never list bundled default apps
# here (files, dav, settings, theming, …) -- those are owned by the image.
nextcloud_apps_enabled: []

# Apps to force DISABLED and keep off across upgrades.
nextcloud_apps_disabled: []

# --- notify_push / High Performance Backend (see tasks/notify_push.yml) ------
# WebSocket push instead of ~30s client polling. OFF by default: it adds a
# Deployment + /push ingress route and needs a live-verified rollout (binary
# path, bind address, `occ notify_push:setup` self-test). Flip to true on cvjm
# via host_vars once verified.
nextcloud_notify_push_enabled: false
notify_push_port: 7867

---
# =============================================================================
# Role: common_auditd
# Purpose: Ensure the Linux Audit Daemon (auditd) is running and enforce
#          a baseline set of security-relevant audit rules on AlmaLinux 9.
#          Rules cover: identity files, sudoers, SSH config, cron, kernel
#          modules, sudo usage, and network configuration changes.
# =============================================================================
#
# How it works: auditd is the kernel's audit log. The rules file
# (files/hardening.rules) tells the kernel which file accesses and system
# calls to record; "augenrules --load" (the handler) compiles everything in
# /etc/audit/rules.d/ into the active rule set. A cron job then mails the
# few events that should never happen in normal operation.
#
# Ansible concepts used here:
#   copy src: (no path)  looks in the role's files/ directory
#   cron module          manages ONE crontab entry, identified by "name"
#                        (Ansible writes it as a "#Ansible: <name>" comment
#                        above the line). Changing minute/job updates that
#                        entry; changing the name would add a second one.


# -----------------------------------------------------------------------------
# Package (usually pre-installed on AlmaLinux 9 – ensure it's present)
# -----------------------------------------------------------------------------
- name: auditd | Ensure audit package is installed
  ansible.builtin.dnf:
    name: audit
    state: present


# -----------------------------------------------------------------------------
# Audit rules
# -----------------------------------------------------------------------------
- name: auditd | Deploy hardening rules
  ansible.builtin.copy:
    src: hardening.rules
    dest: /etc/audit/rules.d/hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: reload audit rules


# No restart handler for auditd itself: rules are loaded into the
# running kernel by augenrules, a daemon restart is not needed (and
# auditd refuses "systemctl restart" by design).
# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
- name: auditd | Enable and start service
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started


# -----------------------------------------------------------------------------
# Slim audit-event notifier
# auditd only logs; this turns the high-signal keys (k3s_manifests, k3s_token,
# k3s_tls, identity – the ones that must never change in normal operation) into
# an email via the existing msmtp relay. Checkpoint-based, so each event is
# reported once. Noisy keys stay purely forensic (ausearch on demand).
# -----------------------------------------------------------------------------
- name: auditd | Deploy audit-event notifier script
  ansible.builtin.template:
    src: auditd-notify.sh.j2
    dest: /usr/local/sbin/auditd-notify.sh
    owner: root
    group: root
    mode: "0750"

- name: auditd | Schedule the audit-event notifier (every 10 minutes)
  ansible.builtin.cron:
    name: "auditd critical-key notifier"
    minute: "*/10"
    user: root
    job: "/usr/local/sbin/auditd-notify.sh"

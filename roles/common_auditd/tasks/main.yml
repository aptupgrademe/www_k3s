---
# =============================================================================
# Role: common_auditd
# Purpose: Ensure the Linux Audit Daemon (auditd) is running and enforce
#          a baseline set of security-relevant audit rules on AlmaLinux 9.
#          Rules cover: identity files, sudoers, SSH config, cron, kernel
#          modules, sudo usage, and network configuration changes.
# =============================================================================


# -----------------------------------------------------------------------------
# Package (usually pre-installed on AlmaLinux 9 – ensure it's present)
# -----------------------------------------------------------------------------
- name: auditd | Ensure audit package is installed
  ansible.builtin.dnf:
    name: audit
    state: present


# -----------------------------------------------------------------------------
# Audit rules
# -----------------------------------------------------------------------------
- name: auditd | Deploy hardening rules
  ansible.builtin.copy:
    src: hardening.rules
    dest: /etc/audit/rules.d/hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: reload audit rules


# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
- name: auditd | Enable and start service
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# Managed by Ansible (role: next_mariadb) - systemd sandboxing for MariaDB.
#
# Unlike sshd, MariaDB starts no user sessions, so nothing here is inherited by
# anything a human or Ansible runs. A restriction in this unit restricts only
# the database, which is what makes this the right place for sandboxing - and
# the sshd unit the wrong one.
#
# Every setting below was checked against what this server's MariaDB actually
# does; the comments record why, so a future change can be judged against it.

[Service]
# --- Capabilities ----------------------------------------------------------
# A file-backed server listening on 3306 (>1024) needs no capability at all.
# The distro unit grants CAP_IPC_LOCK for large pages / memlock; both are off
# here (large_pages=0, memlock unset), so the capability goes with them.
AmbientCapabilities=
CapabilityBoundingSet=
# No PAM auth is configured (every account uses mysql_native_password), so
# nothing invokes the setuid auth_pam_tool and privileges never need to grow.
NoNewPrivileges=yes

# --- Start mariadbd directly, not through /bin/sh ---
# The distro unit starts "/bin/sh -c '... galera_recovery ...; exec mariadbd'".
# With NoNewPrivileges (set above and implied by several options below) SELinux
# refuses the domain transition from the shell (initrc_t) into mysqld_t
# ("avc: denied { nnp_transition }"), so MariaDB ran as initrc_t - without
# its own SELinux confinement - from 2026-09-11 until 2026-10-16. Executed
# directly by systemd, the transition is allowed (tested with systemd-run).
# The shell only exists for Galera recovery; wsrep is off on these hosts.
ExecStart=
ExecStart=/usr/sbin/mariadbd $MYSQLD_OPTS $_WSREP_NEW_CLUSTER

# --- Filesystem ------------------------------------------------------------
# The distro sets ProtectSystem=full (/usr and /boot read-only). strict makes
# the whole tree read-only, so each writable path has to be named. datadir,
# socket and pid file all live under /var/lib/mysql. The "-" prefix tolerates
# a path that does not exist - the slow log is currently disabled.
ProtectSystem=strict
ReadWritePaths=/var/lib/mysql
ReadWritePaths=-/var/log/mariadb
# Private /tmp and /var/tmp as tmpfs (instead of PrivateTmp=yes, which gives
# private directories on disk). MariaDB's tmpdir is /tmp: internal temp
# tables that do not fit into tmp_table_size (2,000-3,500 a day here - TEXT
# columns always go to disk), filesort files and the sort files of online
# ALTER TABLE during Nextcloud upgrades. A tmpfs keeps them in RAM and only
# uses memory while files exist; 4G leaves room for an index rebuild of
# oc_filecache (2026-10-16: 8 and 19 GB available on the two hosts).
# Do NOT combine with PrivateTmp=yes: tested 2026-10-16 with systemd-run,
# the private disk directory then wins and /tmp stays on xfs. The tmpfs
# gets the same SELinux type (tmp_t) as before.
TemporaryFileSystem=/tmp:size=4G,mode=1777,nosuid,noexec
TemporaryFileSystem=/var/tmp:size=64M,mode=1777,nosuid,noexec
ProtectHome=yes

# --- Kernel and hardware ---------------------------------------------------
# The running process holds only /dev/null open, so a minimal device set is
# enough.
PrivateDevices=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectProc=invisible
# Deliberately NO ProcSubset=pid: MariaDB reads /proc/meminfo during sizing,
# and hiding it breaks startup.

# --- Process and system calls ----------------------------------------------
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged

# --- Network ---------------------------------------------------------------
# AF_NETLINK is required: skip_name_resolve is off, so MariaDB resolves client
# hostnames and glibc enumerates local interfaces over netlink. Leaving it out
# is the same mistake that made every tool fail inside an SSH session.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

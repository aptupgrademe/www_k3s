---
# =============================================================================
# Role: blog_selinux (AlmaLinux 9 – K3s mode)
#
# In K3s mode Nginx and PHP-FPM run inside containers – httpd_* SELinux types
# are no longer needed.  Instead the HostPath volume directory must carry the
# container_file_t type so that the container runtime (containerd/K3s) can
# read and write it while SELinux is in enforcing mode.
# =============================================================================


# -----------------------------------------------------------------------------
# Packages
# -----------------------------------------------------------------------------
- name: SELinux | Ensure SELinux tools are installed (semanage/restorecon)
  ansible.builtin.dnf:
    name:
      - policycoreutils
      - policycoreutils-python-utils
      - selinux-policy-targeted
      - container-selinux   # K3s container SELinux policy
    state: present

# ansible.posix, not ansible.builtin: the selinux module lives in the collection.
# "ansible.builtin.selinux" only works because ansible-core still redirects the
# old name, and that redirect will not last forever.
- name: SELinux | Ensure SELinux is enforcing (targeted policy)
  ansible.posix.selinux:
    policy: targeted
    state: enforcing


# -----------------------------------------------------------------------------
# HostPath volume directories
# -----------------------------------------------------------------------------
# Owner/mode MUST match blog_k3s_deploy/tasks/dirs.yml, otherwise the two roles
# flip them on every playbook run (www dir briefly root-owned = the 2026-08-26
# TranslatePress "Permission denied"; DB dir briefly world-listable). Aligned
# 2026-09-23 after the same bug was found on the Nextcloud host.
- name: SELinux | Ensure WordPress www HostPath directory exists
  ansible.builtin.file:
    path: "{{ blog_k3s_www_dir }}"
    state: directory
    owner: 33
    group: 33
    mode: "0755"

- name: SELinux | Ensure MariaDB data HostPath directory exists
  ansible.builtin.file:
    path: "{{ blog_k3s_db_dir }}"
    state: directory
    owner: "999"   # mysql user inside the mariadb container
    group: "999"
    mode: "0750"


# -----------------------------------------------------------------------------
# SELinux file contexts for K3s HostPath volumes
# container_file_t allows containerd to read/write these directories
# while SELinux is enforcing.
# -----------------------------------------------------------------------------
- name: SELinux | Label WordPress www dir as container_file_t
  ansible.builtin.command: >
    semanage fcontext -a -t container_file_t "{{ blog_k3s_www_dir }}(/.*)?"
  register: semanage_www
  changed_when: semanage_www.rc == 0 and "already defined" not in (semanage_www.stderr | default(""))
  failed_when: semanage_www.rc != 0 and "already defined" not in (semanage_www.stderr | default(""))

- name: SELinux | Apply SELinux context to WordPress www dir
  ansible.builtin.command: restorecon -Rv "{{ blog_k3s_www_dir }}"
  changed_when: false

- name: SELinux | Label MariaDB data dir as container_file_t
  ansible.builtin.command: >
    semanage fcontext -a -t container_file_t "{{ blog_k3s_db_dir }}(/.*)?"
  register: semanage_db
  changed_when: semanage_db.rc == 0 and "already defined" not in (semanage_db.stderr | default(""))
  failed_when: semanage_db.rc != 0 and "already defined" not in (semanage_db.stderr | default(""))

- name: SELinux | Apply SELinux context to MariaDB data dir
  ansible.builtin.command: restorecon -Rv "{{ blog_k3s_db_dir }}"
  changed_when: false


# -----------------------------------------------------------------------------
# SELinux boolean: allow containers to make outbound network connections
# (needed for container → MariaDB on the host, and for WordPress HTTP calls)
# -----------------------------------------------------------------------------
- name: SELinux | Allow container processes to make outbound network connections
  ansible.posix.seboolean:
    name: container_manage_cgroup
    state: true
    persistent: true
  failed_when: false   # boolean may not exist on all policy versions

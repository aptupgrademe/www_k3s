---
# =============================================================================
# Role: nextcloud_verify
# Purpose: Post-deployment smoke tests for the Nextcloud stack.
#          All checks run regardless of individual failures (failed_when: false).
#          Results are displayed as a colored terminal report.
#          The play fails at the end if any CRITICAL check did not pass.
# =============================================================================
#
# How it works: same "collect, judge, report, assert" structure as
# blog_verify (see blog_verify/tasks/main.yml), with Nextcloud-specific
# checks: host MariaDB/Redis, Collabora, status.php, occ status, cron mode,
# the richdocuments WOPI URL, and blocked /config + /data paths.

- name: Verify | Set report color codes
  ansible.builtin.set_fact:
    _g: "\x1b[32m"
    _r: "\x1b[31m"
    _y: "\x1b[33m"
    _h: "\x1b[1;36m"
    _b: "\x1b[1m"
    _z: "\x1b[0m"
    _ok: "\x1b[32m✓\x1b[0m"
    _fail: "\x1b[31m✗\x1b[0m"

- name: nextcloud_verify | Checks (services, K8s, HTTPS, security, Nextcloud)
  ansible.builtin.import_tasks: checks.yml

- name: nextcloud_verify | Results, report, e-mail, assert, optional Monit selftest
  ansible.builtin.import_tasks: report.yml

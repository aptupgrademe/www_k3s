---
# Handlers of common_ssh. Order of definition = order of execution:
#   Validate sshd config        sshd -t: a broken config stops the play
#                               BEFORE sshd is restarted with it
#   Reload systemd units        re-read the drop-in
#   Reload sshd                 the actual restart, fire-and-forget
#   Reset connection            drop Ansible's (now dead) SSH connection
#   Confirm sshd is accepting   reconnect; fails the play if sshd is gone
# Ansible concepts:
#   async: 30 + poll: 0  start the task in the background and do not wait for
#                  its result - the only way to survive the restart of the
#                  very sshd the task runs through
#   meta: reset_connection  closes the cached (multiplexed) SSH connection;
#                  the next task opens a fresh one
#   wait_for_connection  retries until Ansible can run a module again

- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false

# daemon-reload does not touch the running sshd, so it is safe to run
# synchronously - a failure here should still be reported normally.
- name: Reload systemd units for sshd
  ansible.builtin.systemd:
    daemon_reload: true

# "restarted", not "reloaded": systemd only re-applies exec-time sandboxing
# (RestrictAddressFamilies, ProtectKernelTunables, ...) when the unit is
# actually restarted. A reload just SIGHUPs the process, so changes to
# hardening.conf would silently never take effect.
#
# The restart tears down the sshd that Ansible is running this very module
# through, so the module's JSON result never arrives and the task dies with
#   "Module result deserialization failed: No start of json char found"
# (seen 2026-09-10 and again 2026-09-13). async + poll: 0 fires the restart
# and returns immediately instead of waiting for a reply over a dying channel.
# Losing the return value is fine here: the config was already validated by
# the handler above, and the two steps below prove sshd came back.
- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  async: 30
  poll: 0

- name: Reset connection after sshd restart
  ansible.builtin.meta: reset_connection

# The fire-and-forget restart cannot report success, so verify it by actually
# reconnecting. If sshd failed to come back, the play stops here - loudly, and
# while a second session is presumably still open - rather than continuing
# against a host that is about to become unreachable.
- name: Confirm sshd is accepting connections again
  ansible.builtin.wait_for_connection:
    delay: 2
    timeout: 60

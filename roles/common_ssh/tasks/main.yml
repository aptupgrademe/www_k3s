---
# =============================================================================
# Role: ssh
# Purpose: Harden SSH by setting a custom port (10022), deploying a locked-down
#          sshd_config, and ensuring SELinux labels the new port correctly.
# Target:  AlmaLinux 9 (SELinux enforcing by default)
# =============================================================================


# -----------------------------------------------------------------------------
# STEP 0: Detect the initial hardening run (still connected on port 22)
# -----------------------------------------------------------------------------
# Captured before anything below changes sshd_config, so it reflects how THIS
# run actually connected, not the port sshd ends up on. common_firewall (which
# runs right after this role in every playbook) uses this same fact to decide
# whether to activate the new firewall live or defer it to a reboot - see the
# comment on "First run only" near the end of that role for why.
# -----------------------------------------------------------------------------
- name: SSH | Detect whether this is the initial SSH/firewall hardening run
  ansible.builtin.set_fact:
    ssh_first_run: "{{ (ansible_port | default(22) | int) == 22 }}"


# -----------------------------------------------------------------------------
# STEP 1: Ensure SELinux management tools are present
# -----------------------------------------------------------------------------
# "semanage" (from policycoreutils-python-utils) lets us assign SELinux labels
# to custom ports. Without it, Steps 2 and 3 would fail.
# -----------------------------------------------------------------------------
- name: SSH | Install SELinux management tools
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present


# -----------------------------------------------------------------------------
# STEP 2: Check whether tcp/10022 already has an SELinux label
# -----------------------------------------------------------------------------
# We query the full SELinux port list once and reuse the result in Steps 3a/3b.
# This avoids fragile error-code logic and keeps both follow-up tasks idempotent.
#
# "changed_when: false" – read-only query, never counts as a change.
# "failed_when: false"  – returns non-zero when the port is unlabelled; that is
#                         expected on a fresh system, not an error.
# -----------------------------------------------------------------------------
- name: SSH | Query current SELinux port labels
  ansible.builtin.command: semanage port -l
  register: semanage_port_list
  changed_when: false
  failed_when: false


# -----------------------------------------------------------------------------
# STEP 3a: Add SELinux label for tcp/10022 (port not yet in database)
# -----------------------------------------------------------------------------
- name: SSH | Add ssh_port_t label for tcp/10022 in SELinux (new entry)
  ansible.builtin.command: semanage port -a -t ssh_port_t -p tcp 10022
  when: "'10022' not in (semanage_port_list.stdout | default(''))"
  changed_when: true


# -----------------------------------------------------------------------------
# STEP 3b: Update SELinux label for tcp/10022 (port exists with wrong type)
# -----------------------------------------------------------------------------
# Only runs when 10022 is already in the database but not labelled ssh_port_t.
# "semanage port -m" updates an existing entry (-a would fail in this case).
# -----------------------------------------------------------------------------
- name: SSH | Update ssh_port_t label for tcp/10022 in SELinux (modify existing entry)
  ansible.builtin.command: semanage port -m -t ssh_port_t -p tcp 10022
  when:
    - "'10022' in (semanage_port_list.stdout | default(''))"
    - "'ssh_port_t' not in (semanage_port_list.stdout | default('') | regex_search('ssh_port_t.*10022') | default(''))"
  changed_when: true


# -----------------------------------------------------------------------------
# STEP 4: Deploy sshd_config
# -----------------------------------------------------------------------------
# Copies the hardened SSH configuration to the target host.
#   mode 0600  – only root may read or modify this file (SSH requirement)
#   backup     – keeps a timestamped copy of the previous config for rollback
#   notify     – handlers run once at the end of the play (Ansible deduplicates
#                them, so multiple notifies still only trigger one restart)
# -----------------------------------------------------------------------------
- name: SSH | Deploy hardened sshd_config
  ansible.builtin.copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Validate sshd config


# -----------------------------------------------------------------------------
# STEP 5: Deploy SSH login banner
# -----------------------------------------------------------------------------
# Shown to users before authentication. Mode 0644 is intentional – the file
# contains no secrets and sshd reads it as a non-root process.
# template is used instead of copy so Jinja2 variables (e.g. nextcloud_ipv4)
# are rendered into the banner at deploy time.
# -----------------------------------------------------------------------------
- name: SSH | Deploy SSH login banner
  ansible.builtin.template:
    src: sshd_banner.j2
    dest: /etc/ssh/sshd_banner
    owner: root
    group: root
    mode: "0644"
  notify: Validate sshd config

# CIS 1.8.x: /etc/issue and /etc/issue.net (local console + some SSH clients'
# pre-auth banner) default to "\S Kernel \r on an \m" - a free OS/kernel
# version disclosure to anyone who gets to the login prompt. sshd's own
# Banner directive already points at sshd_banner above (the real deterrent
# text), so this is purely closing the separate OS-fingerprinting leak, not
# a functional change to SSH access.
- name: SSH | Replace /etc/issue and /etc/issue.net (remove OS/kernel version disclosure)
  ansible.builtin.copy:
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Authorized access only. All activity may be monitored and reported.
  loop:
    - /etc/issue
    - /etc/issue.net


# -----------------------------------------------------------------------------
# STEP 6: Restore SELinux file contexts for /etc/ssh
# -----------------------------------------------------------------------------
# Ansible does not automatically apply SELinux labels when copying files.
# "restorecon -Rv" resets all labels under /etc/ssh to the values defined in
# the SELinux policy, preventing sshd from being blocked after a file change.
#
# "changed_when: false" – safe to run every time, not a meaningful change.
# -----------------------------------------------------------------------------
- name: SSH | Restore SELinux file contexts for /etc/ssh
  ansible.builtin.command: restorecon -Rv /etc/ssh
  changed_when: false


# -----------------------------------------------------------------------------
# STEP 7: systemd hardening drop-in for sshd
# Conservative: no NoNewPrivileges (sshd needs setuid for user sessions).
# AF_NETLINK is required in the allow-list: without it, any tool invoked in an
# SSH session that talks to the kernel over netlink (nft, ip, ss, ...) fails
# with "Unable to initialize Netlink socket" since it inherits sshd's seccomp
# filter. This previously made it impossible to diagnose or fix nftables
# issues remotely.
# No RestrictSUIDSGID: its seccomp filter is inherited by every SSH session
# and blocks chmod/chown from setting setuid/setgid bits even for root,
# regardless of capabilities. This broke installing packages (e.g. MariaDB's
# setuid-root auth_pam_tool) over an SSH session.
# No PrivateTmp either, for the same reason: it gives the sshd *service* its
# own /tmp, which every SSH session then inherits. Two consequences, both
# surprising: a file dropped in /tmp over SSH is invisible to cron and to
# other services, and every sshd restart destroys that /tmp under any session
# still attached to it. The second one bit twice (2026-09-10, 2026-09-13) as
#   Cannot create repo temporary directory "/tmp/libdnf.XXXXXX"
# from dnf running over a multiplexed connection that outlived the restart.
# sshd itself barely uses /tmp, so the protection was worth close to nothing.
# Per-service sandboxing belongs on services that spawn no sessions - see
# roles/next_mariadb/files/systemd-hardening.conf for that done properly.
# -----------------------------------------------------------------------------
- name: SSH | Ensure sshd.service.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/sshd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: SSH | Deploy sshd systemd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/sshd.service.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      RestrictRealtime=yes
      LockPersonality=yes
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
  notify:
    # All four, in this order. Splitting daemon-reload out of the restart made
    # it a separate handler, and a drop-in change is worthless without it:
    # systemd would restart sshd from its cached copy of the old unit.
    - Reload systemd units for sshd
    - Reload sshd
    - Reset connection after sshd restart
    - Confirm sshd is accepting connections again
---
# =============================================================================
# Role: nas_zfs
# Purpose: Create OpenZFS RAIDZ1 pool on three data SSDs.
#
# SAFETY: Aborts if Linux md RAID (md0) still exists on those disks.
#         See nas.yml migration notes for the manual steps required first.
# =============================================================================

# --- Pre-flight: abort if md0 still exists ---
- name: ZFS | Check if md0 still exists
  ansible.builtin.stat:
    path: /dev/md0
  register: _md0

- name: ZFS | Fail if md0 still exists (manual migration required)
  ansible.builtin.fail:
    msg: |
      /dev/md0 still exists! The Linux md RAID must be manually dismantled
      before ZFS can be created on those disks.
      See the migration notes at the top of nas.yml for the required steps.
  when: _md0.stat.exists

# --- Check if pool already exists ---
- name: ZFS | Check if pool already exists
  ansible.builtin.command: zpool list {{ nas_zfs_pool }}
  register: _pool_exists
  changed_when: false
  failed_when: false

# --- Load ZFS kernel module ---
- name: ZFS | Ensure ZFS module is loaded
  community.general.modprobe:
    name: zfs
    state: present
  when: not _pool_exists.rc == 0

# --- Create RAIDZ1 pool ---
# compression=zstd: better ratio than lz4 for documents/backups, low CPU overhead
# ashift=12: 4K sector alignment for modern SSDs
# xattr=sa: stores xattrs in inodes (faster for Samba)
# atime=off: no access-time updates → fewer writes
# dnodesize=auto: larger dnodes for better metadata performance
- name: ZFS | Create RAIDZ1 pool '{{ nas_zfs_pool }}'
  ansible.builtin.command: >
    zpool create -f
    -o ashift=12
    -o autotrim=on
    -O compression=zstd
    -O atime=off
    -O xattr=sa
    -O dnodesize=auto
    -O recordsize=128k
    -O snapdir=hidden
    -O mountpoint={{ nas_zfs_mountpoint }}
    {{ nas_zfs_pool }} raidz
    {{ nas_zfs_disks | join(' ') }}
  when: not _pool_exists.rc == 0

# --- Create datasets (one per Samba share → paths always in sync) ---
# Dataset name = share name, mountpoint = nas_zfs_mountpoint/share_name
- name: ZFS | Create dataset for each Samba share
  community.general.zfs:
    name: "{{ nas_zfs_pool }}/{{ item.name }}"
    state: present
    extra_zfs_properties:
      mountpoint: "{{ nas_zfs_mountpoint }}/{{ item.name }}"
      recordsize: "1M"
      compression: "zstd"
  loop: "{{ nas_samba_shares }}"

# --- Ownership (user from Samba share definition) ---
- name: ZFS | Set ownership on datasets
  ansible.builtin.file:
    path: "{{ nas_zfs_mountpoint }}/{{ item.name }}"
    owner: "{{ item.force_user }}"
    group: "{{ item.force_user }}"
    mode: "0755"
    state: directory
  loop: "{{ nas_samba_shares }}"

# --- Enable auto-mount on boot ---
- name: ZFS | Enable zfs-mount systemd service
  ansible.builtin.systemd:
    name: zfs-mount.service
    enabled: true
    state: started

- name: ZFS | Enable zfs-import-cache systemd service
  ansible.builtin.systemd:
    name: zfs-import-cache.service
    enabled: true

# --- Pool status info ---
- name: ZFS | Show pool status
  ansible.builtin.command: zpool status {{ nas_zfs_pool }}
  register: _pool_status
  changed_when: false

- name: ZFS | Print pool status
  ansible.builtin.debug:
    msg: "{{ _pool_status.stdout_lines }}"

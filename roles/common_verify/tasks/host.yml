---
# =============================================================================
# common_verify: host checks (nftables, fail2ban, K3s, auditd, SELinux, TCP BBR)
# Shared by blog_verify and nextcloud_verify (imported from their checks.yml).
# Read-only except the fail2ban effect test: every check registers its
# result (_v_*) with failed_when: false;
# the calling role turns them into the report and the final assert.
# =============================================================================
#
# How this file is used: common_verify is never listed in a playbook. It is
# a "library role" - blog_verify and nextcloud_verify pull its task files in
# with
#     ansible.builtin.import_role:
#       name: common_verify
#       tasks_from: host        # = tasks/host.yml
# so the same checks run on both stacks without being written twice.
# tasks_from picks a file other than tasks/main.yml (this role has none).
#
# The pattern of every task here ("collect, judge later"):
#   command/shell      runs a read-only check on the server
#   register: _v_x     stores rc, stdout, stderr ... under that name
#   failed_when: false never fails here - a broken service must still show
#                      up in the report next to all the other results, not
#                      stop the play at the first problem
#   changed_when: false a check changes nothing, so never "changed"
#   check_mode: false  also run in --check (command/shell would be skipped)
# The calling role evaluates the _v_* results afterwards (report + assert).
#
# command vs shell: "command" runs the program directly - no pipes, no
# redirects, no shell variables, which also means nothing can be injected.
# "shell" is used only where a pipe (|) or redirect is needed, and then
# with "set -o pipefail" so a failure early in the pipe is not hidden by a
# later command that succeeds.

# "systemctl is-active" prints active/inactive/failed and exits 0 only for
# "active" - the report later looks at stdout.
- name: Verify | nftables – service active?
  ansible.builtin.command: systemctl is-active nftables
  register: _v_nft_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | nftables – inet filter table loaded?
  ansible.builtin.command: nft list tables
  register: _v_nft_tables
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# grep -c counts matching lines: "1" = the input chain drops everything
# that no rule allowed (default-deny).
- name: Verify | nftables – policy drop present?
  ansible.builtin.shell: |
    set -o pipefail
    nft list chain inet filter input 2>/dev/null | grep -c 'policy drop'
  register: _v_nft_policy
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# fail2ban writes into one set pair per jail, f2b_<name>4/6 (fail2ban_nft_jails,
# group_vars). The number of f2b_ sets in our table must be twice the number of
# jails; fewer means some bans have no effect. (Until 2026-10-21: banned4.)
- name: Verify | nftables – fail2ban sets present?
  ansible.builtin.shell: |
    set -o pipefail
    nft list sets inet 2>/dev/null | grep -c 'set f2b_'
  register: _v_nft_f2b_sets
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# Effect test instead of "configured and running" (2026-10-26): every filter
# against a canned line in today's log format, then per jail a ban of a
# TEST-NET address must land in that jail's own set pair and an unban must
# remove it, and an unban in one jail must not free an address another jail
# still bans. Each of these broke once without any check noticing (IPv6 bans,
# shared set, a filter that never matched). Not read-only: the test addresses
# (192.0.2.x, 2001:db8::x - never routed) are banned for a second and lifted
# again. Run from stdin, /tmp is noexec.
- name: Verify | fail2ban – ban chain effect test
  ansible.builtin.command:
    cmd: >-
      bash -s --
      {% for j, s in fail2ban_nft_jails.items() %}{{ j }}={{ s }} {% endfor %}
    stdin: "{{ lookup('ansible.builtin.file', 'f2b-effect-test.sh') }}"
  register: _v_f2b_effect
  changed_when: false
  check_mode: false   # bans only TEST-NET addresses and lifts them again
  failed_when: false

- name: Verify | fail2ban – service active?
  ansible.builtin.command: systemctl is-active fail2ban
  register: _v_f2b_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | fail2ban – jail status
  ansible.builtin.command: fail2ban-client status
  register: _v_f2b_status
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | k3s – service active?
  ansible.builtin.command: systemctl is-active k3s
  register: _v_k3s_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | auditd – service active?
  ansible.builtin.command: systemctl is-active auditd
  register: _v_auditd_svc
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Verify | SELinux – enforcing mode?
  ansible.builtin.command: getenforce
  register: _v_selinux
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# Enforcing is not enough: a process can still run in the wrong domain (found
# twice, see CLAUDE.md). Every process in a pod cgroup must be container_t.
# Output: the number of pod processes, then one line per process that is not
# ("<type> <command>"). Reads /proc only.
- name: Verify | SELinux – every pod process container_t?
  ansible.builtin.shell: |
    set -o pipefail
    n=0; bad=''
    for d in /proc/[0-9]*; do
      grep -q kubepods "$d/cgroup" 2>/dev/null || continue
      t=$(cut -d: -f3 "$d/attr/current" 2>/dev/null | tr -d '\0')
      [ -n "$t" ] || continue
      n=$((n + 1))
      [ "$t" = container_t ] || bad="$bad$t $(tr -d '\0' < "$d/comm")\n"
    done
    echo "$n"; printf "%b" "$bad" | sort -u
  register: _v_pod_selinux
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# Set by common_sysctl; "bbr" expected. -n prints only the value.
- name: Verify | Performance – TCP BBR active?
  ansible.builtin.command: sysctl -n net.ipv4.tcp_congestion_control
  register: _v_bbr
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

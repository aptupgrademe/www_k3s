---
# -----------------------------------------------------------------------------
# WordPress core installation
# wp-config.php is created automatically by the container via WORDPRESS_DB_*
# env vars. We only need to run wp core install to set up the DB tables.
# -----------------------------------------------------------------------------
#
# "wp core is-installed" exits 0 when the WordPress tables exist, 1 when
# not - registered with failed_when: false, so rc decides whether the
# install task runs (when: wp_installed.rc != 0). On every run after the
# first one, the install task is skipped.

- name: WordPress | Check if WordPress is already installed
  ansible.builtin.command: >
    k3s kubectl exec deployment/wordpress
    --namespace wordpress
    --container wordpress-fpm --
    php /usr/local/lib/wp-cli/wp-cli.phar core is-installed
    --path=/var/www/html
    --allow-root
  register: wp_installed
  failed_when: false
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

# The ">" folded block joins all lines into one command line. blog_title
# goes through the "quote" filter because it may contain spaces; the
# other values are single words. --skip-email: no "new site" mail.
- name: WordPress | Run initial installation
  ansible.builtin.command: >
    k3s kubectl exec deployment/wordpress
    --namespace wordpress
    --container wordpress-fpm --
    php /usr/local/lib/wp-cli/wp-cli.phar core install
    --path=/var/www/html
    --url={{ blog_url }}
    --title={{ blog_title | quote }}
    --admin_user={{ blog_admin_user }}
    --admin_password={{ blog_admin_pass }}
    --admin_email={{ blog_admin_email }}
    --skip-email
    --allow-root
  when: wp_installed.rc != 0
  changed_when: true
  no_log: true   # the command line contains --admin_password

---
# =============================================================================
# Role: blog_wordpress (K3s mode)
# Purpose: Run the WordPress initial installation and plugin setup via
#          kubectl exec into the running wordpress-fpm container.
#
# Prerequisites:
#   - blog_k3s_deploy has deployed the WordPress pod and it is ready
#   - The init container (init-dirs) has downloaded and checksum-verified
#     WP-CLI into the wp-cli emptyDir, mounted read-only in the fpm
#     container at /usr/local/lib/wp-cli/wp-cli.phar (deliberately outside
#     the document root, see blog_k3s_deploy/templates/wordpress-deployment.yml.j2)
#   - wp-config.php was auto-created by the wordpress:fpm entrypoint
#     (WORDPRESS_DB_* env vars trigger auto-configuration on first start)
# =============================================================================


# -----------------------------------------------------------------------------
# Shorthand for repeated kubectl exec prefix
# -----------------------------------------------------------------------------
# All WP-CLI commands run as root inside the container.
# --allow-root bypasses WP-CLI's user check (container may run as root).
# --path=/var/www/html is explicit to avoid working-directory ambiguity.

# Wait for the pod to be fully ready before running WP-CLI
- name: WordPress | Wait for WordPress pod to be ready
  ansible.builtin.command: >
    k3s kubectl wait deployment/wordpress
    --namespace wordpress
    --for=condition=available
    --timeout=300s
  changed_when: false


# -----------------------------------------------------------------------------
# WordPress core installation
# wp-config.php is created automatically by the container via WORDPRESS_DB_*
# env vars. We only need to run wp core install to set up the DB tables.
# -----------------------------------------------------------------------------
- name: WordPress | Check if WordPress is already installed
  ansible.builtin.command: >
    k3s kubectl exec deployment/wordpress
    --namespace wordpress
    --container wordpress-fpm --
    php /usr/local/lib/wp-cli/wp-cli.phar core is-installed
    --path=/var/www/html
    --allow-root
  register: wp_installed
  failed_when: false
  changed_when: false

- name: WordPress | Run initial installation
  ansible.builtin.command: >
    k3s kubectl exec deployment/wordpress
    --namespace wordpress
    --container wordpress-fpm --
    php /usr/local/lib/wp-cli/wp-cli.phar core install
    --path=/var/www/html
    --url={{ blog_url }}
    --title={{ blog_title | quote }}
    --admin_user={{ blog_admin_user }}
    --admin_password={{ blog_admin_pass }}
    --admin_email={{ blog_admin_email }}
    --skip-email
    --allow-root
  when: wp_installed.rc != 0
  changed_when: true


# -----------------------------------------------------------------------------
# Security hardening mu-plugin
# Must-use plugins load automatically without activation.
# Handles: hide WP/Yoast version, block REST API user enumeration,
#          remove Link header, block ?author= enumeration.
# -----------------------------------------------------------------------------
- name: WordPress | Ensure mu-plugins directory exists
  ansible.builtin.command: >
    k3s kubectl exec deployment/wordpress
    --namespace wordpress
    --container wordpress-fpm --
    mkdir -p /var/www/html/wp-content/mu-plugins
  changed_when: false

- name: WordPress | Deploy security hardening mu-plugin
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - sh
      - -c
      - |
        cat > /var/www/html/wp-content/mu-plugins/security-hardening.php << 'PHPEOF'
        <?php
        /**
         * Security hardening – managed by Ansible (blog_wordpress).
         * Hides version info and restricts information-disclosure endpoints.
         */

        // Remove WordPress version from <meta name="generator"> and RSS feeds
        remove_action('wp_head', 'wp_generator');
        add_filter('the_generator', '__return_empty_string');

        // Remove Link: <wp-json> discovery header and <link> tag in <head>
        remove_action('template_redirect', 'rest_output_link_header', 11);
        remove_action('wp_head', 'rest_output_link_tag');

        // Remove legacy RSD and Windows Live Writer links from <head>
        remove_action('wp_head', 'rsd_link');
        remove_action('wp_head', 'wlwmanifest_link');

        // Hide Yoast SEO version from HTML comment
        add_filter('wpseo_debug_markers', '__return_false');

        // Block REST API user enumeration for unauthenticated requests
        add_filter('rest_endpoints', function($endpoints) {
            if (!is_user_logged_in()) {
                unset($endpoints['/wp/v2/users']);
                unset($endpoints['/wp/v2/users/(?P<id>[\d]+)']);
            }
            return $endpoints;
        });
        PHPEOF
        chown www-data:www-data /var/www/html/wp-content/mu-plugins/security-hardening.php
  changed_when: true
  notify: Restart wordpress deployment (OPcache picks up changed PHP files)

# A breadcrumb-fix.php mu-plugin used to live here, working around a
# TranslatePress + Yoast/Breadcrumb-Trail compatibility bug (TranslatePress's
# automatic gettext translation corrupted raw PHP date-format characters used
# internally by both breadcrumb systems). Removed 2026-08-26 along with
# TranslatePress itself (see removed 'translatepress-multilingual' entry in
# host_vars) - the user wasn't happy with the plugin and one-language-free-tier
# limit, so it's gone rather than fixed further. The underlying corruption
# only ever happened because TranslatePress was auto-translating those gettext
# calls; without it, both breadcrumb systems work unmodified.


# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
# The install tasks and the ownership fix are one block/always unit on purpose.
# WP-CLI runs with --allow-root and therefore writes every plugin file as
# root:root; PHP-FPM runs as www-data (uid 33) and cannot write into a
# root-owned plugin directory afterwards. If an install fails halfway, the
# files it already unpacked stay root-owned, and without the `always` the play
# would abort before the chown ever runs – leaving the site with plugins it
# cannot write to. That is not hypothetical: on 2026-08-16 a wordpress.org
# download timed out (cURL error 28 after 10 s) on the compressx item, the play
# stopped there, and all-in-one-wp-migration was left unable to create its
# storage/ directory until the chown was run by hand.
- name: WordPress | Install plugins and fix ownership
  block:
    # `until` retries per loop item, so one flaky download no longer takes the
    # whole run with it. wp-cli's HTTP timeout is a hard-coded 10 s and cannot
    # be raised from the command line, so retrying is the only lever here.
    - name: WordPress | Install and activate plugins
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar plugin install {{ item }} --activate --force
        --path=/var/www/html
        --allow-root
      loop: "{{ blog_wordpress_plugins | default([]) }}"
      register: wp_plugin_result
      until: wp_plugin_result.rc == 0
      retries: 3
      delay: 10
      changed_when: >
        'Installing' in wp_plugin_result.stdout or
        'Activating' in wp_plugin_result.stdout

    # Redis Object Cache plugin – installed and enabled separately because
    # wp redis enable places the object-cache.php drop-in (separate WP-CLI command).
    - name: WordPress | Install and activate Redis Object Cache plugin
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar plugin install redis-cache --activate
        --path=/var/www/html
        --allow-root
      register: wp_redis_install
      until: wp_redis_install.rc == 0
      retries: 3
      delay: 10
      changed_when: >
        'Installing' in wp_redis_install.stdout or
        'Activating' in wp_redis_install.stdout

    - name: WordPress | Enable Redis object-cache drop-in
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar redis enable
        --path=/var/www/html
        --allow-root
      register: wp_redis_enable
      changed_when: "'Success' in wp_redis_enable.stdout"
      failed_when: false

  always:
    # Runs even when an install above failed – see the block comment.
    - name: WordPress | Fix wp-content ownership after plugin installation
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        chown -R www-data:www-data /var/www/html/wp-content
      changed_when: false


# -----------------------------------------------------------------------------
# Custom CSS – header layout (logo right, title left) + logo size
# Stored as custom_css post in the DB (survives theme updates).
# post_name must match the active theme slug (morenews).
# Idempotent: creates the post on first run, updates on subsequent runs.
# -----------------------------------------------------------------------------
- name: WordPress | Set custom CSS (logo layout + size)
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - php
      - /usr/local/lib/wp-cli/wp-cli.phar
      - eval
      - |
        $css = '.custom-logo {
            max-width: 75px;
            height: auto;
            transform: scaleX(-1);
            filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.3));
            position: relative;
            z-index: 2;
        }

        /* Header: Logo rechts, Titel+Tagline links, auf gleicher Höhe */
        .site-branding {
            display: grid !important;
            grid-template-columns: 1fr auto !important;
            grid-template-rows: auto auto !important;
            align-items: center !important;
            gap: 0 20px !important;
        }
        .custom-logo-link {
            grid-column: 2 !important;
            grid-row: 1 / 3 !important;
            align-self: center !important;
            display: flex !important;
        }
        .site-title {
            grid-column: 1 !important;
            grid-row: 1 !important;
            margin: 0 !important;
        }
        .site-description {
            grid-column: 1 !important;
            grid-row: 2 !important;
            margin: 0 !important;
        }

        .af-middle-header {
            padding: 10px 0 !important;
            background: #202020 !important;
        }
        .site-title a, .site-title a:hover { color: #ffffff !important; }
        .site-description { color: #ffffff !important; }';
        $existing = wp_get_custom_css_post('morenews');
        if ($existing) {
            wp_update_post(['ID' => $existing->ID, 'post_content' => $css]);
            echo "updated\n";
        } else {
            $id = wp_insert_post(['post_type' => 'custom_css', 'post_status' => 'publish',
                'post_title' => 'Custom CSS', 'post_name' => 'morenews', 'post_content' => $css]);
            set_theme_mod('custom_css_post_id', $id);
            echo "created\n";
        }
      - --path=/var/www/html
      - --allow-root
  register: wp_custom_css
  changed_when: "'created' in wp_custom_css.stdout"


# -----------------------------------------------------------------------------
# Navigation menu – "Home | About | Imprint | Privacy Policy"
# Idempotent: creates the menu once and assigns it to aft-primary-nav.
# Survives theme updates (stored in DB, not theme files).
# -----------------------------------------------------------------------------
- name: WordPress | Set up primary navigation menu with Home link
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - php
      - /usr/local/lib/wp-cli/wp-cli.phar
      - eval
      - |
        // Check if menu already exists
        $existing = wp_get_nav_menu_object('Main Navigation');
        if ($existing) {
            // Ensure it is assigned to the correct location
            $locs = get_theme_mod('nav_menu_locations', []);
            $locs['aft-primary-nav'] = $existing->term_id;
            set_theme_mod('nav_menu_locations', $locs);
            echo "exists\n";
        } else {
            $menu_id = wp_create_nav_menu('Main Navigation');
            wp_update_nav_menu_item($menu_id, 0, [
                'menu-item-title'    => 'Home',
                'menu-item-url'      => home_url('/'),
                'menu-item-status'   => 'publish',
                'menu-item-type'     => 'custom',
                'menu-item-position' => 1,
            ]);
            foreach (get_pages(['sort_column' => 'menu_order']) as $i => $p) {
                wp_update_nav_menu_item($menu_id, 0, [
                    'menu-item-object-id' => $p->ID,
                    'menu-item-object'    => 'page',
                    'menu-item-type'      => 'post_type',
                    'menu-item-status'    => 'publish',
                    'menu-item-position'  => $i + 2,
                ]);
            }
            $locs = get_theme_mod('nav_menu_locations', []);
            $locs['aft-primary-nav'] = $menu_id;
            set_theme_mod('nav_menu_locations', $locs);
            echo "created\n";
        }
      - --path=/var/www/html
      - --allow-root
  register: wp_nav_menu
  changed_when: "'created' in wp_nav_menu.stdout"


# -----------------------------------------------------------------------------
# AI usage disclosure
# Discreet, site-wide transparency notice (footer link + dedicated page),
# per Art. 50 EU AI Act. Deliberately kept out of the primary nav menu.
# -----------------------------------------------------------------------------
- name: WordPress | Create or update AI Usage Notice page
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - php
      - /usr/local/lib/wp-cli/wp-cli.phar
      - eval
      - |
        $slug = 'ai-usage-notice';
        $content = '<p>Short version: yes, I use AI tools on this blog &ndash; for some of the writing, and for some of the images.</p>
        <h3>Text</h3>
        <p>Every post here comes from something I actually did &ndash; a real homelab project, a real Ansible run, a real troubleshooting session. AI tools (mainly <a href="https://www.anthropic.com/claude" target="_blank" rel="noopener">Claude</a>, sometimes ChatGPT) help me draft, structure, and edit the writing. I review, correct, and personally stand behind everything that gets published.</p>
        <h3>Images</h3>
        <p>Some images on this site are AI-generated or AI-edited &ndash; for example the comic-style portrait on the <a href="/about/">About</a> page, and some illustrative graphics created with tools like FLUX/ComfyUI. Screenshots, terminal output, dashboards, and API responses shown in posts are real and unedited unless a post says otherwise.</p>
        <p style="font-size:13px;color:#888;">This notice is provided for transparency, in line with Art. 50 of the EU AI Act on labelling AI-generated and AI-assisted content.</p>';
        $existing = get_page_by_path($slug);
        if ($existing) {
            wp_update_post(['ID' => $existing->ID, 'post_title' => 'AI Usage Notice', 'post_content' => $content]);
            echo "updated\n";
        } else {
            wp_insert_post(['post_type' => 'page', 'post_status' => 'publish',
                'post_title' => 'AI Usage Notice', 'post_name' => $slug, 'post_content' => $content]);
            echo "created\n";
        }
      - --path=/var/www/html
      - --allow-root
  register: wp_ai_notice_page
  changed_when: "'created' in wp_ai_notice_page.stdout or 'updated' in wp_ai_notice_page.stdout"

- name: WordPress | Link AI Usage Notice from the About page
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - php
      - /usr/local/lib/wp-cli/wp-cli.phar
      - eval
      - |
        $about = get_page_by_path('about');
        if ($about && strpos($about->post_content, 'ai-usage-notice') === false) {
            $note = '<p><small>Curious what on this blog is AI-assisted? See the <a href="/ai-usage-notice/">AI Usage Notice</a>.</small></p>';
            wp_update_post(['ID' => $about->ID, 'post_content' => $about->post_content . "\n" . $note]);
            echo "updated\n";
        } else {
            echo "unchanged\n";
        }
      - --path=/var/www/html
      - --allow-root
  register: wp_about_ai_link
  changed_when: "'updated' in wp_about_ai_link.stdout"

- name: WordPress | Deploy AI disclosure mu-plugin (discreet footer notice)
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - sh
      - -c
      - |
        cat > /var/www/html/wp-content/mu-plugins/ai-disclosure.php << 'PHPEOF'
        <?php
        /**
         * AI usage disclosure – managed by Ansible (blog_wordpress).
         * Adds a discreet, site-wide footer note linking to the AI Usage
         * Notice page, per Art. 50 EU AI Act transparency requirements.
         */
        add_action('wp_footer', function () {
            $page = get_page_by_path('ai-usage-notice');
            if (!$page) {
                return;
            }
            printf(
                '<div style="text-align:center;font-size:11px;color:#999;opacity:.8;padding:6px 0;">%s <a href="%s" style="color:inherit;text-decoration:underline;">%s</a></div>',
                esc_html__('Some text and images on this site are AI-assisted or AI-generated.'),
                esc_url(get_permalink($page)),
                esc_html__('Details')
            );
        });
        PHPEOF
        chown www-data:www-data /var/www/html/wp-content/mu-plugins/ai-disclosure.php
  changed_when: true


# -----------------------------------------------------------------------------
# Close public self-registration
# Personal blog, no membership feature relies on it – comments already
# require an existing login (comment_registration). Left open, it gets
# farmed by spam-registration bots (found and cleaned up 18 fake accounts,
# GSA-Search-Engine-Ranker-style throwaway addresses, on 2026-08-21).
# -----------------------------------------------------------------------------
- name: WordPress | Disable public user self-registration
  ansible.builtin.command: >
    k3s kubectl exec deployment/wordpress
    --namespace wordpress
    --container wordpress-fpm --
    php /usr/local/lib/wp-cli/wp-cli.phar option update users_can_register 0
    --path=/var/www/html
    --allow-root
  register: wp_disable_registration
  changed_when: "'Success: Value updated' in wp_disable_registration.stdout"


# -----------------------------------------------------------------------------
# Disable WP-Cron HTTP trigger
# The K8s CronJob (blog_k3s_deploy) runs wp-cron.php on a schedule instead.
# -----------------------------------------------------------------------------
- name: WordPress | Disable WP-Cron HTTP trigger (K8s CronJob handles scheduling)
  ansible.builtin.command: >
    k3s kubectl exec deployment/wordpress
    --namespace wordpress
    --container wordpress-fpm --
    php /usr/local/lib/wp-cli/wp-cli.phar config set DISABLE_WP_CRON true --raw
    --path=/var/www/html
    --allow-root
  changed_when: false


# -----------------------------------------------------------------------------
# Updates (Core + Plugins + Themes)
# Safe to run on every playbook execution – WP-CLI reports "Success: WordPress
# is at the latest version" when nothing needs updating, so these tasks are
# effectively idempotent from an application perspective.
# -----------------------------------------------------------------------------
- name: WordPress | Update core, plugins and themes
  block:
    - name: WordPress | Update core
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar core update
        --path=/var/www/html
        --allow-root
      register: wp_core_update
      changed_when: "'Success: WordPress updated' in wp_core_update.stdout"


    # -----------------------------------------------------------------------------
    # Remove unused plugins and themes
    # -----------------------------------------------------------------------------
    # Deactivated is not disabled: the files still sit under wp-content and are
    # reachable over HTTP, so a vulnerability in a bundled-but-unused plugin or
    # theme is still exploitable. Deleting them is the only thing that actually
    # removes the code path. Both lists are declared per host in host_vars.
    #
    # Placed after `core update` but before the update tasks below on purpose:
    # a core update can reinstall the bundled default themes, so the removal has
    # to run after it to have any effect – and running it before the update tasks
    # means nothing gets downloaded that is about to be deleted anyway.
    - name: WordPress | Remove unused plugins
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar plugin delete {{ item }}
        --path=/var/www/html
        --allow-root
      loop: "{{ blog_wordpress_remove_plugins | default([]) }}"
      register: wp_plugin_delete
      changed_when: "'Deleted' in wp_plugin_delete.stdout"
      # Already gone (deleted on an earlier run, or never installed) is the
      # steady state here, not an error – wp-cli exits 1 and warns either way.
      failed_when: >-
        wp_plugin_delete.rc != 0 and
        'could not be found' not in (wp_plugin_delete.stdout + wp_plugin_delete.stderr)

    # --status=inactive can never return the active theme, so the site's own theme
    # is structurally safe from this task – no name matching required. WordPress
    # still needs one default theme installed as a fallback: if the active theme
    # ever fatals, core switches to a bundled default, and with none present that
    # path ends in a white screen instead. blog_wordpress_keep_themes holds it.
    - name: WordPress | List inactive themes
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar theme list --status=inactive --field=name
        --path=/var/www/html
        --allow-root
      register: wp_inactive_themes
      changed_when: false

    - name: WordPress | Remove unused themes (keeping the fallback)
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar theme delete {{ item }}
        --path=/var/www/html
        --allow-root
      loop: >-
        {{ wp_inactive_themes.stdout_lines
           | map('trim') | select()
           | difference(blog_wordpress_keep_themes | default([])) | list }}
      register: wp_theme_delete
      changed_when: "'Deleted' in wp_theme_delete.stdout"


    - name: WordPress | Update all plugins
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar plugin update --all
        --path=/var/www/html
        --allow-root
      register: wp_plugin_update
      changed_when: "'Updated' in wp_plugin_update.stdout"
      # wp-cli's `plugin update --all` exits 1 with "No plugins updated" when
      # every plugin is already at the latest version -- not a real failure,
      # just nothing to do (routinely the case now that the install task above
      # uses --force and already fetches the latest version).
      failed_when: >-
        wp_plugin_update.rc != 0 and
        'No plugins updated' not in wp_plugin_update.stderr

    # Themes were previously never updated by this role – only core and plugins
    # were. An out-of-date theme is the same class of exposure as an out-of-date
    # plugin: its PHP runs on every request. Same exit-1-when-nothing-to-do
    # handling as the plugin task above.
    - name: WordPress | Update all themes
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar theme update --all
        --path=/var/www/html
        --allow-root
      register: wp_theme_update
      changed_when: "'Updated' in wp_theme_update.stdout"
      failed_when: >-
        wp_theme_update.rc != 0 and
        'No themes updated' not in wp_theme_update.stderr

    # Translation strings (core, plugin, theme .mo files) get refreshed by
    # WordPress.org translators independently of version bumps - a plugin
    # can stay on the same version for months while its German/French/etc.
    # strings still improve. Unlike plugin/theme update --all, these exit 0
    # whether or not anything needed updating ("Success: Translations are up
    # to date."), so no special failed_when handling is needed here.
    # There is no single unified `wp language update` - verified live
    # 2026-08-26 ("'update' is not a registered subcommand of 'language'"),
    # it's three separate per-type subcommands.
    - name: WordPress | Update installed translations (core, plugins, themes)
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar language {{ item }}
        --path=/var/www/html
        --allow-root
      loop:
        - "core update"
        - "plugin update --all"
        - "theme update --all"
      register: wp_language_update
      changed_when: "'Success: Updated' in wp_language_update.stdout"

  always:
    # Same reasoning as the plugin block above: wp-cli writes updated
    # files as root:root, so the chown has to happen even when one of the
    # update tasks fails, or PHP-FPM is left unable to write to wp-content.
    - name: WordPress | Fix wp-content ownership after updates
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        chown -R www-data:www-data /var/www/html/wp-content
      changed_when: false


# -----------------------------------------------------------------------------
# Restart the pod when core, plugins or themes actually changed
# -----------------------------------------------------------------------------
# PHP runs with opcache.validate_timestamps=0 (see the php-config ConfigMap in
# blog_k3s_deploy): file mtimes are never re-checked, so bytecode already in
# the shared OPcache segment stays live for the lifetime of the pod. The two
# update tasks above write new .php files to the volume, but PHP-FPM keeps
# executing the old code — including for security releases, which is exactly
# the failure mode where it hurts. Recycling workers via pm.max_requests does
# not help: the OPcache segment is shared across the pool, not per worker.
#
# Only fires when an update really happened, so an unchanged run stays a no-op
# and does not cause needless downtime.
- name: WordPress | Restart pod so PHP-FPM picks up updated code
  ansible.builtin.command: >
    k3s kubectl rollout restart deployment/wordpress
    --namespace wordpress
  when: wp_core_update.changed or wp_plugin_update.changed or wp_theme_update.changed
  changed_when: true

- name: WordPress | Wait for the restarted pod to become ready
  ansible.builtin.command: >
    k3s kubectl rollout status deployment/wordpress
    --namespace wordpress
    --timeout=300s
  when: wp_core_update.changed or wp_plugin_update.changed or wp_theme_update.changed
  changed_when: false

---
# -----------------------------------------------------------------------------
# Custom CSS – header layout (logo right, title left) + logo size
# Stored as custom_css post in the DB (survives theme updates).
# post_name must match the active theme slug (morenews).
# Idempotent: creates the post on first run, updates on subsequent runs.
# -----------------------------------------------------------------------------
#
# Both tasks run a small PHP snippet through "wp eval" (PHP code executed
# inside WordPress). The CSS task writes the CSS on EVERY run and prints
# "updated" (or "created" the first time); the menu task creates the menu
# once and prints "exists" afterwards. changed_when only counts "created" -
# so an edited CSS block below is written, but the recap shows it as "ok".

- name: WordPress | Set custom CSS (logo layout + size)
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - php
      - /usr/local/lib/wp-cli/wp-cli.phar
      - eval
      - |
        $css = '.custom-logo {
            max-width: 75px;
            height: auto;
            transform: scaleX(-1);
            filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.3));
            position: relative;
            z-index: 2;
        }

        /* Header: Logo rechts, Titel+Tagline links, auf gleicher Höhe */
        .site-branding {
            display: grid !important;
            grid-template-columns: 1fr auto !important;
            grid-template-rows: auto auto !important;
            align-items: center !important;
            gap: 0 20px !important;
        }
        .custom-logo-link {
            grid-column: 2 !important;
            grid-row: 1 / 3 !important;
            align-self: center !important;
            display: flex !important;
        }
        .site-title {
            grid-column: 1 !important;
            grid-row: 1 !important;
            margin: 0 !important;
        }
        .site-description {
            grid-column: 1 !important;
            grid-row: 2 !important;
            margin: 0 !important;
        }

        .af-middle-header {
            padding: 10px 0 !important;
            background: #202020 !important;
        }
        .site-title a, .site-title a:hover { color: #ffffff !important; }
        .site-description { color: #ffffff !important; }

        /* Dark Mode: Inhaltsverzeichnis (Easy Table of Contents) bringt eine
           feste helle Box mit (#f9f9f9) - im Dark Mode war sie hell und der
           Titel weiss auf weiss. Dunkelgrau, etwas heller als der Inhalt. */
        body.aft-dark-mode #ez-toc-container {
            background: #2b2b2b !important;
            border-color: #444444 !important;
            box-shadow: none !important;
        }
        body.aft-dark-mode #ez-toc-container .ez-toc-title { color: #eeeeee !important; }
        body.aft-dark-mode #ez-toc-container a,
        body.aft-dark-mode #ez-toc-container a:visited,
        body.aft-dark-mode #ez-toc-container li { color: #d0d0d0 !important; }
        body.aft-dark-mode #ez-toc-container a:hover { color: #6ea8ff !important; }
        body.aft-dark-mode #ez-toc-container .ez-toc-btn,
        body.aft-dark-mode #ez-toc-container .ez-toc-js-icon-con {
            background: transparent !important;
            border-color: #555555 !important;
        }
        body.aft-dark-mode #ez-toc-container .ez-toc-icon-toggle-span svg,
        body.aft-dark-mode #ez-toc-container .ez-toc-js-icon-con svg { color: #d0d0d0 !important; fill: #d0d0d0 !important; }

        /* Smartphone + Tablet (bis 1024px, dort stapelt das Theme alles
           untereinander): Startseite zeigt nur die letzten Beiträge
           (posts_per_page = 5) mit Seitennavigation, Suche und Kategorien.
           Ausgeblendet: Laufband "Latest Posts", Banner (Main News,
           Latest/Popular/Update, Trending Now), "Featured Posts", "You may have
           missed" und die Sidebar-Blöcke "Recent Posts" + "Archive" - sonst
           kommen vor und nach den Artikeln mehrere Bildschirmlängen
           Wiederholungen. Die Sidebar-Blöcke werden über ihren Inhalt
           (Block-Typ) gefunden, nicht über die wechselnde Widget-ID. */
        @media screen and (max-width: 1024px) {
            body.home .banner-exclusive-posts-wrapper,
            body.home .aft-main-banner-section,
            body.home .af-main-banner-featured-posts,
            body.home .above-footer-widget-section,
            body.home #secondary .widget:has(.wp-block-latest-posts),
            body.home #secondary .widget:has(.wp-block-archives-list) { display: none !important; }
        }';
        $existing = wp_get_custom_css_post('morenews');
        if ($existing) {
            wp_update_post(['ID' => $existing->ID, 'post_content' => $css]);
            echo "updated\n";
        } else {
            $id = wp_insert_post(['post_type' => 'custom_css', 'post_status' => 'publish',
                'post_title' => 'Custom CSS', 'post_name' => 'morenews', 'post_content' => $css]);
            set_theme_mod('custom_css_post_id', $id);
            echo "created\n";
        }
      - --path=/var/www/html
      - --allow-root
  register: wp_custom_css
  changed_when: "'created' in wp_custom_css.stdout"


# -----------------------------------------------------------------------------
# Navigation menu – "Home | About | Imprint | Privacy Policy"
# Idempotent: creates the menu once and assigns it to aft-primary-nav.
# Survives theme updates (stored in DB, not theme files).
# -----------------------------------------------------------------------------
- name: WordPress | Set up primary navigation menu with Home link
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/wordpress
      - --namespace
      - wordpress
      - --container
      - wordpress-fpm
      - --
      - php
      - /usr/local/lib/wp-cli/wp-cli.phar
      - eval
      - |
        // Check if menu already exists
        $existing = wp_get_nav_menu_object('Main Navigation');
        if ($existing) {
            // Ensure it is assigned to the correct location
            $locs = get_theme_mod('nav_menu_locations', []);
            $locs['aft-primary-nav'] = $existing->term_id;
            set_theme_mod('nav_menu_locations', $locs);
            echo "exists\n";
        } else {
            $menu_id = wp_create_nav_menu('Main Navigation');
            wp_update_nav_menu_item($menu_id, 0, [
                'menu-item-title'    => 'Home',
                'menu-item-url'      => home_url('/'),
                'menu-item-status'   => 'publish',
                'menu-item-type'     => 'custom',
                'menu-item-position' => 1,
            ]);
            foreach (get_pages(['sort_column' => 'menu_order']) as $i => $p) {
                wp_update_nav_menu_item($menu_id, 0, [
                    'menu-item-object-id' => $p->ID,
                    'menu-item-object'    => 'page',
                    'menu-item-type'      => 'post_type',
                    'menu-item-status'    => 'publish',
                    'menu-item-position'  => $i + 2,
                ]);
            }
            $locs = get_theme_mod('nav_menu_locations', []);
            $locs['aft-primary-nav'] = $menu_id;
            set_theme_mod('nav_menu_locations', $locs);
            echo "created\n";
        }
      - --path=/var/www/html
      - --allow-root
  register: wp_nav_menu
  changed_when: "'created' in wp_nav_menu.stdout"

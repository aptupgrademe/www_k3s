---
# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
# The install tasks and the ownership fix are one block/always unit on purpose.
# WP-CLI runs with --allow-root and therefore writes every plugin file as
# root:root; PHP-FPM runs as www-data (uid 33) and cannot write into a
# root-owned plugin directory afterwards. If an install fails halfway, the
# files it already unpacked stay root-owned, and without the `always` the play
# would abort before the chown ever runs – leaving the site with plugins it
# cannot write to. That is not hypothetical: on 2026-08-16 a wordpress.org
# download timed out (cURL error 28 after 10 s) on the compressx item, the play
# stopped there, and all-in-one-wp-migration was left unable to create its
# storage/ directory until the chown was run by hand.
# Version snapshot before anything installs or updates code. Compared with
# the one after the update block, it decides the PHP-FPM restart at the end:
# Until 2026-10-13 "plugin install --force" re-downloaded every plugin on each
# run (and reported each one as changed); it could pull a NEWER release without
# saying so, so before 2026-10-05 newer plugin code sat on disk while OPcache
# kept running the old one. Install now only fetches plugins that are missing;
# new releases come exclusively from "Update all plugins" (updates.yml).
#
# Ansible concepts used here:
#   block + always  the tasks in "always:" run even when a task in the
#                   block fails - here the chown that must never be skipped
#   until/retries   retry a single loop item (a flaky download), see the
#                   comment at the install task
#   difference      list minus list: wanted plugins minus installed ones
#   selectattr('name', 'in', list)  keep the entries whose name is in a list

- name: WordPress | Snapshot core/plugin/theme versions (before)
  ansible.builtin.shell: |
    set -e
    for what in "core version" "plugin list --fields=name,version --format=csv" "theme list --fields=name,version --format=csv"; do
      k3s kubectl exec deployment/wordpress --namespace wordpress --container wordpress-fpm -- \
        su -s /bin/sh www-data -c "php /usr/local/lib/wp-cli/wp-cli.phar --path=/var/www/html $what"
    done
  register: wp_versions_before
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: WordPress | Install plugins and fix ownership
  block:
    # One read decides what to do: install only plugins that are missing,
    # activate only those that are installed but inactive. The old
    # "plugin install --activate --force" for every plugin re-downloaded and
    # rewrote all of them on each run and reported every one as "changed".
    - name: WordPress | Read installed plugins and their status
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        su -s /bin/sh www-data -c
        "php /usr/local/lib/wp-cli/wp-cli.phar --path=/var/www/html plugin list --fields=name,status --format=json"
      register: wp_plugin_state
      changed_when: false
      check_mode: false   # read-only query, also runs in --check

    # `until` retries per loop item, so one flaky download no longer takes the
    # whole run with it. wp-cli's HTTP timeout is a hard-coded 10 s and cannot
    # be raised from the command line, so retrying is the only lever here.
    - name: WordPress | Install and activate missing plugins
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar plugin install {{ item }} --activate
        --path=/var/www/html
        --allow-root
      loop: "{{ blog_wordpress_plugins | default([]) | difference(_wp_plugins_installed) }}"
      register: wp_plugin_result
      until: wp_plugin_result.rc == 0
      retries: 3
      delay: 10
      changed_when: true   # only runs for plugins that were not installed
      vars:
        _wp_plugins_installed: "{{ wp_plugin_state.stdout | from_json | map(attribute='name') | list }}"

    - name: WordPress | Activate installed but inactive plugins
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar plugin activate {{ _wp_plugins_inactive | join(' ') }}
        --path=/var/www/html
        --allow-root
      when: _wp_plugins_inactive | length > 0
      changed_when: true   # only runs when something was inactive
      vars:
        _wp_plugins_inactive: >-
          {{ wp_plugin_state.stdout | from_json
             | selectattr('name', 'in', blog_wordpress_plugins | default([]))
             | selectattr('status', 'equalto', 'inactive')
             | map(attribute='name') | list }}

    # Redis Object Cache plugin – installed and enabled separately because
    # wp redis enable places the object-cache.php drop-in (separate WP-CLI command).
    - name: WordPress | Install and activate Redis Object Cache plugin
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar plugin install redis-cache --activate
        --path=/var/www/html
        --allow-root
      register: wp_redis_install
      until: wp_redis_install.rc == 0
      retries: 3
      delay: 10
      # wp-cli prints "Activating 'redis-cache'..." even when the plugin is
      # already active (followed by "already active" on stderr), so only a run
      # that did NOT find it installed AND active is a change (found 2026-10-13).
      changed_when: >-
        not ('already installed' in (wp_redis_install.stdout ~ wp_redis_install.stderr) and
             'already active' in (wp_redis_install.stdout ~ wp_redis_install.stderr))

    - name: WordPress | Enable Redis object-cache drop-in
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        php /usr/local/lib/wp-cli/wp-cli.phar redis enable
        --path=/var/www/html
        --allow-root
      register: wp_redis_enable
      changed_when: "'Success' in wp_redis_enable.stdout"
      failed_when: false

  always:
    # Runs even when an install above failed – see the block comment.
    - name: WordPress | Fix wp-content ownership after plugin installation
      ansible.builtin.command: >
        k3s kubectl exec deployment/wordpress
        --namespace wordpress
        --container wordpress-fpm --
        chown -R www-data:www-data /var/www/html/wp-content
      changed_when: false

---
# OPcache re-checks a cached script against its file at most once a minute
# (validate_timestamps=1, revalidate_freq=60 since 2026-10-05; before that it
# never did, and an updated breadcrumb-fix.php mu-plugin kept running its old
# version through several cache-clears - found 2026-08-26). A restart makes a
# changed PHP file take effect immediately and in one go, instead of
# file by file within the next minute, so tasks that write PHP files still
# notify this handler.
#
# The only handler of blog_wordpress. Several tasks notify it by its full
# name; it runs at most once, at the end of the play. changed_when: true
# because a rollout restart always changes the running pod.

- name: Restart wordpress deployment (OPcache picks up changed PHP files)
  ansible.builtin.command: k3s kubectl rollout restart deployment/wordpress -n wordpress
  changed_when: true

---
# =============================================================================
# Role: common_k3s
# Purpose: Install K3s single-node cluster, Helm, cert-manager (Let's Encrypt)
#          and F5 nginx-ingress on AlmaLinux 9.
#          Shared by both the nextcloud-k3s and blog playbooks.
# Target:  AlmaLinux 9 (SELinux enforcing)
# =============================================================================
#
# How it works: six task files, in this order (each needs the previous):
#   install_k3s.yml           config, binary (pinned k3s_version), installer,
#                             service, API ready, kubeconfig for root
#   install_helm.yml          Helm binary (pinned helm_version)
#   cert_manager.yml          cert-manager chart + Let's Encrypt ClusterIssuer
#   nginx_ingress.yml         default TLS cert + F5 nginx-ingress chart
#   default_sa_hardening.yml  CIS 5.1.5 on the namespaces that exist now
#   coredns_custom.yml        empty coredns-custom ConfigMap (no import-glob warnings)
# From here on, the other roles talk to Kubernetes through the
# kubernetes.core modules (k8s, k8s_info, helm), using the kubeconfig at
# k3s_kubeconfig - the K8s apply pattern is explained below.

# THE K8S APPLY PATTERN - used by 26 tasks in this repo, explained once here:
#
#   - name: ... | Apply <something>
#     kubernetes.core.k8s:
#       kubeconfig: "{{ k3s_kubeconfig }}"
#       state: present
#       apply: true
#       definition: "{{ item }}"
#     loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
#     vars:
#       k8s_objects: "{{ lookup('ansible.builtin.template', 'x.yml.j2')
#                        | ansible.builtin.from_yaml_all | select | list }}"
#
# Read it from the inside out:
#   lookup('template', ...)  renders the Jinja template ON THE CONTROLLER
#                  into a string (no file is copied to the server)
#   from_yaml_all  parses a multi-document YAML string ("---" separated)
#                  into a list of objects (dicts)
#   select         drops empty documents (e.g. a trailing "---")
#   kubernetes.core.k8s  talks to the Kubernetes API directly - no kubectl,
#                  no temp file. state: present + apply: true behaves like
#                  "kubectl apply": it creates missing objects, updates
#                  changed ones, and reports "changed" ONLY when the live
#                  object really differs (idempotent).
#   loop ... if ansible_diff_mode  with --diff the loop runs once per
#                  object, so the diff shows each object separately;
#                  otherwise one loop item holds the whole list -> a single
#                  module call for all objects (faster).
#   loop_control.label  shows "Kind/name" per item, or "N objects".
# "vars:" on a task defines variables for that task only.
#
# Waiting afterwards: "kubectl rollout status" blocks until a DaemonSet or
# Deployment runs its new pods; it only runs "when: <register>.changed", so
# an unchanged run does not wait at all (e.g. common_kube_metrics).

- name: common_k3s | K3s install/upgrade
  ansible.builtin.import_tasks: install_k3s.yml
- name: common_k3s | Helm install/upgrade
  ansible.builtin.import_tasks: install_helm.yml
- name: common_k3s | cert-manager + Let's Encrypt ClusterIssuer
  ansible.builtin.import_tasks: cert_manager.yml
- name: common_k3s | F5 nginx-ingress controller
  ansible.builtin.import_tasks: nginx_ingress.yml
- name: common_k3s | Default ServiceAccount hardening (CIS 5.1.5)
  ansible.builtin.import_tasks: default_sa_hardening.yml
- name: common_k3s | CoreDNS custom imports
  ansible.builtin.import_tasks: coredns_custom.yml

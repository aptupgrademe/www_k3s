---
# =============================================================================
# CIS 5.1.5: disable SA token automount on every namespace's "default"
# ServiceAccount. K3s itself exempts kube-system (coredns, metrics-server,
# local-path-provisioner etc. need it) - kube-bench's own check does the
# same. Covers namespaces that exist by the end of this role (default,
# kube-public, kube-node-lease, cert-manager, ingress-nginx); the wordpress/
# nextcloud namespaces get the identical patch in their own
# namespace_secrets.yml, since they don't exist yet at this point in a
# fresh install.
# =============================================================================
#
# Ansible concepts used here:
#   kubernetes.core.k8s_info  READ objects from the API (like "kubectl get"),
#                  never changes anything; field_selectors filters server-side
#   k8s with a partial definition  only the fields given are applied
#                  (automountServiceAccountToken: false); the rest of the
#                  ServiceAccount stays as it is

- name: K3s | Find non-kube-system default ServiceAccounts (CIS 5.1.5)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig }}"
    kind: ServiceAccount
    field_selectors:
      - metadata.name=default
  register: k3s_default_sas

- name: K3s | Disable SA token automount on every non-kube-system default ServiceAccount (CIS 5.1.5)
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: "{{ item }}"
      automountServiceAccountToken: false
  loop: >-
    {{ k3s_default_sas.resources | map(attribute='metadata.namespace')
       | reject('equalto', 'kube-system') | list }}

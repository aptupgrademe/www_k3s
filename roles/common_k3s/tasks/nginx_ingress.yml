---
# =============================================================================
# nginx-ingress – F5 NGINX Ingress Controller inside K3s
# =============================================================================
# Runs as a DaemonSet with hostNetwork=true so it binds directly to the host's
# ports 80 and 443.  Replaces the retired kubernetes/ingress-nginx controller.
#
# Chart: nginx-stable/nginx-ingress (https://helm.nginx.com/stable)
# Maintained by F5/NGINX – the same team that maintains nginx itself.
#
# Rate-limit zones (nc_login, wp_login) are defined in the Helm values via
# controller.config.entries.http-snippets so Ingress server-snippets
# annotations can reference them.
# =============================================================================

- name: ingress-nginx | Ensure ingress-nginx namespace exists
  # Needed before the default-TLS secret below; the Helm install further down
  # also has create_namespace, but that only fires as a side effect of the
  # helm call itself, too late for this task if it ran first.
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    kind: Namespace
    name: ingress-nginx

# -----------------------------------------------------------------------------
# Default TLS fallback certificate
# -----------------------------------------------------------------------------
# Without controller.defaultTLS.secret set, this controller (F5 nginx-ingress,
# unlike the community kubernetes/ingress-nginx project) has no fallback for a
# hostname it can't match to a ready certificate: it responds to the TLS
# handshake with "unrecognized name" and closes the connection outright - no
# certificate at all, not even a self-signed one, so it's indistinguishable
# from nothing listening (found live 2026-09-11 while a DNS misconfiguration
# was blocking a real cert from issuing: same symptom either way, no way to
# tell "wrong DNS" from "server down" from the browser). A generic self-signed
# cert as the default fixes that failure mode for any host/reason, permanently:
# browsers get an expected self-signed warning instead of a bare connection
# failure, and any host with its own real, ready certificate is unaffected -
# nginx picks the SNI-matched one over this default automatically.
# -----------------------------------------------------------------------------
- name: ingress-nginx | Ensure directory for the default TLS cert/key exists
  ansible.builtin.file:
    path: /etc/ingress-nginx-defaults
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: ingress-nginx | Generate self-signed default TLS certificate (one-time)
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048 -days 3650
    -keyout /etc/ingress-nginx-defaults/tls.key
    -out /etc/ingress-nginx-defaults/tls.crt
    -subj "/CN=ingress-nginx-fallback"
  args:
    creates: /etc/ingress-nginx-defaults/tls.crt

# Read back from the host (the key never leaves it in a temp file) and handed
# to the API as a kubernetes.io/tls Secret. slurp returns base64 already,
# which is exactly what Secret .data expects.
- name: ingress-nginx | Read default TLS certificate and key
  ansible.builtin.slurp:
    src: "/etc/ingress-nginx-defaults/{{ item }}"
  loop: [tls.crt, tls.key]
  register: ingress_default_tls
  no_log: true

- name: ingress-nginx | Apply default TLS certificate as a K8s Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/tls
      metadata:
        name: ingress-default-tls
        namespace: ingress-nginx
      data:
        tls.crt: "{{ ingress_default_tls.results[0].content }}"
        tls.key: "{{ ingress_default_tls.results[1].content }}"
  no_log: true

- name: ingress-nginx | Remove old kubernetes/ingress-nginx release if present
  # The old community chart (kubernetes/ingress-nginx) was retired in 2026.
  # Detect it by chart name prefix "ingress-nginx-" and uninstall before
  # installing the F5 replacement, so Helm does not try to upgrade across
  # incompatible chart schemas.
  ansible.builtin.shell: |
    set -o pipefail
    CHART=$(helm list -n ingress-nginx -o json 2>/dev/null \
      | python3 -c "import json,sys; r=json.load(sys.stdin); \
        [print(x['chart']) for x in r if x['name']=='ingress-nginx']" 2>/dev/null || true)
    if echo "$CHART" | grep -q '^ingress-nginx-'; then
      helm uninstall ingress-nginx --namespace ingress-nginx
      echo "uninstalled"
    else
      echo "skipped"
    fi
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: old_uninstall
  changed_when: "'uninstalled' in old_uninstall.stdout"

- name: ingress-nginx | Add nginx-stable Helm repository
  kubernetes.core.helm_repository:
    name: nginx-stable
    repo_url: https://helm.nginx.com/stable

# Only upgrades when chart version or values differ from the deployed release
# (see cert_manager.yml) - the old "helm upgrade --install" was "changed" on
# every run. Values are rendered in memory, no temp file on the host.
- name: ingress-nginx | Install/upgrade nginx-ingress via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ k3s_kubeconfig }}"
    name: ingress-nginx
    chart_ref: nginx-stable/nginx-ingress
    chart_version: "{{ ingress_nginx_chart_version }}"
    release_namespace: ingress-nginx
    create_namespace: true
    update_repo_cache: true
    values: "{{ lookup('ansible.builtin.template', 'ingress-nginx-values.yml.j2') | ansible.builtin.from_yaml }}"
    wait: true
    timeout: 300s

- name: ingress-nginx | Wait for nginx-ingress DaemonSet pod to be ready
  ansible.builtin.command: >
    k3s kubectl wait pod
    --selector app.kubernetes.io/name=nginx-ingress
    --namespace ingress-nginx
    --for=condition=ready
    --timeout=120s
  changed_when: false

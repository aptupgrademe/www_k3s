---
# =============================================================================
# cert-manager – Let's Encrypt TLS certificates inside K3s
# =============================================================================
# cert-manager automates certificate issuance and renewal via the ACME
# protocol. It replaces certbot (which ran on the host). The HTTP-01
# challenge is answered by F5 nginx-ingress (port 80 on the host).
# =============================================================================
#
# Ansible concepts used here:
#   kubernetes.core.helm_repository  "helm repo add" as a module - idempotent
#   kubernetes.core.helm  installs/upgrades a release; compares chart version
#                  and values with the deployed release and does nothing if
#                  both match (no new Helm revision on an unchanged run)
#   waiting for a CRD  the ClusterIssuer kind only exists after cert-manager
#                  registered its CustomResourceDefinitions - applying it
#                  earlier fails with "no matches for kind"

- name: cert-manager | Add Jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

# kubernetes.core.helm compares the deployed release (chart version + values)
# with what is requested here and only upgrades on a difference - the former
# "helm upgrade --install" ran on every play, reported "changed" every time
# and stacked up a new Helm revision per run. update_repo_cache replaces the
# separate "helm repo update" step (needed to see a newly pinned version).
- name: cert-manager | Install/upgrade cert-manager via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ k3s_kubeconfig }}"
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: cert-manager
    create_namespace: true
    update_repo_cache: true
    values:
      crds:
        enabled: true
    wait: true
    timeout: 300s

- name: cert-manager | Wait for cert-manager webhook deployment to be ready
  ansible.builtin.command: >
    k3s kubectl wait deployment/cert-manager-webhook
    --namespace cert-manager
    --for=condition=available
    --timeout=300s
  changed_when: false

# -----------------------------------------------------------------------------
# ClusterIssuer – Let's Encrypt production endpoint
# -----------------------------------------------------------------------------
- name: cert-manager | Wait for ClusterIssuer CRD to be established
  ansible.builtin.command: >
    k3s kubectl wait --for=condition=established --timeout=120s
    crd/clusterissuers.cert-manager.io
  changed_when: false
  check_mode: false   # read-only wait, safe (and needed) in --check runs too

- name: cert-manager | Apply Let's Encrypt ClusterIssuer
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (a template can hold dozens), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'clusterissuer.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: ci_apply

---
# =============================================================================
# Helm installation
# =============================================================================
# Helm is the Kubernetes package manager. We use it to install cert-manager
# and F5 nginx-ingress from their official Helm charts.
#
# Installed from the official release tarball (get.helm.sh) rather than a
# get-helm-<major> shell script, so upgrades are a simple version-pin bump –
# same pattern as k3s_version in install_k3s.yml. No Kubernetes-facing service
# to restart here (Helm is just a CLI), so no handler/flush needed.
# =============================================================================
#
# Same "pinned binary" pattern as the K3s binary and the exporters: check
# the installed version, download the release tarball only when it differs,
# unpack, copy into /usr/local/bin. Extract/install are skipped in --check
# (nothing was downloaded there). The last task adds "export KUBECONFIG=..."
# to /root/.bashrc, so helm finds the K3s cluster in an interactive root shell
# and in the shell tasks of this repo that call helm directly.

- name: Helm | Check if helm binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

# Strip the +g<hash> build suffix (e.g. "v3.20.1+ga2369ca") so this compares
# equal to the clean helm_version pin (e.g. "v4.2.3").
- name: Helm | Check installed helm version
  ansible.builtin.shell: |
    set -o pipefail
    helm version --short 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1
  register: helm_installed_version
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Helm | Download release tarball (install or upgrade to {{ helm_version }})
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp/helm.tar.gz
    mode: "0644"
  when: not helm_binary.stat.exists or (helm_installed_version.stdout | trim) != helm_version
  register: helm_download

- name: Helm | Extract release tarball
  ansible.builtin.unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp
    remote_src: true
  when:
    - helm_download.changed | default(false)
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack

- name: Helm | Install/upgrade binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    owner: root
    group: root
    remote_src: true
  when:
    - helm_download.changed | default(false)
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack

- name: Helm | Clean up download/extraction artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/helm.tar.gz
    - /tmp/linux-amd64
  when: helm_download.changed | default(false)

# -----------------------------------------------------------------------------
# helm-diff plugin (helm_diff_version / helm_diff_sha256 in versions.yml)
# -----------------------------------------------------------------------------
# Lets kubernetes.core.helm compute a real diff of a release instead of only
# comparing chart version and values (and silences its "Install helm diff"
# warning). Same pinned-binary pattern as Helm itself: read the installed
# version, download only when it differs - with a checksum - and unpack the
# archive into Helm's plugin directory. The archive ships bin/diff, so the
# plugin's own install hook (which would download it again) is not needed.
- name: Helm | Installed helm-diff plugin version
  ansible.builtin.command: helm plugin list
  register: helm_plugins
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Helm | Install/upgrade the helm-diff plugin ({{ helm_diff_version }})
  # "helm plugin list" prints "NAME VERSION TYPE ..." per line; take the
  # VERSION of the line whose NAME is diff ('' when not installed).
  when: >-
    (helm_plugins.stdout_lines | default([]) | map('split')
     | selectattr('0', 'equalto', 'diff') | map(attribute='1') | first | default('')) != helm_diff_version
  block:
    - name: Helm | Download the helm-diff release archive (checksum-verified)
      ansible.builtin.get_url:
        url: "https://github.com/databus23/helm-diff/releases/download/v{{ helm_diff_version }}/diff-{{ helm_diff_version }}-linux-amd64.tgz"
        dest: /tmp/helm-diff.tgz
        checksum: "sha256:{{ helm_diff_sha256 }}"
        mode: "0644"

    - name: Helm | Remove an older helm-diff plugin directory
      ansible.builtin.file:
        path: /root/.local/share/helm/plugins/diff
        state: absent
      when: not ansible_check_mode

    - name: Helm | Ensure the Helm plugin directory exists
      ansible.builtin.file:
        path: /root/.local/share/helm/plugins
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Helm | Unpack the helm-diff plugin
      ansible.builtin.unarchive:
        src: /tmp/helm-diff.tgz
        dest: /root/.local/share/helm/plugins
        remote_src: true
        owner: root
        group: root
      when: not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack

    - name: Helm | Clean up the helm-diff archive
      ansible.builtin.file:
        path: /tmp/helm-diff.tgz
        state: absent

- name: Helm | Set KUBECONFIG for Helm commands (K3s writes here)
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml'
    regexp: '^export KUBECONFIG='

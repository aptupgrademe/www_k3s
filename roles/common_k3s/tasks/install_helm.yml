---
# =============================================================================
# Helm installation
# =============================================================================
# Helm is the Kubernetes package manager. We use it to install cert-manager
# and F5 nginx-ingress from their official Helm charts.
# =============================================================================

- name: Helm | Check if helm binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: Helm | Download Helm installer script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: "0755"
  when: not helm_binary.stat.exists

- name: Helm | Install Helm
  ansible.builtin.command: /tmp/get-helm-3.sh
  environment:
    HELM_INSTALL_DIR: /usr/local/bin
    USE_SUDO: "false"
  when: not helm_binary.stat.exists
  changed_when: true

- name: Helm | Remove installer script
  ansible.builtin.file:
    path: /tmp/get-helm-3.sh
    state: absent

- name: Helm | Set KUBECONFIG for Helm commands (K3s writes here)
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml'
    regexp: '^export KUBECONFIG='

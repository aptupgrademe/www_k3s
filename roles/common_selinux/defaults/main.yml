---
# Which stack's HostPath directories to prepare - set by the playbook
# (blog.yml: wordpress, nextcloud-k3s.yml: nextcloud).
selinux_target: ""

# Set selinux_debug: true in host_vars to show the SELinux contexts of the
# directories at the end of the role.
selinux_debug: false

# HostPath directories per stack. Owner/mode MUST match the dirs.yml of the
# stack's deploy role (blog_k3s_deploy / next_k3s_deploy), otherwise the two
# roles flip them on every playbook run: with root:root the www dir was briefly
# root-owned (2026-08-26, TranslatePress "Permission denied" on the blog) and
# www-data could not write to the top of the Nextcloud data dir (2026-09-23 on
# cvjm, status.php errored).
selinux_profiles:
  wordpress:
    - { label: WordPress www dir, path: "{{ blog_k3s_www_dir | default('') }}", owner: 33, group: 33, mode: "0755" }
    # 999 = mysql user inside the mariadb container
    - { label: MariaDB data dir, path: "{{ blog_k3s_db_dir | default('') }}", owner: 999, group: 999, mode: "0750" }
  nextcloud:
    - { label: Nextcloud www dir, path: "{{ nextcloud_k3s_www_dir | default('') }}", owner: 33, group: 33, mode: "0755" }
    - { label: Nextcloud data dir, path: "{{ nextcloud_data_dir | default('') }}", owner: 33, group: 33, mode: "0770" }

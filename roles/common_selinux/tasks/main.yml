---
# =============================================================================
# Role: common_selinux
# Purpose: SELinux enforcing mode + file contexts for the K3s HostPath volumes
#          of one stack (play variable stack: wordpress | nextcloud). In K3s mode
#          nginx and PHP-FPM run inside containers, so no httpd_* types are
#          needed; instead the HostPath directories must carry
#          container_file_t so containerd can read and write them while
#          SELinux is enforcing.
#          Replaces the former blog_selinux and next_selinux roles, which were
#          identical apart from the directories now in selinux_profiles.
# Target:  AlmaLinux 9
# =============================================================================
#
# How it works: SELinux labels every file with a type; a confined process
# may only touch the types its policy allows. Containers run as
# container_t and may write files labelled container_file_t. The HostPath
# directories (host folders mounted into pods) are created by this role
# and labelled that way:
#   1. "semanage fcontext -a"  adds a RULE: "<path>(/.*)? = container_file_t"
#                              (stored in the policy, survives relabels)
#   2. "restorecon -R"         applies the rule to the existing files
# New files inside get the type automatically from the rule.
#
# Ansible concepts used here:
#   selinux_profiles[stack]  one role, two stacks: the playbook sets the
#                  play variable "stack", the dict picks that stack's dirs
#   read first, add only what is missing  "semanage fcontext -l -C" lists
#                  the local rules; the add task runs only "when" a rule is
#                  not in that list (see the comment at the task)
#   ansible.posix.selinux / seboolean  modules from the ansible.posix
#                  collection (requirements.yml), not from ansible.builtin

# -----------------------------------------------------------------------------
# Packages
# -----------------------------------------------------------------------------
- name: SELinux | Ensure SELinux tools are installed (semanage/restorecon)
  ansible.builtin.dnf:
    name:
      - policycoreutils
      - policycoreutils-python-utils
      - selinux-policy-targeted
      - container-selinux   # K3s container SELinux policy
    state: present

# ansible.posix, not ansible.builtin: the selinux module lives in the collection.
# "ansible.builtin.selinux" only works because ansible-core still redirects the
# old name, and that redirect will not last forever.
- name: SELinux | Ensure SELinux is enforcing (targeted policy)
  ansible.posix.selinux:
    policy: targeted
    state: enforcing


# -----------------------------------------------------------------------------
# HostPath volume directories (owner/mode: see defaults/main.yml)
# -----------------------------------------------------------------------------
- name: SELinux | Ensure the HostPath directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ selinux_profiles[stack] }}"
  loop_control:
    label: "{{ item.label }}"


# -----------------------------------------------------------------------------
# SELinux file contexts for K3s HostPath volumes
# -----------------------------------------------------------------------------
# container_file_t allows the container runtime (containerd) to read/write
# these directories while SELinux is enforcing.
# Read the local rules first, add only the missing ones. semanage 3.6 (EL 9.6+)
# no longer fails on an existing rule: it prints "already defined, modifying
# instead" to STDOUT and exits 0, so the old "already defined in stderr" check
# reported "changed" on every run (found 2026-10-13 on sofie).
- name: SELinux | Read the local file-context rules
  ansible.builtin.command: semanage fcontext -l -C
  register: semanage_fc_local
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: SELinux | Label the HostPath directories as container_file_t
  ansible.builtin.command: >
    semanage fcontext -a -t container_file_t "{{ item.path }}(/.*)?"
  loop: "{{ selinux_profiles[stack] }}"
  loop_control:
    label: "{{ item.label }}"
  when: >-
    (item.path ~ '(/.*)?') not in
    (semanage_fc_local.stdout_lines | select | map('split') | map('first') | list)
  changed_when: true   # only runs for a missing rule

- name: SELinux | Apply the SELinux context to the HostPath directories
  ansible.builtin.command: restorecon -Rv "{{ item.path }}"
  loop: "{{ selinux_profiles[stack] }}"
  loop_control:
    label: "{{ item.label }}"
  changed_when: false


# -----------------------------------------------------------------------------
# SELinux boolean container_manage_cgroup
# -----------------------------------------------------------------------------
# NOTE: this comment used to say "allow containers to make outbound network
# connections" - that is not what this boolean does. container_manage_cgroup
# lets container processes manage cgroups ("Allow container to manage
# cgroup" in semanage boolean -l). Outbound connections (pod -> host MariaDB/
# Redis, SMTP, WordPress HTTP calls) work without any boolean: checked
# 2026-10-13, container_connect_any is off and all of them work. Whether
# anything here still needs this boolean is open; it is left on as before.
- name: SELinux | Allow container processes to manage cgroups (container_manage_cgroup)
  ansible.posix.seboolean:
    name: container_manage_cgroup
    state: true
    persistent: true
  failed_when: false   # boolean may not exist on all policy versions


# -----------------------------------------------------------------------------
# Sanity check (only when selinux_debug is true)
# -----------------------------------------------------------------------------
- name: SELinux | Show SELinux contexts on the HostPath directories
  ansible.builtin.command: >
    ls -Zd {{ selinux_profiles[stack] | map(attribute='path') | join(' ') }}
  register: selinux_ctx
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  when: selinux_debug | bool

- name: SELinux | Print contexts
  ansible.builtin.debug:
    var: selinux_ctx.stdout_lines
  when: selinux_debug | bool

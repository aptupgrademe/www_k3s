---
# UNUSED since the repair became unconditional (see db_maintenance.yml): no
# task reads nextcloud_run_repair any more, "occ maintenance:repair
# --include-expensive" now runs on every play. Kept only so an old host_vars
# override does not look like a typo; safe to delete together with any such
# override.
nextcloud_run_repair: false

# Password policy (tasks/password_policy.yml). Applies to every Nextcloud host;
# override per host in host_vars if one instance needs different rules.
# type = how Nextcloud 34 stores the value (typed app config).
nextcloud_password_policy:
  - { key: minLength,                value: "12", type: integer }
  - { key: enforceNonCommonPassword, value: "1",  type: boolean }
  - { key: enforceHaveIBeenPwned,    value: "1",  type: boolean }
  # 0 = passwords never expire. Set EXPLICITLY: cvjm still had expiration=300
  # from the old server; enabling the app on 2026-10-13 made every password
  # older than 300 days "expired" at the next login, until this was set.
  - { key: expiration,               value: "0",  type: integer }

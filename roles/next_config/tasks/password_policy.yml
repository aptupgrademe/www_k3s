---
# -----------------------------------------------------------------------------
# Password policy (bundled app password_policy)
# -----------------------------------------------------------------------------
# Part 5 of next_config. Added 2026-10-13 after an attack-surface review: the
# app was disabled on cvjm, so any password was accepted. The rules apply when
# a password is SET (new account, password change, share-link password) -
# existing passwords are not checked or touched. EXCEPTION: "expiration" acts
# on existing passwords at login, which is why it is pinned to 0 here.
#   minLength 12                 the default would be 10
#   enforceNonCommonPassword     refuses passwords from a list of very common ones
#   expiration 0                 passwords never expire (see defaults: a
#                                leftover non-zero value locked users out)
#   enforceHaveIBeenPwned        refuses passwords that appear in known leaks.
#                                Nextcloud sends only the first 5 characters of
#                                the password's SHA-1 hash to
#                                api.pwnedpasswords.com (k-anonymity) and
#                                compares the rest locally - the password itself
#                                never leaves the server.
# Same "get, compare, set" pattern as nc_config.yml. Nextcloud 34 stores app
# config TYPED, so values are written with --type (integer / boolean); booleans
# are compared after "| bool", because occ may print them as 1 or true.

- name: Password policy | Enable the password_policy app
  ansible.builtin.command: >
    {{ occ_exec }}
    runuser -u www-data -- php /var/www/html/occ app:enable password_policy
  register: pwpol_enable
  changed_when: "'already enabled' not in (pwpol_enable.stdout | lower)"

- name: Password policy | Read the current settings
  ansible.builtin.command: >
    {{ occ_exec }}
    runuser -u www-data -- php /var/www/html/occ
    config:app:get password_policy {{ item.key }}
  loop: "{{ nextcloud_password_policy }}"
  loop_control:
    label: "{{ item.key }}"
  register: pwpol_current
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false  # rc 1 = key not set yet (app default applies)

- name: Password policy | Set the settings that differ
  ansible.builtin.command:
    argv: "{{ occ_exec.split() + ['runuser', '-u', 'www-data', '--', 'php', '/var/www/html/occ',
              'config:app:set', 'password_policy', item.item.key,
              '--value=' ~ item.item.value, '--type=' ~ item.item.type] }}"
  loop: "{{ pwpol_current.results }}"
  loop_control:
    label: "{{ item.item.key }} = {{ item.item.value }}"
  when: >-
    item.rc != 0 or
    (((item.stdout | trim | bool) != (item.item.value | bool))
      if item.item.type == 'boolean'
      else ((item.stdout | trim) != (item.item.value | string)))
  changed_when: true

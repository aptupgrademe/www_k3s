---
# -----------------------------------------------------------------------------
# Nextcloud system configuration (occ config:system:*)
# occ runs as www-data (uid 33) via runuser inside the nextcloud-fpm container.
# -----------------------------------------------------------------------------

# Shared prefix used by all occ tasks in this file.
- name: Config | Set kubectl exec occ prefix
  ansible.builtin.set_fact:
    occ_exec: >-
      k3s kubectl exec deployment/nextcloud
      --namespace nextcloud
      --container nextcloud-fpm
      --


# -----------------------------------------------------------------------------
# Trusted domains
# -----------------------------------------------------------------------------
- name: Config | Get current trusted_domains from Nextcloud
  ansible.builtin.command: >
    {{ occ_exec }}
    runuser -u www-data -- php /var/www/html/occ
    config:system:get trusted_domains
  register: nc_trusted_domains
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Config | Set trusted_domains[0] to nextcloud_hostname
  ansible.builtin.command: >
    {{ occ_exec }}
    runuser -u www-data -- php /var/www/html/occ
    config:system:set trusted_domains 0
    --value="{{ nextcloud_hostname }}"
  when: nextcloud_hostname not in nc_trusted_domains.stdout
  changed_when: true

- name: Config | Show trusted_domains update result
  ansible.builtin.debug:
    msg: "trusted_domains[0] was already set to {{ nextcloud_hostname }} – skipped."
  when: nextcloud_hostname in nc_trusted_domains.stdout


# -----------------------------------------------------------------------------
# overwrite.cli.url
# -----------------------------------------------------------------------------
- name: Config | Get current overwrite.cli.url
  ansible.builtin.command: >
    {{ occ_exec }}
    runuser -u www-data -- php /var/www/html/occ
    config:system:get overwrite.cli.url
  register: nc_cli_url
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Config | Set overwrite.cli.url to nextcloud_url
  ansible.builtin.command: >
    {{ occ_exec }}
    runuser -u www-data -- php /var/www/html/occ
    config:system:set overwrite.cli.url
    --value="{{ nextcloud_url }}"
  when: nc_cli_url.stdout | trim != nextcloud_url
  changed_when: true


# -----------------------------------------------------------------------------
# Mail / SMTP
# Configured via occ so settings are always in sync with Ansible – even when
# Nextcloud was already installed (env vars only apply during first-boot setup).
# mail_smtppassword comes from vault.yml; no_log prevents it appearing in logs.
# -----------------------------------------------------------------------------
# Read first, write only what differs: the former "config:system:set" tasks
# rewrote all nine values on every run and reported "ok" either way, so a
# changed SMTP host or password never showed up as a change.
- name: Config | Mail settings wanted in config.php
  ansible.builtin.set_fact:
    nc_mail_settings:
      - { key: mail_smtpmode,     value: "smtp" }
      - { key: mail_smtphost,     value: "{{ mail_smtphost }}" }
      - { key: mail_smtpport,     value: "{{ mail_smtpport }}", type: integer }
      - { key: mail_smtpsecure,   value: "tls" }   # STARTTLS on port 587
      - { key: mail_smtpauth,     value: "true", type: boolean }
      - { key: mail_smtpname,     value: "{{ mail_smtpname }}", secret: true }
      - { key: mail_smtppassword, value: "{{ mail_smtppassword }}", secret: true }
      - { key: mail_from_address, value: "{{ mail_from_address }}" }
      - { key: mail_domain,       value: "{{ mail_domain }}" }
  no_log: true

- name: Config | Read current mail settings
  ansible.builtin.command: >
    {{ occ_exec }}
    runuser -u www-data -- php /var/www/html/occ
    config:system:get {{ item.key }}
  loop: "{{ nc_mail_settings }}"
  loop_control:
    label: "{{ item.key }}"
  register: nc_mail_current
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false  # rc 1 = not set yet
  no_log: "{{ item.secret | default(false) }}"

# argv instead of a command string: values go to occ verbatim, a quote or
# space in the password cannot break the command line.
- name: Config | Set mail settings that differ
  ansible.builtin.command:
    argv: >-
      {{ occ_exec.split() + ['runuser', '-u', 'www-data', '--', 'php', '/var/www/html/occ',
         'config:system:set', item.item.key, '--value=' ~ item.item.value]
         + (['--type=' ~ item.item.type] if item.item.type is defined else []) }}
  loop: "{{ nc_mail_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.rc != 0 or (item.stdout | trim) != (item.item.value | string)
  changed_when: true
  no_log: "{{ item.item.secret | default(false) }}"

# A --check run skips the command above (it writes), so it would hide the
# pending change; this reports it instead.
- name: Config | Report mail settings a real run would change (--check only)
  ansible.builtin.debug:
    msg: "{{ item.item.key }} would be updated"
  loop: "{{ nc_mail_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - ansible_check_mode
    - item.rc != 0 or (item.stdout | trim) != (item.item.value | string)
  changed_when: true

---
# status_code: [200, 404] = both answers are expected (exists / does not
# exist); anything else (401, 500 ...) fails the task.
# -----------------------------------------------------------------------------
# Prometheus datasource
# -----------------------------------------------------------------------------
#
# Part 2 of common_grafana (see main.yml): datasource + dashboards.
#
# Ansible concepts used here:
#   "check, then create"  a GET registers the current state, the POST runs
#                only "when" the GET says it is missing (status 404). That
#                makes an API without idempotency of its own safe to call
#                on every run.
#   slurp        reads a file FROM the server into a variable - base64
#                encoded, hence "| b64decode | from_json" before use.
#   combine      merges two dicts; here it forces a fixed "uid" into the
#                downloaded dashboard so every import overwrites the same
#                dashboard instead of adding a copy.
#   block + when one condition for a whole group of tasks.

- name: Grafana | Check if Prometheus datasource already exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/datasources/name/Prometheus"
    method: GET
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: grafana_ds_check
  check_mode: false   # read-only API query, also runs in --check

# access: proxy = the Grafana SERVER queries Prometheus (127.0.0.1:9090),
# not the visitor's browser - Prometheus is never reachable from outside.
- name: Grafana | Create Prometheus datasource
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/datasources"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "Prometheus"
      type: "prometheus"
      url: "http://127.0.0.1:9090"
      access: "proxy"
      isDefault: true
    status_code: 200
  when: grafana_ds_check.status == 404


# The imports download dashboard JSON to /tmp, read it back and POST it with
# overwrite: true on every run - there is no state to compare, and in --check
# the download is skipped, so the read-back would fail. --check skips them.
- name: Grafana | Import dashboards (skipped in --check)
  when: not ansible_check_mode
  block:
    # force: false = download only when the file is not there yet (the
    # "latest" revision is fetched once per /tmp lifetime, i.e. until reboot).
    # -----------------------------------------------------------------------------
    # Dashboard 1860 – Node Exporter Full
    # -----------------------------------------------------------------------------
    - name: Grafana | Download dashboard 1860 from Grafana.com
      ansible.builtin.get_url:
        url: "https://grafana.com/api/dashboards/1860/revisions/latest/download"
        dest: /tmp/grafana-dashboard-1860.json
        mode: "0644"
        force: false          # skip download if file already present

    - name: Grafana | Read dashboard JSON from remote host
      ansible.builtin.slurp:
        src: /tmp/grafana-dashboard-1860.json
      register: dashboard_1860_raw

    - name: Grafana | Import dashboard 1860 via Grafana API
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/dashboards/import"
        method: POST
        user: "{{ grafana_basic_auth_user }}"
        password: "{{ grafana_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          # Fixed uid ensures overwrite: true always replaces the same dashboard
          # instead of creating a new one on each playbook run.
          dashboard: "{{ dashboard_1860_raw.content | b64decode | from_json | combine({'uid': 'rYdddlPWk'}) }}"
          overwrite: true
          inputs:
            - name: "DS_PROMETHEUS"
              type: "datasource"
              pluginId: "prometheus"
              value: "Prometheus"
          folderId: 0
        status_code: 200
      register: import_1860
      # The whole dashboard JSON would otherwise be logged to the target's syslog
      # with every run ("message too long" from rsyslog, found 2026-10-02).
      no_log: true

    # Dashboard 1860 uses the modern Grafana 11 format (no __inputs section).
    # The ds_prometheus datasource variable and the node/job chain are not
    # initialised by the import API, so panels show "No data" on first open.
    # We write a small Python script to the server, run it, then delete it.
    - name: Grafana | Write Node Exporter Full variable patch script
      ansible.builtin.copy:
        dest: /usr/local/libexec/grafana/gf_patch_1860.py
        mode: "0700"
        owner: root
        content: |
          import json, urllib.request, base64, os
          BASE = "http://127.0.0.1:3000"
          USER = os.environ["GF_USER"]
          PASS = os.environ["GF_PASS"]
          DASH_UID = os.environ["GF_DASH_UID"]
          HOSTNAME = os.environ["GF_HOSTNAME"]

          def api(path, method="GET", body=None):
              req = urllib.request.Request(f"{BASE}{path}", method=method)
              creds = base64.b64encode(f"{USER}:{PASS}".encode()).decode()
              req.add_header("Authorization", f"Basic {creds}")
              req.add_header("Content-Type", "application/json")
              data = json.dumps(body).encode() if body else None
              with urllib.request.urlopen(req, data=data) as r:
                  return json.load(r)

          prom_uid = api("/api/datasources/name/Prometheus")["uid"]
          d        = api(f"/api/dashboards/uid/{DASH_UID}")
          dash     = d["dashboard"]
          meta     = d["meta"]

          defaults = {
              "ds_prometheus": {
                  "current": {"selected": True, "text": "Prometheus", "value": prom_uid},
                  "options":  [{"selected": True, "text": "Prometheus", "value": prom_uid}],
              },
              "job":      {"current": {"selected": True, "text": "node",      "value": "node"}},
              "nodename": {"current": {"selected": True, "text": "localhost",  "value": "localhost"}},
              "node":     {"current": {"selected": True, "text": HOSTNAME,     "value": HOSTNAME}},
          }
          for var in dash.get("templating", {}).get("list", []):
              if var.get("name") in defaults:
                  var.update(defaults[var["name"]])

          r = api("/api/dashboards/db", method="POST", body={
              "dashboard": dash, "overwrite": True,
              "folderId":  meta.get("folderId", 0),
          })
          print(r.get("status", "?"))

    # The script reads its inputs from environment variables, so the
    # password never appears in the command line (visible in "ps") or in the
    # script file. changed_when: false because it rewrites the same values
    # every run; no_log because the environment holds the password.
    - name: Grafana | Patch Node Exporter Full variable defaults
      ansible.builtin.command: python3 /usr/local/libexec/grafana/gf_patch_1860.py
      environment:
        GF_USER:     "{{ grafana_basic_auth_user }}"
        GF_PASS:     "{{ grafana_admin_pass }}"
        GF_DASH_UID: "{{ import_1860.json.uid }}"
        GF_HOSTNAME: "{{ inventory_hostname }}"
      changed_when: false
      no_log: true

    # Kept in /usr/local/libexec/grafana (no secrets in it - they come via environment), so it is
    # only rewritten when its content changes instead of on every run.


    # -----------------------------------------------------------------------------
    # Dashboard 7362 – MySQL Overview (mysqld_exporter / MariaDB)
    # -----------------------------------------------------------------------------
    - name: Grafana | Download dashboard 7362 from Grafana.com
      ansible.builtin.get_url:
        url: "https://grafana.com/api/dashboards/7362/revisions/latest/download"
        dest: /tmp/grafana-dashboard-7362.json
        mode: "0644"
        force: false

    - name: Grafana | Read dashboard JSON 7362 from remote host
      ansible.builtin.slurp:
        src: /tmp/grafana-dashboard-7362.json
      register: dashboard_7362_raw

    - name: Grafana | Import dashboard 7362 via Grafana API
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/dashboards/import"
        method: POST
        user: "{{ grafana_basic_auth_user }}"
        password: "{{ grafana_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          dashboard: "{{ dashboard_7362_raw.content | b64decode | from_json | combine({'uid': 'MQWgroiiz'}) }}"
          overwrite: true
          inputs:
            - name: "DS_PROMETHEUS"
              type: "datasource"
              pluginId: "prometheus"
              value: "Prometheus"
          folderId: 0
        status_code: 200
      # The whole dashboard JSON would otherwise be logged to the target's syslog
      # with every run ("message too long" from rsyslog, found 2026-10-02).
      no_log: true


    # -----------------------------------------------------------------------------
    # Dashboard 25545 – PHP-FPM (php-fpm_exporter on a plain host)
    # -----------------------------------------------------------------------------
    # Replaced 4912 on 2026-10-26: 4912 was built for hipages' own cluster and
    # filters every query on labels we do not have (app, hip_new,
    # kubernetes_namespace, pod_name, container_name="fpm") - every panel
    # showed N/A. 25545 uses the same exporter metrics with job/instance only;
    # all of its queries return data here. Pinned to revision 1 (single
    # author), imported under the old uid so the broken dashboard is replaced.
    - name: Grafana | Download dashboard 25545 from Grafana.com
      ansible.builtin.get_url:
        url: "https://grafana.com/api/dashboards/25545/revisions/1/download"
        dest: /tmp/grafana-dashboard-25545.json
        mode: "0644"
        force: false

    - name: Grafana | Remove the old dashboard 4912 download
      ansible.builtin.file:
        path: /tmp/grafana-dashboard-4912.json
        state: absent

    - name: Grafana | Read dashboard JSON 25545 from remote host
      ansible.builtin.slurp:
        src: /tmp/grafana-dashboard-25545.json
      register: dashboard_25545_raw

    - name: Grafana | Import dashboard 25545 via Grafana API
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/dashboards/import"
        method: POST
        user: "{{ grafana_basic_auth_user }}"
        password: "{{ grafana_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          dashboard: >-
            {{ dashboard_25545_raw.content | b64decode | from_json
               | combine({'uid': 'f67a223d-b1b6-4f5a-8c5d-233a7a8aeb98', 'title': 'PHP-FPM', 'id': none}) }}
          overwrite: true
          inputs:
            - name: "DS_PROMETHEUS"
              type: "datasource"
              pluginId: "prometheus"
              value: "Prometheus"
          folderId: 0
        status_code: 200
      # The whole dashboard JSON would otherwise be logged to the target's syslog
      # with every run ("message too long" from rsyslog, found 2026-10-02).
      no_log: true


    # -----------------------------------------------------------------------------
    # Container-Ressourcen – our own dashboard (files/container-resources.json)
    # -----------------------------------------------------------------------------
    # Data from common_kube_metrics (cAdvisor + kube-state-metrics): CPU and
    # memory per container against its limit, CPU throttling, restarts, OOM
    # kills, last termination reason. Lives in the repo instead of
    # grafana.com, so there is no download; the fixed uid is in the file.
    - name: Grafana | Import dashboard Container-Ressourcen
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/dashboards/db"
        method: POST
        user: "{{ grafana_basic_auth_user }}"
        password: "{{ grafana_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          dashboard: "{{ lookup('ansible.builtin.file', 'container-resources.json') | from_json }}"
          overwrite: true
          folderId: 0
        status_code: 200
      no_log: true

# Note: Grafana is proxied via K3s Ingress at /grafana/
# Access control is handled by Grafana's own admin_password (set above).
# No host-level Nginx or htpasswd file needed.

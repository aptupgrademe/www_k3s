---
# =============================================================================
# Role: common_grafana
# Purpose: Install Grafana OSS on AlmaLinux 9, configure a Prometheus
#          datasource and import dashboard 1860 (Node Exporter Full).
#          Grafana is exposed via K3s Ingress at /grafana/ on the main hostname.
#          Access is protected by Grafana's own admin password (no host-level proxy auth).
# =============================================================================

- name: common_grafana | Package, configuration, service
  ansible.builtin.import_tasks: install.yml

- name: common_grafana | Datasource and dashboards
  ansible.builtin.import_tasks: dashboards.yml

- name: common_grafana | SMTP and alerting
  ansible.builtin.import_tasks: alerting.yml

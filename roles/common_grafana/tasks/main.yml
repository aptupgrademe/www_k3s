---
# =============================================================================
# Role: common_grafana
# Purpose: Install Grafana OSS on AlmaLinux 9, configure a Prometheus
#          datasource and import dashboard 1860 (Node Exporter Full).
#          Grafana is exposed via K3s Ingress at /grafana/ on the main hostname.
#          Access is protected by Grafana's own admin password (no host-level proxy auth).
# =============================================================================


# -----------------------------------------------------------------------------
# Repository and package
# -----------------------------------------------------------------------------
- name: Grafana | Add official Grafana repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/grafana.repo
    owner: root
    group: root
    mode: "0644"
    content: |
      [grafana]
      name=Grafana OSS
      baseurl=https://rpm.grafana.com
      repo_gpgcheck=1
      enabled=1
      gpgcheck=1
      gpgkey=https://rpm.grafana.com/gpg.key
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      exclude=*beta*

- name: Grafana | Install grafana-oss
  ansible.builtin.dnf:
    name: grafana
    state: present


# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
# admin_user and admin_password are only evaluated by Grafana on first start
# (before the internal database is initialised).  On an existing installation
# these lines have no effect – the credentials are stored in the DB.
# NOTE: admin_user only takes effect on the very first Grafana start (before
# the internal SQLite DB is created).  On an existing installation the user
# in the DB is not renamed – change it manually via the Grafana UI or CLI.
- name: Grafana | Set admin username in grafana.ini
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?\s*admin_user\s*='
    line: "admin_user = {{ grafana_basic_auth_user }}"
    state: present
  notify: restart grafana

- name: Grafana | Set admin password in grafana.ini
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?\s*admin_password\s*='
    line: "admin_password = {{ grafana_admin_pass }}"
    state: present
  notify: restart grafana

# Disable the "change password on first login" prompt when password is managed
- name: Grafana | Disable forced password change on login
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?\s*disable_initial_admin_creation\s*='
    line: "disable_initial_admin_creation = false"
    state: present

# Bind to all interfaces so K3s pods can reach Grafana via the host IP
# (the K3s External Service Endpoint points to the host's public IP).
# Access is restricted to the K3s pod CIDR by nftables (common_firewall).
- name: Grafana | Bind to all interfaces (required for K3s pod access)
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?\s*http_addr\s*='
    line: "http_addr = 0.0.0.0"
    state: present
  notify: restart grafana

# Required so Grafana generates correct redirect URLs when served via K3s Ingress at /grafana/
- name: Grafana | Set root_url for K3s Ingress subpath proxy
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?\s*root_url\s*='
    line: "root_url = https://{{ grafana_proxy_hostname }}/grafana/"
    state: present
  notify: restart grafana

- name: Grafana | Enable serve_from_sub_path
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?\s*serve_from_sub_path\s*='
    line: "serve_from_sub_path = true"
    state: present
  notify: restart grafana


# -----------------------------------------------------------------------------
# Enable and start Grafana (must be running before API calls)
# -----------------------------------------------------------------------------
- name: Grafana | Enable and start service
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true

- name: Grafana | Wait for API to become available
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/health"
    status_code: 200
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 3


# -----------------------------------------------------------------------------
# Prometheus datasource
# -----------------------------------------------------------------------------
- name: Grafana | Check if Prometheus datasource already exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/datasources/name/Prometheus"
    method: GET
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: grafana_ds_check

- name: Grafana | Create Prometheus datasource
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/datasources"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "Prometheus"
      type: "prometheus"
      url: "http://127.0.0.1:9090"
      access: "proxy"
      isDefault: true
    status_code: 200
  when: grafana_ds_check.status == 404


# -----------------------------------------------------------------------------
# Dashboard 1860 – Node Exporter Full
# -----------------------------------------------------------------------------
- name: Grafana | Download dashboard 1860 from Grafana.com
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/1860/revisions/latest/download"
    dest: /tmp/grafana-dashboard-1860.json
    mode: "0644"
    force: false          # skip download if file already present

- name: Grafana | Read dashboard JSON from remote host
  ansible.builtin.slurp:
    src: /tmp/grafana-dashboard-1860.json
  register: dashboard_1860_raw

- name: Grafana | Import dashboard 1860 via Grafana API
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/dashboards/import"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      # Fixed uid ensures overwrite: true always replaces the same dashboard
      # instead of creating a new one on each playbook run.
      dashboard: "{{ dashboard_1860_raw.content | b64decode | from_json | combine({'uid': 'rYdddlPWk'}) }}"
      overwrite: true
      inputs:
        - name: "DS_PROMETHEUS"
          type: "datasource"
          pluginId: "prometheus"
          value: "Prometheus"
      folderId: 0
    status_code: 200
  register: import_1860

# Dashboard 1860 uses the modern Grafana 11 format (no __inputs section).
# The ds_prometheus datasource variable and the node/job chain are not
# initialised by the import API, so panels show "No data" on first open.
# We write a small Python script to the server, run it, then delete it.
- name: Grafana | Write Node Exporter Full variable patch script
  ansible.builtin.copy:
    dest: /tmp/gf_patch_1860.py
    mode: "0700"
    owner: root
    content: |
      import json, urllib.request, base64, os
      BASE = "http://127.0.0.1:3000"
      USER = os.environ["GF_USER"]
      PASS = os.environ["GF_PASS"]
      DASH_UID = os.environ["GF_DASH_UID"]
      HOSTNAME = os.environ["GF_HOSTNAME"]

      def api(path, method="GET", body=None):
          req = urllib.request.Request(f"{BASE}{path}", method=method)
          creds = base64.b64encode(f"{USER}:{PASS}".encode()).decode()
          req.add_header("Authorization", f"Basic {creds}")
          req.add_header("Content-Type", "application/json")
          data = json.dumps(body).encode() if body else None
          with urllib.request.urlopen(req, data=data) as r:
              return json.load(r)

      prom_uid = api("/api/datasources/name/Prometheus")["uid"]
      d        = api(f"/api/dashboards/uid/{DASH_UID}")
      dash     = d["dashboard"]
      meta     = d["meta"]

      defaults = {
          "ds_prometheus": {
              "current": {"selected": True, "text": "Prometheus", "value": prom_uid},
              "options":  [{"selected": True, "text": "Prometheus", "value": prom_uid}],
          },
          "job":      {"current": {"selected": True, "text": "node",      "value": "node"}},
          "nodename": {"current": {"selected": True, "text": "localhost",  "value": "localhost"}},
          "node":     {"current": {"selected": True, "text": HOSTNAME,     "value": HOSTNAME}},
      }
      for var in dash.get("templating", {}).get("list", []):
          if var.get("name") in defaults:
              var.update(defaults[var["name"]])

      r = api("/api/dashboards/db", method="POST", body={
          "dashboard": dash, "overwrite": True,
          "folderId":  meta.get("folderId", 0),
      })
      print(r.get("status", "?"))

- name: Grafana | Patch Node Exporter Full variable defaults
  ansible.builtin.command: python3 /tmp/gf_patch_1860.py
  environment:
    GF_USER:     "{{ grafana_basic_auth_user }}"
    GF_PASS:     "{{ grafana_admin_pass }}"
    GF_DASH_UID: "{{ import_1860.json.uid }}"
    GF_HOSTNAME: "{{ inventory_hostname }}"
  changed_when: false
  no_log: true

- name: Grafana | Remove Node Exporter Full patch script
  ansible.builtin.file:
    path: /tmp/gf_patch_1860.py
    state: absent


# -----------------------------------------------------------------------------
# Dashboard 7362 – MySQL Overview (mysqld_exporter / MariaDB)
# -----------------------------------------------------------------------------
- name: Grafana | Download dashboard 7362 from Grafana.com
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/7362/revisions/latest/download"
    dest: /tmp/grafana-dashboard-7362.json
    mode: "0644"
    force: false

- name: Grafana | Read dashboard JSON 7362 from remote host
  ansible.builtin.slurp:
    src: /tmp/grafana-dashboard-7362.json
  register: dashboard_7362_raw

- name: Grafana | Import dashboard 7362 via Grafana API
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/dashboards/import"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      dashboard: "{{ dashboard_7362_raw.content | b64decode | from_json | combine({'uid': 'MQWgroiiz'}) }}"
      overwrite: true
      inputs:
        - name: "DS_PROMETHEUS"
          type: "datasource"
          pluginId: "prometheus"
          value: "Prometheus"
      folderId: 0
    status_code: 200


# -----------------------------------------------------------------------------
# Dashboard 4912 – PHP-FPM (php-fpm_exporter)
# -----------------------------------------------------------------------------
- name: Grafana | Download dashboard 4912 from Grafana.com
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/4912/revisions/latest/download"
    dest: /tmp/grafana-dashboard-4912.json
    mode: "0644"
    force: false

- name: Grafana | Read dashboard JSON 4912 from remote host
  ansible.builtin.slurp:
    src: /tmp/grafana-dashboard-4912.json
  register: dashboard_4912_raw

- name: Grafana | Import dashboard 4912 via Grafana API
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/dashboards/import"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      dashboard: "{{ dashboard_4912_raw.content | b64decode | from_json | combine({'uid': 'f67a223d-b1b6-4f5a-8c5d-233a7a8aeb98'}) }}"
      overwrite: true
      inputs:
        - name: "DS_PROMETHEUS"
          type: "datasource"
          pluginId: "prometheus"
          value: "Prometheus"
      folderId: 0
    status_code: 200


# Note: Grafana is proxied via K3s Ingress at /grafana/
# Access control is handled by Grafana's own admin_password (set above).
# No host-level Nginx or htpasswd file needed.


# =============================================================================
# SMTP – enables Grafana to send alert notification emails
# =============================================================================

- name: Grafana | Configure SMTP section
  ansible.builtin.blockinfile:
    path: /etc/grafana/grafana.ini
    marker: "# {mark} ANSIBLE MANAGED BLOCK – smtp"
    insertafter: '^\[smtp\]'
    block: |
      enabled      = true
      host         = {{ msmtp_host }}:{{ msmtp_port }}
      user         = {{ msmtp_user }}
      password     = {{ msmtp_password }}
      from_address = {{ msmtp_from }}
      from_name    = Grafana Homelab
  notify: restart grafana
  no_log: true

- name: Grafana | Flush handlers so SMTP is active before API calls
  ansible.builtin.meta: flush_handlers

- name: Grafana | Wait for API after restart
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/health"
    status_code: 200
  register: _gf_health
  until: _gf_health.status == 200
  retries: 20
  delay: 3


# =============================================================================
# ALERT CONTACT POINT – email
# =============================================================================

- name: Grafana | Check if email contact point exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/v1/provisioning/contact-points"
    method: GET
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    status_code: 200
  register: _gf_contacts
  no_log: true

- name: Grafana | Create email contact point
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/v1/provisioning/contact-points"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "email-admin"
      type: "email"
      settings:
        addresses: "{{ email }}"
        singleEmail: true
      disableResolveMessage: false
    status_code: [200, 202]
  when: >-
    (_gf_contacts.json | default([]) | selectattr('name', 'equalto', 'email-admin') | list | length) == 0
  no_log: true

- name: Grafana | Set default notification policy to email-admin
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/v1/provisioning/policies"
    method: PUT
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      receiver: "email-admin"
      group_by: ["alertname", "instance"]
      group_wait: "30s"
      group_interval: "5m"
      repeat_interval: "4h"
    status_code: [200, 202]
  no_log: true


# =============================================================================
# ALERT FOLDER
# =============================================================================

- name: Grafana | Create alert folder "Homelab Alerts"
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/folders"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      uid: "homelab-alerts"
      title: "Homelab Alerts"
    status_code: [200, 409, 412]   # 409/412 = already exists (Grafana 13 uses 412)
  register: _gf_folder
  no_log: true


# =============================================================================
# ALERT RULES – deployed as a Python script to keep YAML readable
# =============================================================================

- name: Grafana | Write alert provisioning script
  ansible.builtin.copy:
    dest: /tmp/gf_alerts.py
    mode: "0700"
    owner: root
    content: |
      import json, urllib.request, base64, os, sys

      BASE = "http://127.0.0.1:3000"
      USER = os.environ["GF_USER"]
      PASS = os.environ["GF_PASS"]
      DS_NAME = "Prometheus"
      FOLDER_UID = "homelab-alerts"
      EMAIL = os.environ["GF_EMAIL"]

      def api(path, method="GET", body=None):
          req = urllib.request.Request(f"{BASE}{path}", method=method)
          creds = base64.b64encode(f"{USER}:{PASS}".encode()).decode()
          req.add_header("Authorization", f"Basic {creds}")
          req.add_header("Content-Type", "application/json")
          data = json.dumps(body).encode() if body else None
          with urllib.request.urlopen(req, data=data, timeout=10) as r:
              return json.load(r)

      # Datasource UID holen
      ds_uid = api(f"/api/datasources/name/{DS_NAME}")["uid"]

      def make_rule(uid, title, expr, threshold, threshold_op, summary, threshold_label):
          # expr must NOT contain a PromQL threshold filter (no "> N" at end).
          # The threshold belongs in the evaluator so classic_conditions always
          # receives data and never throws "condition must not be empty".
          return {
              "uid": uid,
              "title": title,
              "ruleGroup": "homelab",
              "folderUID": FOLDER_UID,
              "noDataState": "OK",
              "execErrState": "OK",
              "for": "5m",
              "annotations": {
                  "summary": summary,
                  "__dashboardUid__": "",
                  "__panelId__": "",
              },
              "labels": {"severity": "warning"},
              "data": [
                  {
                      "refId": "A",
                      "datasourceUid": ds_uid,
                      "queryType": "",
                      "relativeTimeRange": {"from": 600, "to": 0},
                      "model": {
                          "expr": expr,
                          "legendFormat": threshold_label,
                          "refId": "A",
                          "instant": True,
                          "intervalMs": 1000,
                          "maxDataPoints": 43200,
                      },
                  },
                  {
                      "refId": "B",
                      "datasourceUid": "-100",
                      "queryType": "",
                      "relativeTimeRange": {"from": 600, "to": 0},
                      "model": {
                          "conditions": [{
                              "evaluator": {"params": [threshold], "type": threshold_op},
                              "operator": {"type": "and"},
                              "query": {"params": ["A"]},
                              "reducer": {"params": [], "type": "last"},
                              "type": "query",
                          }],
                          "datasource": {"type": "__expr__", "uid": "-100"},
                          "refId": "B",
                          "type": "classic_conditions",
                      },
                  },
              ],
          }

      rules = [
          make_rule(
              "alert-disk-root",
              "Festplatte root > 80%",
              '(node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) '
              '/ node_filesystem_size_bytes{mountpoint="/"}  * 100',
              80, "gt",
              "Root-Partition ist zu mehr als 80% gefüllt – bitte Speicherplatz freigeben!",
              "disk_used_pct",
          ),
          make_rule(
              "alert-disk-data",
              "Daten-Partition > 80%",
              '(node_filesystem_size_bytes{mountpoint=~"/srv|/var"} - node_filesystem_free_bytes{mountpoint=~"/srv|/var"}) '
              '/ node_filesystem_size_bytes{mountpoint=~"/srv|/var"} * 100',
              80, "gt",
              "Daten-Partition (/srv oder /var) ist zu mehr als 80% gefüllt!",
              "disk_data_pct",
          ),
          make_rule(
              "alert-memory",
              "Arbeitsspeicher > 90%",
              "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) "
              "/ node_memory_MemTotal_bytes * 100",
              90, "gt",
              "Mehr als 90% des RAM sind belegt – Risiko von OOM-Kills!",
              "mem_used_pct",
          ),
          make_rule(
              "alert-cpu-load",
              "CPU-Last > 85%",
              "100 - (avg(rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)",
              85, "gt",
              "Die durchschnittliche CPU-Last liegt seit 5 min über 85%.",
              "cpu_used_pct",
          ),
          make_rule(
              "alert-node-down",
              "Node Exporter nicht erreichbar",
              "up{job='node'}",
              1, "lt",
              "Node Exporter antwortet nicht – Server möglicherweise down!",
              "node_up",
          ),
      ]

      for rule in rules:
          uid = rule["uid"]
          # Prüfen ob Regel schon existiert
          try:
              existing = api(f"/api/v1/provisioning/alert-rules/{uid}")
              # Update
              result = api(f"/api/v1/provisioning/alert-rules/{uid}", method="PUT", body=rule)
              print(f"  updated: {rule['title']}")
          except Exception:
              # Neu anlegen
              result = api("/api/v1/provisioning/alert-rules", method="POST", body=rule)
              print(f"  created: {rule['title']}")

      print("Fertig.")

- name: Grafana | Apply alert rules
  ansible.builtin.command: python3 /tmp/gf_alerts.py
  environment:
    GF_USER:  "{{ grafana_basic_auth_user }}"
    GF_PASS:  "{{ grafana_admin_pass }}"
    GF_EMAIL: "{{ email }}"
  changed_when: false
  no_log: true

- name: Grafana | Remove alert provisioning script
  ansible.builtin.file:
    path: /tmp/gf_alerts.py
    state: absent


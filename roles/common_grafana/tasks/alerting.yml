---
# =============================================================================
# SMTP – enables Grafana to send alert notification emails
# =============================================================================
#
# Part 3 of common_grafana (see main.yml): e-mail alerting.
#
# Ansible concepts used here:
#   blockinfile  manages a whole BLOCK of lines between two marker
#                comments ("# BEGIN/END ANSIBLE MANAGED BLOCK – smtp").
#                Rerunning replaces exactly that block, nothing else.
#                insertafter places it right after the [smtp] header the
#                first time.
#   meta: flush_handlers  runs all handlers notified so far RIGHT NOW
#                instead of at the end of the play. Needed here: the new SMTP
#                settings only take effect after "restart grafana", and the
#                contact point below is created against the running Grafana.
#   environment: sets environment variables for one task only - the way the
#                Python script gets its credentials.

# password in triple quotes: grafana.ini treats "#" and ";" as the start of
# a comment, so a password containing one was cut off there - every alert
# mail on that host failed with 535 "Authentication credentials invalid"
# (17 times in two days, found 2026-10-22). Grafana's documented quoting.
# The msmtp_* values are the same mail relay common_msmtp uses for the
# host's own mails, so Grafana needs no separate mail account.
- name: Grafana | Configure SMTP section
  ansible.builtin.blockinfile:
    path: /etc/grafana/grafana.ini
    marker: "# {mark} ANSIBLE MANAGED BLOCK – smtp"
    insertafter: '^\[smtp\]'
    block: |
      enabled      = true
      host         = {{ msmtp_host }}:{{ msmtp_port }}
      user         = {{ msmtp_user }}
      password     = """{{ msmtp_password }}"""
      from_address = {{ msmtp_from }}
      from_name    = Grafana Homelab
  notify: restart grafana
  no_log: true

- name: Grafana | Flush handlers so SMTP is active before API calls
  ansible.builtin.meta: flush_handlers

- name: Grafana | Wait for API after restart
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/health"
    status_code: 200
  register: _gf_health
  check_mode: false   # read-only API query, also runs in --check
  until: _gf_health.status == 200
  retries: 20
  delay: 3


# =============================================================================
# ALERT CONTACT POINT – email
# =============================================================================

- name: Grafana | Check if email contact point exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/v1/provisioning/contact-points"
    method: GET
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    status_code: 200
  register: _gf_contacts
  check_mode: false   # read-only API query, also runs in --check
  no_log: true

- name: Grafana | Create email contact point
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/v1/provisioning/contact-points"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "email-admin"
      type: "email"
      settings:
        addresses: "{{ email }}"
        singleEmail: true
      disableResolveMessage: false
    status_code: [200, 202]
  when: >-
    (_gf_contacts.json | default([]) | selectattr('name', 'equalto', 'email-admin') | list | length) == 0
  no_log: true

# PUT replaces the whole policy tree with this one route on every run:
# alerts are grouped per alert name + instance, the first mail goes out
# after 30 s, repeats at most every 4 h while the alert keeps firing.
- name: Grafana | Set default notification policy to email-admin
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/v1/provisioning/policies"
    method: PUT
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      receiver: "email-admin"
      group_by: ["alertname", "instance"]
      group_wait: "30s"
      group_interval: "5m"
      repeat_interval: "4h"
    status_code: [200, 202]
  no_log: true


# =============================================================================
# ALERT FOLDER
# =============================================================================

# Alert rules must live in a folder. Instead of "check, then create",
# this POST simply accepts "already exists" (409/412) as success.
- name: Grafana | Create alert folder "Homelab Alerts"
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/folders"
    method: POST
    user: "{{ grafana_basic_auth_user }}"
    password: "{{ grafana_admin_pass }}"
    force_basic_auth: true
    body_format: json
    body:
      uid: "homelab-alerts"
      title: "Homelab Alerts"
    status_code: [200, 409, 412]   # 409/412 = already exists (Grafana 13 uses 412)
  register: _gf_folder
  no_log: true


# =============================================================================
# ALERT RULES – deployed as a Python script to keep YAML readable
# =============================================================================

# The script is plain Python 3 (stdlib only) and is idempotent itself: for
# each rule it tries a GET and then updates (PUT) or creates (POST).
# mode 0700 + owner root: only root can read or run it.
- name: Grafana | Write alert provisioning script
  ansible.builtin.copy:
    dest: /usr/local/libexec/grafana/gf_alerts.py
    mode: "0700"
    owner: root
    content: |
      import json, urllib.request, base64, os, sys

      BASE = "http://127.0.0.1:3000"
      USER = os.environ["GF_USER"]
      PASS = os.environ["GF_PASS"]
      DS_NAME = "Prometheus"
      FOLDER_UID = "homelab-alerts"
      EMAIL = os.environ["GF_EMAIL"]

      def api(path, method="GET", body=None):
          req = urllib.request.Request(f"{BASE}{path}", method=method)
          creds = base64.b64encode(f"{USER}:{PASS}".encode()).decode()
          req.add_header("Authorization", f"Basic {creds}")
          req.add_header("Content-Type", "application/json")
          data = json.dumps(body).encode() if body else None
          with urllib.request.urlopen(req, data=data, timeout=10) as r:
              return json.load(r)

      # Datasource UID holen
      ds_uid = api(f"/api/datasources/name/{DS_NAME}")["uid"]

      def make_rule(uid, title, expr, threshold, threshold_op, summary, threshold_label):
          # expr must NOT contain a PromQL threshold filter (no "> N" at end);
          # the threshold belongs in the evaluator of query B.
          # "condition" names the refId that decides the alert. Without it
          # Grafana logs "condition must not be empty" on every evaluation and
          # never fires; execErrState OK hid that (found 2026-09-23 on cvjm).
          return {
              "uid": uid,
              "title": title,
              "condition": "B",
              "ruleGroup": "homelab",
              "folderUID": FOLDER_UID,
              "noDataState": "OK",
              "execErrState": "OK",
              "for": "5m",
              # No empty __dashboardUid__/__panelId__: Grafana tries to parse
              # them on every state change ("Error parsing panelUID").
              "annotations": {
                  "summary": summary,
              },
              "labels": {"severity": "warning"},
              "data": [
                  {
                      "refId": "A",
                      "datasourceUid": ds_uid,
                      "queryType": "",
                      "relativeTimeRange": {"from": 600, "to": 0},
                      "model": {
                          "expr": expr,
                          "legendFormat": threshold_label,
                          "refId": "A",
                          "instant": True,
                          "intervalMs": 1000,
                          "maxDataPoints": 43200,
                      },
                  },
                  {
                      "refId": "B",
                      "datasourceUid": "-100",
                      "queryType": "",
                      "relativeTimeRange": {"from": 600, "to": 0},
                      "model": {
                          "conditions": [{
                              "evaluator": {"params": [threshold], "type": threshold_op},
                              "operator": {"type": "and"},
                              "query": {"params": ["A"]},
                              "reducer": {"params": [], "type": "last"},
                              "type": "query",
                          }],
                          "datasource": {"type": "__expr__", "uid": "-100"},
                          "refId": "B",
                          "type": "classic_conditions",
                      },
                  },
              ],
          }

      rules = [
          make_rule(
              "alert-disk-root",
              "Festplatte root > 80%",
              '(node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) '
              '/ node_filesystem_size_bytes{mountpoint="/"}  * 100',
              80, "gt",
              "Root-Partition ist zu mehr als 80% gefüllt – bitte Speicherplatz freigeben!",
              "disk_used_pct",
          ),
          make_rule(
              "alert-disk-data",
              "Daten-Partition > 80%",
              '(node_filesystem_size_bytes{mountpoint=~"/srv|/var"} - node_filesystem_free_bytes{mountpoint=~"/srv|/var"}) '
              '/ node_filesystem_size_bytes{mountpoint=~"/srv|/var"} * 100',
              80, "gt",
              "Daten-Partition (/srv oder /var) ist zu mehr als 80% gefüllt!",
              "disk_data_pct",
          ),
          make_rule(
              "alert-memory",
              "Arbeitsspeicher > 90%",
              "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) "
              "/ node_memory_MemTotal_bytes * 100",
              90, "gt",
              "Mehr als 90% des RAM sind belegt – Risiko von OOM-Kills!",
              "mem_used_pct",
          ),
          make_rule(
              "alert-cpu-load",
              "CPU-Last > 85%",
              "100 - (avg(rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)",
              85, "gt",
              "Die durchschnittliche CPU-Last liegt seit 5 min über 85%.",
              "cpu_used_pct",
          ),
          make_rule(
              "alert-node-down",
              "Node Exporter nicht erreichbar",
              "up{job='node'}",
              1, "lt",
              "Node Exporter antwortet nicht – Server möglicherweise down!",
              "node_up",
          ),
          # A failing collector means its metrics are simply absent, and every
          # rule built on them sees "no data" (= OK). 2026-10-20..22 the
          # filesystem collector failed under SELinux (dontaudit, no AVC) and
          # the two disk rules above were blind for two days.
          # Only the collectors the dashboards and rules use: on these VMs
          # many others (nfs, zfs, nvme, infiniband, pressure - PSI is off in
          # the EL9 kernel, ...) always report 0 because the hardware or
          # feature does not exist.
          make_rule(
              "alert-node-collector",
              "node_exporter-Collector fehlgeschlagen",
              'min(node_scrape_collector_success{collector=~"cpu|diskstats|filesystem|loadavg|meminfo|netdev|textfile"}) or vector(1)',
              1, "lt",
              "Ein node_exporter-Collector schlägt fehl (journalctl -u node_exporter) – seine Messwerte fehlen, Alarme darauf bleiben stumm.",
              "node_collector_ok",
          ),
          # Container rules (common_kube_metrics). max() turns the per-
          # container series into one value; the dashboard
          # "Container-Ressourcen" shows which container it was.
          make_rule(
              "alert-container-memory",
              "Container-Speicher > 90% vom Limit",
              'max(sum by (namespace, pod, container) (container_memory_working_set_bytes) '
              '/ on (namespace, pod, container) kube_pod_container_resource_limits{resource="memory"}) * 100',
              90, "gt",
              "Ein Container nutzt mehr als 90% seines Speicherlimits – OOM-Kill droht (Dashboard Container-Ressourcen).",
              "container_mem_pct",
          ),
          make_rule(
              "alert-container-throttling",
              "Container-CPU gedrosselt > 50%",
              'max(sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total[5m])) '
              '/ sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total[5m]))) * 100',
              50, "gt",
              "Ein Container wird seit 5 min in mehr als der Hälfte der Perioden gebremst – CPU-Limit zu knapp?",
              "container_throttled_pct",
          ),
          make_rule(
              "alert-container-oom",
              "Container OOM-Kill",
              "max(increase(container_oom_events_total[15m])) or vector(0)",
              0, "gt",
              "Ein Container wurde wegen Speichermangel beendet (OOMKilled) – Limit prüfen.",
              "container_oom",
          ),
          make_rule(
              "alert-container-crashloop",
              "Container startet wiederholt neu",
              "max(increase(kube_pod_container_status_restarts_total[15m])) or vector(0)",
              2, "gt",
              "Ein Container ist in 15 min mehr als zweimal neu gestartet (Crash-Schleife?).",
              "container_restarts",
          ),
          # PHP-FPM (php-fpm-exporter in the app pod, both stacks). A request
          # in the listen queue waits for a free worker. Short peaks are
          # normal (blog once 30 for one minute, the larger Nextcloud 17 single minutes in
          # 14 days); a queue that stays 5 min never happened up to
          # 2026-10-21 - then pm.max_children is too small for the load.
          make_rule(
              "alert-phpfpm-queue",
              "PHP-FPM: Anfragen warten",
              "max(phpfpm_listen_queue)",
              0, "gt",
              "Seit 5 min warten Anfragen auf einen freien PHP-FPM-Worker – pm.max_children zu knapp? (Dashboard PHP-FPM)",
              "phpfpm_listen_queue",
          ),
          # Trivy (common_trivy). No rule on the findings themselves - the
          # scan mails new ones once; these two say the scan is broken.
          # Hosts without Trivy have no such series -> no data -> OK.
          make_rule(
              "alert-trivy-stale",
              "Trivy-Scan veraltet",
              "time() - max(trivy_last_run_timestamp_seconds)",
              129600, "gt",
              "Der nächtliche Trivy-Scan ist seit über 36 h nicht gelaufen (systemctl status trivy-scan).",
              "trivy_age_s",
          ),
          make_rule(
              "alert-trivy-failed",
              "Trivy-Scan fehlgeschlagen",
              'min({__name__=~"trivy_image_scan_ok|trivy_db_update_ok"})',
              1, "lt",
              "Trivy konnte die Datenbank nicht laden oder ein Image nicht scannen (journalctl -u trivy-scan).",
              "trivy_ok",
          ),
      ]

      for rule in rules:
          uid = rule["uid"]
          # Prüfen ob Regel schon existiert
          try:
              existing = api(f"/api/v1/provisioning/alert-rules/{uid}")
              # Update
              result = api(f"/api/v1/provisioning/alert-rules/{uid}", method="PUT", body=rule)
              print(f"  updated: {rule['title']}")
          except Exception:
              # Neu anlegen
              result = api("/api/v1/provisioning/alert-rules", method="POST", body=rule)
              print(f"  created: {rule['title']}")

      print("Fertig.")

# changed_when: false - the script rewrites all rules every run and
# cannot tell "same" from "different", so reporting "changed" would be
# noise on every run.
- name: Grafana | Apply alert rules
  ansible.builtin.command: python3 /usr/local/libexec/grafana/gf_alerts.py
  environment:
    GF_USER:  "{{ grafana_basic_auth_user }}"
    GF_PASS:  "{{ grafana_admin_pass }}"
    GF_EMAIL: "{{ email }}"
  changed_when: false
  no_log: true

# Kept in /usr/local/libexec/grafana (no secrets in it - they come via environment), so it is
# only rewritten when its content changes instead of on every run.

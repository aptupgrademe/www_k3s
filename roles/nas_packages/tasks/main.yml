---
# =============================================================================
# Role: nas_packages
# Purpose: Install OpenZFS, Samba and Jenkins on Debian 13 (Trixie).
# =============================================================================

- name: Packages | Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# --- HPE Agentless Management Service (AMSD) ---
# Required for HP servers to expose hardware data to iLO.
# Installed first so hardware monitoring is active during the rest of setup.
- name: Packages | Check if amsd is already installed
  ansible.builtin.command: dpkg-query -W -f='${Version}' amsd
  register: _amsd_installed
  changed_when: false
  failed_when: false

- name: Packages | Copy amsd .deb to server
  ansible.builtin.copy:
    src: amsd_3.6.0-1867-debian12_amd64.deb
    dest: /tmp/amsd_3.6.0-1867-debian12_amd64.deb
    owner: root
    group: root
    mode: "0644"
  when: _amsd_installed.rc != 0

- name: Packages | Install amsd (HPE Agentless Management Service)
  ansible.builtin.apt:
    deb: /tmp/amsd_3.6.0-1867-debian12_amd64.deb
    state: present
  when: _amsd_installed.rc != 0

- name: Packages | Remove amsd .deb from /tmp
  ansible.builtin.file:
    path: /tmp/amsd_3.6.0-1867-debian12_amd64.deb
    state: absent
  when: _amsd_installed.rc != 0

# --- OpenZFS ---
- name: Packages | Install OpenZFS
  ansible.builtin.apt:
    name:
      - zfsutils-linux
      - zfs-dkms
    state: present

# --- Samba ---
- name: Packages | Install Samba
  ansible.builtin.apt:
    name:
      - samba
      - samba-common-bin
    state: present

# --- Java (Jenkins dependency) ---
- name: Packages | Install Java 21 (Jenkins runtime)
  ansible.builtin.apt:
    name: openjdk-21-jre-headless
    state: present

# --- Jenkins ---
- name: Packages | Add Jenkins apt key
  ansible.builtin.apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    state: present

- name: Packages | Add Jenkins apt repository
  ansible.builtin.apt_repository:
    repo: "deb https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Packages | Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

# --- Utilities ---
- name: Packages | Install useful utilities
  ansible.builtin.apt:
    name:
      - rsync
      - rdiff-backup
      - tmux
      - htop
      - smartmontools
      - mailutils
    state: present

---
# =============================================================================
# Role: nas_gitlab
# Purpose: Install and configure GitLab CE on Debian 13.
#
# Extracted from hp1 (192.168.10.50):
#   Version:      GitLab CE 19.1.1
#   External URL: http://192.168.10.50
#   Repos:        www_k3s (private)
#   Prometheus:   disabled (using external Prometheus stack)
# =============================================================================

# --- Dependencies ---
- name: GitLab | Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
      - perl
    state: present
    update_cache: true

# --- GitLab package repository ---
- name: GitLab | Add GitLab CE apt repository
  ansible.builtin.shell: |
    curl -sS https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | bash
  args:
    creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list
  changed_when: true

# --- Install GitLab CE ---
- name: GitLab | Install gitlab-ce
  ansible.builtin.apt:
    name: "gitlab-ce{{ ('=' + nas_gitlab_version) if nas_gitlab_version is defined else '' }}"
    state: "{{ 'present' if nas_gitlab_version is defined else 'latest' }}"
    update_cache: true
  environment:
    EXTERNAL_URL: "{{ nas_gitlab_external_url }}"

# --- Configuration ---
- name: GitLab | Deploy gitlab.rb
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: reconfigure gitlab

# --- Ensure service is running ---
- name: GitLab | Ensure GitLab services are running
  ansible.builtin.command: gitlab-ctl status
  register: _gitlab_status
  changed_when: false
  failed_when: false

- name: GitLab | Start GitLab if not running
  ansible.builtin.command: gitlab-ctl start
  when: "'down:' in (_gitlab_status.stdout | default(''))"
  changed_when: true

# --- Wait for GitLab to be ready (first start takes a while) ---
- name: GitLab | Wait for web interface to respond
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/users/sign_in"
    status_code: 200
    timeout: 10
  register: _gitlab_ready
  retries: 30
  delay: 10
  until: _gitlab_ready.status == 200
  failed_when: false

# =============================================================================
# Initial setup (idempotent – skipped if already configured)
# =============================================================================

# --- Set root password ---
- name: GitLab | Set root password
  ansible.builtin.command: >
    gitlab-rails runner "
      u = User.find_by(username: 'root');
      u.password = '{{ nas_gitlab_root_password }}';
      u.password_confirmation = '{{ nas_gitlab_root_password }}';
      u.password_automatically_set = false;
      u.save!
    "
  no_log: true
  changed_when: true
  when: nas_gitlab_root_password is defined

# --- Get root API token ---
- name: GitLab | Create root personal access token
  ansible.builtin.command: >
    gitlab-rails runner "
      t = User.find_by(username: 'root').personal_access_tokens
             .find_or_initialize_by(name: 'ansible-setup');
      t.scopes = ['api'];
      t.expires_at = nil;
      t.save!;
      puts t.token
    "
  register: _gitlab_token
  changed_when: false
  no_log: true

- name: GitLab | Store root token as fact
  ansible.builtin.set_fact:
    _gl_token: "{{ _gitlab_token.stdout | trim }}"
  no_log: true

# --- Create user raphael ---
- name: GitLab | Check if user raphael exists
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/users?username=raphael"
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    status_code: 200
  register: _gl_raphael
  failed_when: false

- name: GitLab | Create user raphael
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/users"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    body_format: json
    body:
      name:                 "Raphael"
      username:             "raphael"
      email:                "{{ email | default('raphael@localhost') }}"
      password:             "{{ nas_gitlab_raphael_password }}"
      skip_confirmation:    true
      admin:                false
    status_code: [200, 201]
  no_log: true
  when: (_gl_raphael.json | default([])) | length == 0

# --- Create group homelab ---
- name: GitLab | Check if group homelab exists
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/groups?search=homelab"
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    status_code: 200
  register: _gl_group
  failed_when: false

- name: GitLab | Create group homelab
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/groups"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    body_format: json
    body:
      name:       "homelab"
      path:       "homelab"
      visibility: "private"
    status_code: [200, 201]
  register: _gl_new_group
  when: (_gl_group.json | default([])) | length == 0

- name: GitLab | Store group ID
  ansible.builtin.set_fact:
    _gl_group_id: >-
      {{
        (_gl_new_group.json.id | default(None))
        or
        ((_gl_group.json | default([{}]))[0].id | default(None))
      }}

# --- Create project www_k3s under homelab ---
- name: GitLab | Check if project homelab/www_k3s exists
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/projects?search=www_k3s"
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    status_code: 200
  register: _gl_project
  failed_when: false

- name: GitLab | Create project www_k3s under homelab
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    body_format: json
    body:
      name:        "www_k3s"
      path:        "www_k3s"
      namespace_id: "{{ _gl_group_id }}"
      visibility:  "private"
      initialize_with_readme: false
    status_code: [200, 201]
  when: >
    _gl_group_id is defined and _gl_group_id and
    ((_gl_project.json | default([])) | selectattr('path_with_namespace', 'equalto', 'homelab/www_k3s') | list) | length == 0

# --- Add raphael as maintainer to homelab group ---
- name: GitLab | Get raphael user ID
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/users?username=raphael"
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    status_code: 200
  register: _gl_raphael_id
  failed_when: false

- name: GitLab | Add raphael to homelab group as Maintainer
  ansible.builtin.uri:
    url: "{{ nas_gitlab_external_url }}/api/v4/groups/{{ _gl_group_id }}/members"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ _gl_token }}"
    body_format: json
    body:
      user_id:      "{{ (_gl_raphael_id.json | default([{}]))[0].id }}"
      access_level: 40   # Maintainer
    status_code: [200, 201, 409]   # 409 = already member
  when: >
    _gl_group_id is defined and _gl_group_id and
    (_gl_raphael_id.json | default([])) | length > 0

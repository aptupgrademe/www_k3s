---
# =============================================================================
# Role: common_dnf_automatic
# Purpose: Install dnf-automatic and configure it to apply security patches
#          automatically once a day. Non-security updates remain manual.
# =============================================================================

- name: dnf-automatic | Install package
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

# Provides `needs-restarting`, used during manual full-system updates
# to check whether a reboot is required (see docs/*-betrieb.html).
- name: dnf-automatic | Install dnf-utils (needs-restarting)
  ansible.builtin.dnf:
    name: dnf-utils
    state: present

# upgrade_type = security  → only apply packages tagged as security fixes
- name: dnf-automatic | Set upgrade_type to security
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^upgrade_type\s*='
    line: "upgrade_type = security"

# apply_updates = yes  → actually install (not just download and notify)
- name: dnf-automatic | Enable automatic application of updates
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^apply_updates\s*='
    line: "apply_updates = yes"

# The timer fires once a day (at a random offset within an hour)
- name: dnf-automatic | Enable and start install timer
  ansible.builtin.systemd:
    name: dnf-automatic-install.timer
    enabled: true
    state: started
    daemon_reload: true


# -----------------------------------------------------------------------------
# Reboot-required notification
# dnf-automatic silently installs security updates (including the kernel) in
# the background – nothing previously surfaced whether a reboot became
# necessary. needs-restarting -r exits non-zero when one is pending; mail the
# same address rkhunter already reports to, via the existing msmtp relay
# (common_msmtp). Runs at 06:00, safely after dnf-automatic's own randomized
# once-a-day window.
# -----------------------------------------------------------------------------
- name: dnf-automatic | Configure daily reboot-required check
  ansible.builtin.cron:
    name: "reboot-required check"
    hour: "6"
    minute: "0"
    job: >-
      OUT=$(/usr/bin/needs-restarting -r 2>&1);
      [ $? -ne 0 ] && echo "$OUT" | /usr/bin/mail -s "[$(hostname -f)] Reboot required after security update" {{ dnf_automatic_reboot_mail }}
    user: root

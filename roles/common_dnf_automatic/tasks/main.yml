---
# =============================================================================
# Role: common_dnf_automatic
# Purpose: Install dnf-automatic and configure it to apply security patches
#          automatically once a day. Non-security updates remain manual.
# =============================================================================

- name: dnf-automatic | Install package
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

# Provides `needs-restarting`, used during manual full-system updates
# to check whether a reboot is required (see docs/*-betrieb.html).
- name: dnf-automatic | Install dnf-utils (needs-restarting)
  ansible.builtin.dnf:
    name: dnf-utils
    state: present

# upgrade_type = security  → only apply packages tagged as security fixes
- name: dnf-automatic | Set upgrade_type to security
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^upgrade_type\s*='
    line: "upgrade_type = security"

# apply_updates = yes  → actually install (not just download and notify)
- name: dnf-automatic | Enable automatic application of updates
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^apply_updates\s*='
    line: "apply_updates = yes"

# The timer fires once a day (at a random offset within an hour)
- name: dnf-automatic | Enable and start install timer
  ansible.builtin.systemd:
    name: dnf-automatic-install.timer
    enabled: true
    state: started
    daemon_reload: true


# -----------------------------------------------------------------------------
# Automatic reboot after security update
# dnf-automatic silently installs security updates (including the kernel) in
# the background during its once-a-day window (00:00-01:00, see the timer's
# own randomized delay). A pending reboot leaves a patched kernel/glibc/
# systemd unused until the box actually restarts, so reboot automatically at
# 03:30 - safely after the install window, in the least busy hour - if one is
# genuinely pending. Mail is sent first so there's a record of why the box
# went down, via the existing msmtp relay (common_msmtp), same address
# rkhunter already reports to.
# -----------------------------------------------------------------------------
- name: dnf-automatic | Configure nightly automatic reboot if required
  ansible.builtin.cron:
    name: "automatic reboot after security update"
    hour: "3"
    minute: "30"
    job: >-
      OUT=$(/usr/bin/needs-restarting -r 2>&1);
      [ $? -ne 0 ] && { echo "$OUT" | /usr/bin/mail -s "[$(hostname -f)] Rebooting now after security update" {{ dnf_automatic_reboot_mail }}; /usr/sbin/shutdown -r now; }
    user: root

# -----------------------------------------------------------------------------
# Reboot-required check (safety net)
# Runs at 06:00, after the 03:30 job above should already have rebooted the
# box if needed. If a reboot is STILL pending at this point, the automatic
# reboot failed or was blocked - mail so that doesn't go unnoticed.
# -----------------------------------------------------------------------------
- name: dnf-automatic | Configure daily reboot-required check
  ansible.builtin.cron:
    name: "reboot-required check"
    hour: "6"
    minute: "0"
    job: >-
      OUT=$(/usr/bin/needs-restarting -r 2>&1);
      [ $? -ne 0 ] && echo "$OUT" | /usr/bin/mail -s "[$(hostname -f)] WARNING: reboot still required after automatic reboot attempt" {{ dnf_automatic_reboot_mail }}
    user: root

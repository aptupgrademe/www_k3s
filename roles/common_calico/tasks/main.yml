---
# =============================================================================
# Role: common_calico  -  REMOVES Calico (since 2026-10-19)
# Purpose: Calico ran here in "policy-only" mode next to K3s's Flannel and was
#          meant to enforce the NetworkPolicies. It never did: Felix only
#          programs policy for pod interfaces named cali*, which Calico's own
#          CNI plugin creates; K3s's Flannel names them veth*, so none of its
#          ~300 rules ever matched a pod. The NetworkPolicies are enforced by
#          K3s's embedded policy controller (kube-router), which runs by
#          default - verified 2026-10-19: with that controller switched off a
#          pod in "default" reached MariaDB:3306, with it on the connection is
#          blocked, with or without Calico.
#          This role deletes the Calico objects from the cluster and then what
#          Felix leaves on the host (it does not clean up after itself). Once
#          no host has Calico any more, the role, its template and
#          scripts/calico-derive-manifest.py can be deleted.
# Target:  both stacks (blog.yml, nextcloud-k3s.yml)
# =============================================================================
#
# The K8s apply pattern (explained in common_k3s/tasks/main.yml) with
# state: absent: the same template that once installed Calico names every
# object to delete (DaemonSet, Deployment, RBAC, 23 CRDs - deleting a CRD
# deletes its objects too). An object that is already gone counts as ok.

- name: Calico | Delete the Calico objects from the cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: absent
    definition: "{{ item }}"
    wait: true
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'calico-policy-only.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: calico_delete

# Felix must be gone before its rules are removed, or it writes them back.
- name: Calico | Wait until no calico-node pod is left
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig }}"
    kind: Pod
    namespace: kube-system
    label_selectors: [k8s-app=calico-node]
  register: calico_pods
  until: ansible_check_mode or calico_pods.resources | length == 0
  retries: 30
  delay: 5
  check_mode: false   # read-only query, also runs in --check

# files/calico-cleanup.sh: rules in the built-in chains with a "cali:"
# comment, the cali-* chains, cali* ipsets, the nft table arp calico-arp and
# /var/lib/calico, /var/run/calico. It prints a line per removed object, so
# an empty output means "nothing left" (changed: false).
- name: Calico | Remove what Felix left on the host (rules, ipsets, state dirs)
  ansible.builtin.script: calico-cleanup.sh
  register: calico_cleanup
  changed_when: calico_cleanup.stdout | trim | length > 0

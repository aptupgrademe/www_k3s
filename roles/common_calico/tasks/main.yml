---
# =============================================================================
# Role: common_calico
# Purpose: Install Calico in "policy-only" mode – Felix + kube-controllers
#          only, reading Pod/NetworkPolicy objects straight from the
#          Kubernetes API (DATASTORE_TYPE=kubernetes,
#          CALICO_NETWORKING_BACKEND=none, no BGP, no IPAM, no CNI plugin
#          install). K3s's built-in Flannel keeps doing all pod networking –
#          this only adds the NetworkPolicy *enforcement* Flannel alone
#          silently ignores (empirically verified on the test host: a
#          deny-all NetworkPolicy had zero effect until Calico was
#          installed, and worked immediately afterwards).
#
#          The template is GENERATED from the official Canal manifest
#          (Calico for policy + Flannel for networking) by
#          scripts/calico-derive-manifest.py <calico_version>: it strips the
#          CNI init containers, the kube-flannel container and the
#          canal-config CNI/flannel settings – K3s's own embedded Flannel
#          already does that job. Never hand-edit the template; change the
#          script and re-run it (since 2026-10-19, Calico v3.33.0).
#
#          The calico-node RBAC intentionally mirrors upstream's full
#          calico-node ClusterRole rather than a hand-trimmed subset:
#          calico-node runs several internal loops (CNI-kubeconfig token
#          maintenance, tunnel-IP release, KubeVirt migration watch)
#          unconditionally regardless of CALICO_NETWORKING_BACKEND – they
#          don't skip themselves gracefully without these permissions, they
#          fail loudly and leave the pod stuck at 0/1 Ready forever (verified
#          live: missing any one of serviceaccounts/token, ipamhandles or the
#          kubevirt watch reproduced this).
# Target:  K3s single-node on AlmaLinux 9 (Nextcloud and blog – see
#          nextcloud-k3s.yml and blog.yml)
# =============================================================================
#
# THE K8S APPLY PATTERN - used by 26 tasks in this repo, explained once here:
#
#   - name: ... | Apply <something>
#     kubernetes.core.k8s:
#       kubeconfig: "{{ k3s_kubeconfig }}"
#       state: present
#       apply: true
#       definition: "{{ item }}"
#     loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
#     vars:
#       k8s_objects: "{{ lookup('ansible.builtin.template', 'x.yml.j2')
#                        | ansible.builtin.from_yaml_all | select | list }}"
#
# Read it from the inside out:
#   lookup('template', ...)  renders the Jinja template ON THE CONTROLLER
#                  into a string (no file is copied to the server)
#   from_yaml_all  parses a multi-document YAML string ("---" separated)
#                  into a list of objects (dicts)
#   select         drops empty documents (e.g. a trailing "---")
#   kubernetes.core.k8s  talks to the Kubernetes API directly - no kubectl,
#                  no temp file. state: present + apply: true behaves like
#                  "kubectl apply": it creates missing objects, updates
#                  changed ones, and reports "changed" ONLY when the live
#                  object really differs (idempotent).
#   loop ... if ansible_diff_mode  with --diff the loop runs once per
#                  object, so the diff shows each object separately;
#                  otherwise one loop item holds the whole list -> a single
#                  module call for all objects (faster).
#   loop_control.label  shows "Kind/name" per item, or "N objects".
# "vars:" on a task defines variables for that task only.
#
# Waiting afterwards: "kubectl rollout status" blocks until a DaemonSet or
# Deployment runs its new pods; it only runs "when: calico_apply.changed",
# so an unchanged run does not wait at all.

- name: Calico | Apply policy-only manifest
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 34), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'calico-policy-only.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: calico_apply

- name: Calico | Wait for calico-node DaemonSet to be ready (up to 3 min)
  ansible.builtin.command: >
    k3s kubectl -n kube-system rollout status daemonset/calico-node
    --timeout=180s
  changed_when: false
  when: calico_apply.changed

- name: Calico | Wait for kube-controllers Deployment to be ready (up to 2 min)
  ansible.builtin.command: >
    k3s kubectl -n kube-system rollout status deployment/calico-kube-controllers
    --timeout=120s
  changed_when: false
  when: calico_apply.changed

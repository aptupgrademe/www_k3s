---
# =============================================================================
# Role: common_prometheus
# Purpose: Install Prometheus on AlmaLinux 9.
#          Binds to 127.0.0.1:9090 – only accessible from localhost.
#          Scrapes the local Node Exporter (127.0.0.1:9100).
#          Grafana (common_grafana) uses this as its data source.
# =============================================================================
#
# How it works (top to bottom):
#   1. system user + directories      Prometheus must not run as root
#   2. binary                         download the pinned release from
#                                     GitHub only if the installed version
#                                     differs, unpack, copy into
#                                     /usr/local/bin
#   3. configuration                  prometheus.yml (scrape targets) and
#                                     alert rules from Jinja templates
#   4. systemd unit + hardening       the service definition plus a drop-in
#                                     that locks the process down
# Every task that changes something Prometheus reads "notifies" the
# handler "restart prometheus" (handlers/main.yml). Handlers run once at
# the end of the play, no matter how many tasks notified them - so a new
# binary plus a new config still means a single restart.
#
# Ansible concepts used here:
#   register + when    a task's result is stored (register) and a later
#                      task decides on it (when)
#   loop               one task, run once per list item ("{{ item }}")
#   notify / handlers  "restart only if something changed"
#   check_mode: false  lets a read-only task run in --check too, so later
#                      tasks can make the same decisions as in a real run
#   ansible_check_mode built-in variable, true during --check
#   template vs copy   template renders Jinja ({{ ... }}) first, copy writes
#                      the file as it is
#
# Versions: prometheus_version comes from
# inventory/group_vars/all/versions.yml, prometheus_retention from
# defaults/main.yml (the lowest-priority place for a role's variables -
# any inventory value overrides it).


# system: true = a low UID without password aging; nologin + no home dir
# because nobody ever logs in as this user, it only owns the process
# and its data.
# -----------------------------------------------------------------------------
# System user and directories
# -----------------------------------------------------------------------------
- name: Prometheus | Create system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /sbin/nologin
    home: /var/lib/prometheus
    create_home: false

# state: directory creates the path if missing and otherwise only fixes
# owner/mode. /var/lib/prometheus holds the time-series database (TSDB).
- name: Prometheus | Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus


# Prints e.g. "prometheus, version 3.15.0 (branch: ...)"; awk keeps the
# third word. set -o pipefail: without it the shell would report the exit
# code of awk only, never a failing prometheus binary.
# -----------------------------------------------------------------------------
# Binary installation
# -----------------------------------------------------------------------------
# Download/extract/install only when the installed binary is not the pinned
# version: the archive lives in /tmp, which a reboot empties - before, every
# run after a reboot downloaded it again and reported "changed" although the
# right version was already installed.
- name: Prometheus | Installed version
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/prometheus --version 2>&1 | head -1 | awk '{print $3}'
  register: prometheus_installed_version
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false  # not installed yet -> empty, so it gets installed

# get_url downloads to the server itself (not to the controller). The
# URL is split over three lines with a trailing backslash: in a YAML
# double-quoted string that joins the lines without spaces.
- name: Prometheus | Download archive
  when: (prometheus_installed_version.stdout | trim) != prometheus_version
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/\
          v{{ prometheus_version }}/\
          prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"

# remote_src: true = the archive is already on the server (default would
# be: copy it from the controller). creates: skips the task if that file
# already exists, e.g. after an interrupted run.
- name: Prometheus | Extract archive
  when:
    - (prometheus_installed_version.stdout | trim) != prometheus_version
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

# Copies prometheus + promtool (config checker) out of the unpacked
# folder. Only this task notifies the restart - the download alone does
# not change the running service.
- name: Prometheus | Install binaries
  when:
    - (prometheus_installed_version.stdout | trim) != prometheus_version
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify: restart prometheus


# templates/prometheus.yml.j2 decides per host type which exporters are
# scraped (node exporter everywhere, MariaDB/PHP-FPM exporters per
# stack); the result is plain YAML for Prometheus.
# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
- name: Prometheus | Deploy configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: Prometheus | Deploy alert rules
  ansible.builtin.template:
    src: alert.rules.yml.j2
    dest: /etc/prometheus/alert.rules.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus


# The unit file is written inline (content:) so the ExecStart flags sit
# next to the variables they use. --web.listen-address=127.0.0.1 keeps
# the web UI/API off the network; Grafana on the same host reaches it
# locally. Two handlers are notified in order: systemd must re-read the
# unit before the restart can use it.
# -----------------------------------------------------------------------------
# Systemd service
# -----------------------------------------------------------------------------
- name: Prometheus | Install systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Monitoring System
      After=network.target

      [Service]
      User=prometheus
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --storage.tsdb.retention.time={{ prometheus_retention }} \
        --web.listen-address=127.0.0.1:9090
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart prometheus

# A drop-in (*.conf in <unit>.service.d/) adds settings to a unit without
# editing the unit file itself.
- name: Prometheus | Ensure prometheus.service.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# systemd sandboxing: read-only OS (ProtectSystem=strict) except the data
# directory (ReadWritePaths), no home directories, no new privileges, no
# Linux capabilities at all (empty CapabilityBoundingSet), only IP
# sockets. "systemd-analyze security prometheus" shows the resulting
# exposure score.
- name: Prometheus | Deploy systemd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      PrivateTmp=yes
      ProtectHome=yes
      ProtectSystem=strict
      NoNewPrivileges=yes
      CapabilityBoundingSet=
      ReadWritePaths=/var/lib/prometheus
      RestrictAddressFamilies=AF_INET AF_INET6
      RestrictRealtime=yes
      RestrictSUIDSGID=yes
      LockPersonality=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      SystemCallArchitectures=native
  notify:
    - reload systemd
    - restart prometheus

# enabled = start at boot, started = make sure it runs now. This task
# does not restart a running service - that is the handler's job, and
# only when something changed. daemon_reload covers the first run, where
# the unit was just written.
- name: Prometheus | Enable and start service
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

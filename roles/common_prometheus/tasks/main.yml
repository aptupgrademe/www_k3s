---
# =============================================================================
# Role: common_prometheus
# Purpose: Install Prometheus on AlmaLinux 9.
#          Binds to 127.0.0.1:9090 – only accessible from localhost.
#          Scrapes the local Node Exporter (127.0.0.1:9100).
#          Grafana (common_grafana) uses this as its data source.
# =============================================================================


# -----------------------------------------------------------------------------
# System user and directories
# -----------------------------------------------------------------------------
- name: Prometheus | Create system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /sbin/nologin
    home: /var/lib/prometheus
    create_home: false

- name: Prometheus | Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus


# -----------------------------------------------------------------------------
# Binary installation
# -----------------------------------------------------------------------------
- name: Prometheus | Download archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/\
          v{{ prometheus_version }}/\
          prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"

- name: Prometheus | Extract archive
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

- name: Prometheus | Install binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify: restart prometheus


# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
- name: Prometheus | Deploy configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: Prometheus | Deploy alert rules
  ansible.builtin.template:
    src: alert.rules.yml.j2
    dest: /etc/prometheus/alert.rules.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus


# -----------------------------------------------------------------------------
# Systemd service
# -----------------------------------------------------------------------------
- name: Prometheus | Install systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Monitoring System
      After=network.target

      [Service]
      User=prometheus
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --storage.tsdb.retention.time={{ prometheus_retention }} \
        --web.listen-address=127.0.0.1:9090
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart prometheus

- name: Prometheus | Deploy systemd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      PrivateTmp=yes
      ProtectHome=yes
      ProtectSystem=strict
      NoNewPrivileges=yes
      CapabilityBoundingSet=
      ReadWritePaths=/var/lib/prometheus
      RestrictAddressFamilies=AF_INET AF_INET6
      RestrictRealtime=yes
      RestrictSUIDSGID=yes
      LockPersonality=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      SystemCallArchitectures=native
  notify:
    - reload systemd
    - restart prometheus

- name: Prometheus | Enable and start service
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

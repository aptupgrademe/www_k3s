---
# =============================================================================
# Role: blog_packages (K3s-only mode)
# Purpose: Minimal host-level packages for the blog server.
#          All application services (MariaDB, WordPress, Nginx) run inside K3s.
#          Only nftables and SSH remain on the host.
#
#          All packages below are available in the default AlmaLinux 9
#          BaseOS/AppStream repos – no EPEL or CRB needed.
# =============================================================================


# -----------------------------------------------------------------------------
# EPEL  (fail2ban lives here)
# -----------------------------------------------------------------------------
- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present


# -----------------------------------------------------------------------------
# System update
# -----------------------------------------------------------------------------
# Kernel packages are excluded: sshd's systemd hardening drop-in
# (common_ssh, ProtectKernelModules=yes) puts every SSH session — including
# Ansible's own connection — into a private mount namespace where
# /usr/lib/modules is masked as an empty read-only tmpfs. Installing a new
# kernel there always fails. Security kernel updates still land via
# dnf-automatic (common_dnf_automatic), which runs locally via a systemd
# timer, outside the SSH session and thus unaffected by that sandboxing.
- name: Upgrade all system packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
    exclude: kernel*


# -----------------------------------------------------------------------------
# Package installation
# -----------------------------------------------------------------------------
- name: Install host packages
  ansible.builtin.dnf:
    name:
      # --- Firewall ---
      - nftables

      # --- SELinux tooling ---
      - policycoreutils
      - policycoreutils-python-utils
      - selinux-policy-targeted
      - container-selinux        # K3s container SELinux policy (AppStream)

      # --- Utilities ---
      - curl
      - tar
      - git
      - cronie                # required for rkhunter daily cron job
      - nano
    state: present


# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
- name: Disable and stop firewalld (we use nftables via systemd)
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  failed_when: false

- name: Mask firewalld (prevents it from being started by other services)
  ansible.builtin.systemd:
    name: firewalld
    masked: true
  failed_when: false

- name: Disable unnecessary NFS/RPC/LDAP services (not needed on this host)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - rpcbind
    - rpcbind.socket
    - sssd
    - sssd-kcm.socket
  failed_when: false

- name: Mask gssproxy (starts via socket activation despite disabled state)
  ansible.builtin.systemd:
    name: gssproxy
    masked: true
    state: stopped
  failed_when: false

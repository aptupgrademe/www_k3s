---
# =============================================================================
# Role: blog_packages (K3s-only mode)
# Purpose: Minimal host-level packages for the blog server.
#          All application services (MariaDB, WordPress, Nginx) run inside K3s.
#          Only nftables and SSH remain on the host.
#
#          All packages below are available in the default AlmaLinux 9
#          BaseOS/AppStream repos – no EPEL or CRB needed.
# =============================================================================


# -----------------------------------------------------------------------------
# EPEL  (fail2ban lives here)
# -----------------------------------------------------------------------------
- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present


# -----------------------------------------------------------------------------
# System update
# -----------------------------------------------------------------------------
# Kernel packages are excluded: sshd's systemd hardening drop-in
# (common_ssh, ProtectKernelModules=yes) puts every SSH session — including
# Ansible's own connection — into a private mount namespace where
# /usr/lib/modules is masked as an empty read-only tmpfs. Installing a new
# kernel there always fails. Security kernel updates still land via
# dnf-automatic (common_dnf_automatic), which runs locally via a systemd
# timer, outside the SSH session and thus unaffected by that sandboxing.
- name: Upgrade all system packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
    exclude: kernel*


# -----------------------------------------------------------------------------
# Reboot if the running kernel's module directory is genuinely gone
# -----------------------------------------------------------------------------
# Cloud images occasionally already have a newer kernel installed (by the
# provider's first-boot update or a prior dnf-automatic run) before Ansible
# ever connects, while still running the old, now-unpacked kernel. Any task
# that reads /lib/modules/<running kernel> (e.g. common_sysctl's modprobe for
# tcp_bbr) then fails with a confusing "No such file or directory" instead of
# a clear "reboot needed" message.
#
# Must check via systemd-run, NOT ansible.builtin.stat directly: once
# common_ssh's hardening drop-in (ProtectKernelModules=yes) is active – which
# it already is on any host that completed a common_ssh run before, including
# earlier partial runs of this same play – /lib/modules is masked empty
# inside the SSH session's own private mount namespace. A plain stat here
# would see that mask and wrongly conclude a reboot is needed even when the
# real kernel modules are perfectly fine. systemd-run escapes that sandbox.
- name: Check whether the running kernel's module directory still exists
  ansible.builtin.command: >-
    systemd-run --wait --pipe --quiet --
    test -d /lib/modules/{{ ansible_kernel }}
  register: running_kernel_modules
  changed_when: false
  failed_when: false

- name: Reboot – running kernel's modules are gone, a newer kernel is already installed
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: running_kernel_modules.rc != 0


# -----------------------------------------------------------------------------
# Package installation
# -----------------------------------------------------------------------------
- name: Install host packages
  ansible.builtin.dnf:
    name:
      # --- Firewall ---
      - nftables

      # --- SELinux tooling ---
      - policycoreutils
      - policycoreutils-python-utils
      - selinux-policy-targeted
      - container-selinux        # K3s container SELinux policy (AppStream)

      # --- Utilities ---
      - curl
      - tar
      - git
      - cronie                # required for rkhunter daily cron job
      - nano
      - tmux

      # --- Performance/troubleshooting diagnostics ---
      - htop
      - sysstat                # iostat, mpstat, sar
      - strace
    state: present


# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
- name: Disable and stop firewalld (we use nftables via systemd)
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  failed_when: false

- name: Mask firewalld (prevents it from being started by other services)
  ansible.builtin.systemd:
    name: firewalld
    masked: true
  failed_when: false

- name: Disable unnecessary NFS/RPC/LDAP services (not needed on this host)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - rpcbind
    - rpcbind.socket
    - sssd
    - sssd-kcm.socket
  failed_when: false

- name: Mask gssproxy (starts via socket activation despite disabled state)
  ansible.builtin.systemd:
    name: gssproxy
    masked: true
    state: stopped
  failed_when: false

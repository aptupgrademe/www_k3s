---
# =============================================================================
# Role: blog_packages (K3s-only mode)
# Purpose: Minimal host-level packages for the blog server.
#          The application (MariaDB, WordPress, nginx, Redis) runs inside
#          K3s. On the host itself run only infrastructure services: SSH,
#          nftables, fail2ban, auditd, monitoring (node_exporter,
#          Prometheus, Grafana, Monit), ClamAV/rkhunter/AIDE - installed by
#          their own roles; this role adds the base packages.
#
#          The packages in "Install host packages" come from the default
#          AlmaLinux 9 BaseOS/AppStream repos. EPEL is enabled here anyway
#          because later roles need it (fail2ban, Monit, rkhunter).
# =============================================================================
#
# How it works (in this order, which matters):
#   1. hostname + /etc/hosts      so mails show which server sent them
#   2. EPEL, then "dnf upgrade" of everything except the kernel
#   3. reboot if needed - two checks, see the comments
#   4. base packages, then switch off services this host does not use
#
# Ansible concepts used here:
#   hostname module  sets the hostname persistently (hostnamectl)
#   dnf name: "*" state: latest  = full system update; "# noqa:
#                    package-latest" tells ansible-lint this one is wanted
#   reboot module    reboots, waits until SSH answers again, then the play
#                    simply continues with the next task
#   failed_when: false on optional services  "stop/disable/mask X" must
#                    not fail on a host where X is not installed
#   systemd masked: true  links the unit to /dev/null - it can then not be
#                    started at all, not even as a dependency of another unit


# -----------------------------------------------------------------------------
# Hostname
# Without this the system hostname stays "localhost" (cloud image default),
# which every $(hostname -f)-based mail subject (rkhunter, dnf-automatic
# reboot check, etc.) then shows verbatim – useless when several servers
# share the same alert setup, since you can't tell which one sent it.
# -----------------------------------------------------------------------------
- name: Packages | Set system hostname to the public FQDN
  ansible.builtin.hostname:
    name: "{{ blog_hostname }}"

- name: Packages | Ensure /etc/hosts has a matching entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1  {{ blog_hostname }}"


# -----------------------------------------------------------------------------
# EPEL  (fail2ban lives here)
# -----------------------------------------------------------------------------
- name: Packages | Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present


# -----------------------------------------------------------------------------
# System update
# -----------------------------------------------------------------------------
# Kernel packages are excluded: sshd's systemd hardening drop-in
# (common_ssh, ProtectKernelModules=yes) puts every SSH session — including
# Ansible's own connection — into a private mount namespace where
# /usr/lib/modules is masked as an empty read-only tmpfs. Installing a new
# kernel there always fails. Security kernel updates still land via
# dnf-automatic (common_dnf_automatic), which runs locally via a systemd
# timer, outside the SSH session and thus unaffected by that sandboxing.
- name: Packages | Upgrade all system packages  # noqa: package-latest - a full update is the point of this task
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
    exclude: kernel*


# -----------------------------------------------------------------------------
# Reboot if the running kernel's module directory is genuinely gone
# -----------------------------------------------------------------------------
# Cloud images occasionally already have a newer kernel installed (by the
# provider's first-boot update or a prior dnf-automatic run) before Ansible
# ever connects, while still running the old, now-unpacked kernel. Any task
# that reads /lib/modules/<running kernel> (e.g. common_sysctl's modprobe for
# tcp_bbr) then fails with a confusing "No such file or directory" instead of
# a clear "reboot needed" message.
#
# Must check via systemd-run, NOT ansible.builtin.stat directly: once
# common_ssh's hardening drop-in (ProtectKernelModules=yes) is active – which
# it already is on any host that completed a common_ssh run before, including
# earlier partial runs of this same play – /lib/modules is masked empty
# inside the SSH session's own private mount namespace. A plain stat here
# would see that mask and wrongly conclude a reboot is needed even when the
# real kernel modules are perfectly fine. systemd-run escapes that sandbox.
- name: Packages | Check whether the running kernel's module directory still exists
  ansible.builtin.command: >-
    systemd-run --wait --pipe --quiet --
    test -d /lib/modules/{{ ansible_facts['kernel'] }}
  register: running_kernel_modules
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Packages | Reboot – running kernel's modules are gone, a newer kernel is already installed
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: running_kernel_modules.rc != 0

# -----------------------------------------------------------------------------
# Broader reboot check (glibc, systemd, openssl, ...) via needs-restarting -r
# -----------------------------------------------------------------------------
# The module-directory check above only catches the kernel-already-replaced
# case. needs-restarting -r (yum-utils) additionally flags a pending reboot
# for security-relevant userspace updates from dnf-automatic (glibc, systemd,
# openssl, etc.) that don't touch /lib/modules at all. Runs via systemd-run
# for the same ProtectKernelModules-sandboxing reason as the check above.
- name: Packages | Ensure yum-utils is installed (needed for needs-restarting)
  ansible.builtin.dnf:
    name: yum-utils
    state: present

- name: Packages | Check whether a reboot is otherwise pending (needs-restarting -r)
  ansible.builtin.command: >-
    systemd-run --wait --pipe --quiet --
    needs-restarting -r
  register: needs_restarting
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

# needs-restarting -r exits 1 when a reboot is required, 0 when not.
- name: Packages | Reboot – needs-restarting reports a pending reboot
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: needs_restarting.rc == 1


# -----------------------------------------------------------------------------
# Package installation
# -----------------------------------------------------------------------------
- name: Packages | Install host packages
  ansible.builtin.dnf:
    name:
      # --- Firewall ---
      - nftables

      # --- SELinux tooling ---
      - policycoreutils
      - policycoreutils-python-utils
      - selinux-policy-targeted
      - container-selinux        # K3s container SELinux policy (AppStream)

      # --- Utilities ---
      - curl
      - tar
      - git
      - cronie                # required for rkhunter daily cron job
      - nano
      - tmux

      # --- Performance/troubleshooting diagnostics ---
      - htop
      - sysstat                # iostat, mpstat, sar
      - strace
    state: present


# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
- name: Packages | Disable and stop firewalld (we use nftables via systemd)
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  failed_when: false

- name: Packages | Mask firewalld (prevents it from being started by other services)
  ansible.builtin.systemd:
    name: firewalld
    masked: true
  failed_when: false

- name: Packages | Disable unnecessary NFS/RPC/LDAP services (not needed on this host)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - rpcbind
    - rpcbind.socket
    - sssd
    - sssd-kcm.socket
  failed_when: false

- name: Packages | Mask gssproxy (starts via socket activation despite disabled state)
  ansible.builtin.systemd:
    name: gssproxy
    masked: true
    state: stopped
  failed_when: false

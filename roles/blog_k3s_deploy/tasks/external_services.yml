---
# Deploy headless K8s Services + manually-managed Endpoints that point
# to MariaDB and Grafana running on the host.
# Pods can then reach them via DNS: mariadb.wordpress.svc.cluster.local

- name: ExtSvc | Apply external services
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 33), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'external-services.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: ext_svc_apply

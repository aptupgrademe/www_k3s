---
# Deploy the WordPress Deployment (wordpress:fpm + nginx sidecar) and
# the ClusterIP Service.

- name: WordPress | Apply WordPress Deployment + Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # One loop item per object in the template, so --diff shows each
  # object's change (with a list definition the module reports no diff).
  loop: "{{ lookup('ansible.builtin.template', 'wordpress-deployment.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: wp_apply

- name: WordPress | Wait for WordPress rollout to complete
  ansible.builtin.command: >
    k3s kubectl rollout status deployment/wordpress
    --namespace wordpress
    --timeout=300s
  changed_when: false

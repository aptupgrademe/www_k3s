---
# Deploy the WordPress Deployment (wordpress:fpm + nginx sidecar) and
# the ClusterIP Service.
#
# Uses THE K8S APPLY PATTERN (explained in common_calico/tasks/main.yml): the
# template is rendered on the controller, parsed into objects and applied via
# the API; "changed" only when a live object really differs.
# Then "kubectl rollout status" blocks until the new WordPress pod is Ready,
# so blog_wordpress (next role) can talk to it.

- name: WordPress | Apply WordPress Deployment + Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 33), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'wordpress-deployment.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: wp_apply

- name: WordPress | Wait for WordPress rollout to complete
  ansible.builtin.command: >
    k3s kubectl rollout status deployment/wordpress
    --namespace wordpress
    --timeout=300s
  changed_when: false

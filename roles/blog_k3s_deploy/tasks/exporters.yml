---
# =============================================================================
# WordPress exporter NodePort Services
# Exposes mysqld_exporter (mariadb pod) and php-fpm_exporter (wordpress pod)
# to host-side Prometheus via NodePort.
# =============================================================================

- name: Exporters | Template exporter NodePort services manifest
  ansible.builtin.template:
    src: exporters.yml.j2
    dest: /tmp/k8s-wp-exporters.yml
    mode: "0644"

- name: Exporters | Apply exporter NodePort services
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-wp-exporters.yml
  register: exporters_apply
  changed_when: "'created' in exporters_apply.stdout or 'configured' in exporters_apply.stdout"

- name: Exporters | Remove temporary exporters manifest
  ansible.builtin.file:
    path: /tmp/k8s-wp-exporters.yml
    state: absent

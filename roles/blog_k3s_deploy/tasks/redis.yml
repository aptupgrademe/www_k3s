---
# Deploy Redis as an in-memory object cache for WordPress.

- name: Redis | Apply Deployment + Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # One loop item per object in the template, so --diff shows each
  # object's change (with a list definition the module reports no diff).
  loop: "{{ lookup('ansible.builtin.template', 'redis-deployment.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: redis_apply

- name: Redis | Wait for Redis pod to be ready
  ansible.builtin.command: >
    k3s kubectl wait deployment/redis
    --namespace wordpress
    --for=condition=available
    --timeout=120s
  changed_when: false

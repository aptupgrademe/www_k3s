---
# Create HostPath directories on the host node.
# The K3s containerd runtime mounts these into the respective pods.
# SELinux context (container_file_t) is applied by role blog_selinux.

# Owner is www-data's uid (33), not root - matters because this task runs on
# every Ansible run, not just once. Each deployment's own init container
# also chowns this to 33:33 on pod creation, but that only happens once at
# pod start; every subsequent playbook run used to silently reset it back to
# root:root here, breaking any plugin/feature that writes to the web root
# directly rather than into wp-content (found live 2026-08-26 via
# TranslatePress failing to CREATE TABLE with a misleading "Permission
# denied" - root cause was this task overwriting the init container's
# correct ownership, not a database or SELinux problem). Same fix already
# applied to the Nextcloud config/data dirs in next_k3s_deploy/tasks/dirs.yml
# - this just extends it to the one directory that was missed there too.
- name: Ensure WordPress www HostPath directory exists
  ansible.builtin.file:
    path: "{{ blog_k3s_www_dir }}"
    state: directory
    owner: 33
    group: 33
    mode: "0755"

# Deploy PGP public key served at https://<blog_hostname>/publickey.asc.
# To update the key: edit roles/blog_k3s_deploy/files/publickey.asc and re-run the playbook.
- name: Deploy publickey.asc to WordPress document root
  ansible.builtin.copy:
    src: publickey.asc
    dest: "{{ blog_k3s_www_dir }}/publickey.asc"
    owner: root
    group: root
    mode: "0644"

# Owner is mysql's uid (999), same reasoning as the WordPress www dir above -
# this task re-running on every Ansible pass was silently undoing the
# mariadb init container's chown, leaving CREATE TABLE broken for any
# plugin/table created after the first deploy (found live 2026-08-26).
- name: Ensure MariaDB data HostPath directory exists
  ansible.builtin.file:
    path: "{{ blog_k3s_db_dir }}"
    state: directory
    owner: 999
    group: 999
    mode: "0750"

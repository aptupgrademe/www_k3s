---
# =============================================================================
# NetworkPolicy – WordPress/MariaDB/Redis ingress+egress restriction
# =============================================================================
# Requires Calico (common_calico) for enforcement – Flannel alone accepts
# but ignores NetworkPolicy objects, so applying this without common_calico
# would be a silent no-op, not a broken deploy.

- name: NetworkPolicy | Apply WordPress stack NetworkPolicy
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # One loop item per object in the template, so --diff shows each
  # object's change (with a list definition the module reports no diff).
  loop: "{{ lookup('ansible.builtin.template', 'networkpolicy.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: networkpolicy_apply

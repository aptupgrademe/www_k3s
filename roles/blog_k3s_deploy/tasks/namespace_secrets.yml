---
# =============================================================================
# WordPress namespace, Secret and nginx ConfigMap
# =============================================================================
# The namespace task uses failed_when to swallow the "already exists" error
# so the play stays idempotent on re-runs.

- name: Create wordpress namespace
  ansible.builtin.command: >
    k3s kubectl create namespace wordpress
  register: ns_create
  changed_when: ns_create.rc == 0
  failed_when: ns_create.rc != 0 and "already exists" not in ns_create.stderr

# CIS 5.2.1 (Pod Security Standards): warn/audit only, deliberately NOT
# enforce. Workloads here use HostPath volumes (RWO app/DB data dirs), which
# the "baseline" standard disallows - enforce would reject every future pod
# (including the every-5-min wordpress-cron CronJob and any deploy rollout).
# warn/audit surface the same violations without blocking anything.
- name: Label wordpress namespace with Pod Security Standards (warn/audit only)
  ansible.builtin.command: >
    k3s kubectl label namespace wordpress
    pod-security.kubernetes.io/warn=baseline
    pod-security.kubernetes.io/audit=baseline
    --overwrite
  register: ns_label
  changed_when: "'labeled' in ns_label.stdout"

# CIS 5.1.5/5.1.6: belt-and-suspenders alongside automountServiceAccountToken:
# false already set on every Pod template in this namespace - kube-bench's
# automated check looks at the ServiceAccount object itself, not just
# whether any Pod using it happens to override the setting.
- name: Disable SA token automount on the default ServiceAccount (CIS 5.1.5/5.1.6)
  ansible.builtin.command: >
    k3s kubectl patch serviceaccount default -n wordpress
    --patch "{\"automountServiceAccountToken\": false}"
  register: sa_patch
  changed_when: "'patched' in sa_patch.stdout"

# --- Secret ---
- name: Template WordPress Secret manifest
  ansible.builtin.template:
    src: secret.yml.j2
    dest: /tmp/k8s-wp-secret.yml
    mode: "0600"

- name: Apply WordPress Secret
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-wp-secret.yml
  register: secret_apply
  changed_when: "'created' in secret_apply.stdout or 'configured' in secret_apply.stdout"
  no_log: true

- name: Remove temporary Secret manifest
  ansible.builtin.file:
    path: /tmp/k8s-wp-secret.yml
    state: absent

# --- Nginx ConfigMap ---
- name: Template Nginx ConfigMap
  ansible.builtin.template:
    src: nginx-cm.yml.j2
    dest: /tmp/k8s-wp-nginx-cm.yml
    mode: "0644"

- name: Apply Nginx ConfigMap
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-wp-nginx-cm.yml
  register: cm_apply
  changed_when: "'created' in cm_apply.stdout or 'configured' in cm_apply.stdout"

- name: Remove temporary Nginx ConfigMap manifest
  ansible.builtin.file:
    path: /tmp/k8s-wp-nginx-cm.yml
    state: absent

---
# =============================================================================
# WordPress namespace, Secret and nginx ConfigMap
# =============================================================================
#
# Namespace first (everything else lives in it), then labels, the default
# ServiceAccount patch, the Secret (DB passwords - no_log) and the nginx
# ConfigMap. Uses THE K8S APPLY PATTERN (explained in common_calico/tasks/main.yml): the
# template is rendered on the controller, parsed into objects and applied via
# the API; "changed" only when a live object really differs.

- name: NS | Ensure wordpress namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    kind: Namespace
    name: wordpress

# CIS 5.2.1 (Pod Security Standards): warn/audit only, deliberately NOT
# enforce. Workloads here use HostPath volumes (RWO app/DB data dirs), which
# the "baseline" standard disallows - enforce would reject every future pod
# (including the every-5-min wordpress-cron CronJob and any deploy rollout).
# warn/audit surface the same violations without blocking anything.
- name: NS | Label wordpress namespace with Pod Security Standards (warn/audit only)
  # No "apply": a plain patch merges these labels into the existing ones
  # (kubernetes.io/metadata.name etc.) instead of owning the whole object.
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: wordpress
        labels:
          pod-security.kubernetes.io/warn: baseline
          pod-security.kubernetes.io/audit: baseline

# CIS 5.1.5/5.1.6: belt-and-suspenders alongside automountServiceAccountToken:
# false already set on every Pod template in this namespace - kube-bench's
# automated check looks at the ServiceAccount object itself, not just
# whether any Pod using it happens to override the setting.
- name: NS | Disable SA token automount on the default ServiceAccount (CIS 5.1.5/5.1.6)
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: wordpress
      automountServiceAccountToken: false

# --- Secret ---
- name: NS | Apply WordPress Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 34), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'secret.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: secret_apply
  no_log: true

# --- Nginx ConfigMap ---
- name: NS | Apply Nginx ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 34), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'nginx-cm.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: cm_apply

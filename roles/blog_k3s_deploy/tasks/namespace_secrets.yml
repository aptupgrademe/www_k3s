---
# =============================================================================
# WordPress namespace, Secret and nginx ConfigMap
# =============================================================================
# The namespace task uses failed_when to swallow the "already exists" error
# so the play stays idempotent on re-runs.

- name: Create wordpress namespace
  ansible.builtin.command: >
    k3s kubectl create namespace wordpress
  register: ns_create
  changed_when: ns_create.rc == 0
  failed_when: ns_create.rc != 0 and "already exists" not in ns_create.stderr

# --- Secret ---
- name: Template WordPress Secret manifest
  ansible.builtin.template:
    src: secret.yml.j2
    dest: /tmp/k8s-wp-secret.yml
    mode: "0600"

- name: Apply WordPress Secret
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-wp-secret.yml
  register: secret_apply
  changed_when: "'created' in secret_apply.stdout or 'configured' in secret_apply.stdout"
  no_log: true

- name: Remove temporary Secret manifest
  ansible.builtin.file:
    path: /tmp/k8s-wp-secret.yml
    state: absent

# --- Nginx ConfigMap ---
- name: Template Nginx ConfigMap
  ansible.builtin.template:
    src: nginx-cm.yml.j2
    dest: /tmp/k8s-wp-nginx-cm.yml
    mode: "0644"

- name: Apply Nginx ConfigMap
  ansible.builtin.command: >
    k3s kubectl apply -f /tmp/k8s-wp-nginx-cm.yml
  register: cm_apply
  changed_when: "'created' in cm_apply.stdout or 'configured' in cm_apply.stdout"

- name: Remove temporary Nginx ConfigMap manifest
  ansible.builtin.file:
    path: /tmp/k8s-wp-nginx-cm.yml
    state: absent

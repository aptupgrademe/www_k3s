---
# =============================================================================
# ValidatingAdmissionPolicy – wordpress namespace image registry allowlist
# =============================================================================
# GA since Kubernetes 1.30 (k3s {{ k3s_version }}), built into the apiserver —
# no extra component to install, unlike common_calico for NetworkPolicy.

- name: ImagePolicy | Apply wordpress image allowlist
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # One loop item per object in the template, so --diff shows each
  # object's change (with a list definition the module reports no diff).
  loop: "{{ lookup('ansible.builtin.template', 'image-policy.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: image_policy_apply

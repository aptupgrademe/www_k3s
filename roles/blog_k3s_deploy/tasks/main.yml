---
# =============================================================================
# Role: blog_k3s_deploy
# Purpose: Deploy the complete WordPress stack into K3s.
#          All services (MariaDB, WordPress PHP-FPM, Nginx) run as K8s
#          workloads in the 'wordpress' namespace.
#          Only nftables and SSH remain on the host.
# =============================================================================

# Fail fast with an actionable message instead of a bare "undefined variable"
# halfway through the deployment. This variable was introduced when the
# mysqld_exporter sidecar stopped authenticating as MariaDB root, so existing
# vaults predating that change do not have it yet.
- name: blog_k3s_deploy | Check that the exporter DB password is present in the vault
  ansible.builtin.assert:
    that:
      - blog_db_exporter_pass is defined
      - blog_db_exporter_pass | length > 0
    fail_msg: >-
      blog_db_exporter_pass is missing from this host's vault.yml. Add a line
      like  blog_db_exporter_pass: "<a fresh random password>"  (see
      vault.yml.example) and re-encrypt with ansible-vault. It is the
      least-privilege MariaDB account used by the mysqld_exporter sidecar,
      which no longer connects as root.

- name: blog_k3s_deploy | HostPath directories
  ansible.builtin.import_tasks: dirs.yml

- name: blog_k3s_deploy | Namespace, Secret, ConfigMap
  ansible.builtin.import_tasks: namespace_secrets.yml

- name: blog_k3s_deploy | MariaDB Deployment + Service
  ansible.builtin.import_tasks: mariadb.yml

- name: blog_k3s_deploy | External Services (Grafana → host)
  ansible.builtin.import_tasks: external_services.yml

- name: blog_k3s_deploy | Redis Deployment + Service (object cache)
  ansible.builtin.import_tasks: redis.yml

- name: blog_k3s_deploy | WordPress Deployment + Service
  ansible.builtin.import_tasks: wordpress.yml

- name: blog_k3s_deploy | Ingress + TLS
  ansible.builtin.import_tasks: ingress.yml

- name: blog_k3s_deploy | WordPress CronJob
  ansible.builtin.import_tasks: cronjob.yml

- name: blog_k3s_deploy | Exporter NodePort Services
  ansible.builtin.import_tasks: exporters.yml

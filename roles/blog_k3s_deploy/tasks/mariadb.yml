---
# Deploy MariaDB as a K3s Deployment with a HostPath volume.
# The official mariadb:10.11 image auto-initialises the database on first
# start when MARIADB_DATABASE / MARIADB_USER / MARIADB_PASSWORD are set.
# Wait for MariaDB to be ready before deploying WordPress.

- name: MariaDB | Apply MariaDB Deployment + Service
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  # With --diff (check-drift.sh): one loop item per object, so the diff shows
  # each object's change (a list definition reports no diff). Otherwise one
  # call for all objects of the template - one module run instead of one per
  # object (Calico alone has 33), same apply semantics.
  loop: "{{ k8s_objects if ansible_diff_mode else [k8s_objects] }}"
  loop_control:
    label: "{{ (item.kind ~ '/' ~ item.metadata.name) if item is mapping else ((item | length) ~ ' objects') }}"
  vars:
    k8s_objects: "{{ lookup('ansible.builtin.template', 'mariadb-deployment.yml.j2') | ansible.builtin.from_yaml_all | select | list }}"
  register: mariadb_apply

- name: MariaDB | Wait for MariaDB rollout to complete
  ansible.builtin.command: >
    k3s kubectl rollout status deployment/mariadb
    --namespace wordpress
    --timeout=180s
  changed_when: false


# -----------------------------------------------------------------------------
# Least-privilege database user for mysqld_exporter
# -----------------------------------------------------------------------------
# The exporter sidecar previously authenticated as root, which put the full
# MariaDB root credentials into a container that only ever needs to read
# counters. These grants cover everything the default collectors use:
#   PROCESS            -> SHOW PROCESSLIST, InnoDB engine status
#   REPLICATION CLIENT -> SHOW MASTER STATUS / BINARY LOGS
#   SLAVE MONITOR      -> SHOW SLAVE STATUS (split out of REPLICATION CLIENT in
#                         MariaDB 10.5.9; without it the slave_status scraper
#                         logged "Error 1227 Access denied" every 15 s, found
#                         2026-09-25). Read-only status, no replication control.
#   SELECT on performance_schema -> the perf_schema collectors
# information_schema needs no explicit grant. Deliberately no SELECT on the
# WordPress schema, so the exporter cannot read post or user tables.
#
# The password is passed to mariadb inside the container; the root password
# is read from the mounted secret file (CIS 5.4.1 - see mariadb-deployment.yml.j2,
# MARIADB_ROOT_PASSWORD_FILE - there's no plain MARIADB_ROOT_PASSWORD env var
# in the pod any more). Both are shell-quoted, and no_log keeps them out of
# the Ansible log. CREATE OR REPLACE makes this idempotent and also rotates
# the password if blog_db_exporter_pass changed in the vault.
# Idempotent: compare first, so the CREATE OR REPLACE below only runs (and
# only reports "changed") when the user is missing, has another password or
# lost its performance_schema grant. Expected count: 2 users + 2 db grants.
- name: MariaDB | Check the mysqld_exporter database user
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/mariadb
      - --namespace=wordpress
      - --container=mariadb
      - --
      - sh
      - -c
      - >-
        mariadb -N -u root -p"$(cat /etc/secrets/db-root-password)" -e "
        SELECT
          (SELECT COUNT(*) FROM mysql.user WHERE User = 'exporter'
             AND Host IN ('localhost', '127.0.0.1')
             AND authentication_string = PASSWORD('{{ blog_db_exporter_pass }}'))
        + (SELECT COUNT(*) FROM mysql.db WHERE User = 'exporter'
             AND Host IN ('localhost', '127.0.0.1') AND Db = 'performance_schema'
             AND Select_priv = 'Y');"
  register: exporter_user_check
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false
  no_log: true

- name: MariaDB | Create least-privilege mysqld_exporter database user
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - exec
      - deployment/mariadb
      - --namespace=wordpress
      - --container=mariadb
      - --
      - sh
      - -c
      - >-
        mariadb -u root -p"$(cat /etc/secrets/db-root-password)" -e "
        CREATE OR REPLACE USER 'exporter'@'localhost'
          IDENTIFIED BY '{{ blog_db_exporter_pass }}';
        CREATE OR REPLACE USER 'exporter'@'127.0.0.1'
          IDENTIFIED BY '{{ blog_db_exporter_pass }}';
        GRANT PROCESS, REPLICATION CLIENT, SLAVE MONITOR ON *.* TO 'exporter'@'localhost';
        GRANT PROCESS, REPLICATION CLIENT, SLAVE MONITOR ON *.* TO 'exporter'@'127.0.0.1';
        GRANT SELECT ON performance_schema.* TO 'exporter'@'localhost';
        GRANT SELECT ON performance_schema.* TO 'exporter'@'127.0.0.1';
        FLUSH PRIVILEGES;"
  register: exporter_user
  changed_when: exporter_user.rc == 0
  when: exporter_user_check.stdout | default('') | trim != '4'
  no_log: true

---
# =============================================================================
# Role: nas_zed
# Purpose: Configure the ZFS Event Daemon (zed) to send email alerts when
#          the pool is degraded, a disk fails, or a scrub finds errors.
#          Requires common_msmtp to be configured for mail relay.
# =============================================================================

- name: ZED | Ensure zfs-zed package is installed
  ansible.builtin.apt:
    name: zfs-zed
    state: present

- name: ZED | Configure zed.rc (email + verbosity)
  ansible.builtin.blockinfile:
    path: /etc/zfs/zed.d/zed.rc
    create: true
    owner: root
    group: root
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED"
    block: |
      ZED_EMAIL_ADDR="{{ email | default('root') }}"
      ZED_EMAIL_PROG="mail"
      ZED_EMAIL_OPTS="-s '@SUBJECT@' @ADDRESS@"
      ZED_NOTIFY_VERBOSE=1
      ZED_NOTIFY_DATA=1
      ZED_SCRUB_AFTER_RESILVER=1

- name: ZED | Enable and start zed service
  ansible.builtin.systemd:
    name: zed
    enabled: true
    state: started
    daemon_reload: true

# --- Monthly scrub cron (check data integrity) ---
- name: ZED | Monthly ZFS scrub cron job
  ansible.builtin.cron:
    name: "ZFS monthly scrub"
    day: "1"
    hour: "4"
    minute: "0"
    job: "/usr/sbin/zpool scrub {{ nas_zfs_pool }} && echo 'ZFS scrub started on {{ nas_zfs_pool }}'"
    user: root

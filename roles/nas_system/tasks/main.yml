---
# =============================================================================
# Role: nas_system
# Purpose: Base system configuration for the NAS (Debian 13):
#          hostname, timezone, locale, SSH hardening, external disk mount.
# =============================================================================

# --- Hostname ---
- name: System | Set hostname
  ansible.builtin.hostname:
    name: "{{ nas_hostname | default('hp1') }}"

- name: System | Ensure /etc/hosts has correct entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1  {{ nas_hostname | default('hp1') }}"

# --- Timezone ---
- name: System | Set timezone to Europe/Berlin
  community.general.timezone:
    name: "{{ nas_timezone | default('Europe/Berlin') }}"

# --- Locale ---
- name: System | Ensure locales package is installed
  ansible.builtin.apt:
    name: locales
    state: present

- name: System | Generate de_DE.UTF-8 locale
  community.general.locale_gen:
    name: de_DE.UTF-8
    state: present

- name: System | Set default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      LANG=de_DE.UTF-8
      LC_ALL=de_DE.UTF-8
    owner: root
    group: root
    mode: "0644"

- name: System | Ensure /home/raphael/.ssh exists
  ansible.builtin.file:
    path: /home/raphael/.ssh
    state: directory
    owner: raphael
    group: raphael
    mode: "0700"

# --- SSH keys for Jenkins backup connections ---
- name: System | Deploy SSH private key (id_rsa – unencrypted)
  ansible.builtin.copy:
    content: "{{ nas_ssh_private_key }}"
    dest: /home/raphael/.ssh/id_rsa
    owner: raphael
    group: raphael
    mode: "0600"
  no_log: true
  when: nas_ssh_private_key is defined

- name: System | Deploy SSH second key (id_rsa.pub – passphrase-protected)
  ansible.builtin.copy:
    content: "{{ nas_ssh_private_key_2 }}"
    dest: /home/raphael/.ssh/id_rsa.pub
    owner: raphael
    group: raphael
    mode: "0600"
  no_log: true
  when: nas_ssh_private_key_2 is defined

- name: System | Deploy SSH public key file (derived from id_rsa)
  ansible.builtin.copy:
    src: raphael_id_rsa.pub
    dest: /home/raphael/.ssh/id_rsa_public.pub
    owner: raphael
    group: raphael
    mode: "0644"

- name: System | Deploy known_hosts
  ansible.builtin.copy:
    src: raphael_known_hosts
    dest: /home/raphael/.ssh/known_hosts
    owner: raphael
    group: raphael
    mode: "0600"

# --- SSH: deploy authorized key for Ansible controller ---
- name: System | Deploy SSH public key for raphael
  ansible.posix.authorized_key:
    user: raphael
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
    state: present
  failed_when: false

# --- SSH: disable password auth (key-only after key is deployed) ---
- name: System | Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: reload sshd

- name: System | Disable SSH root password login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin without-password'
  notify: reload sshd

# --- External disk mount (sde – Toshiba HDD /mnt/usb) ---
- name: System | Ensure /mnt/usb mount point exists
  ansible.builtin.file:
    path: /mnt/usb
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: System | Mount external HDD (/mnt/usb) via fstab
  ansible.posix.mount:
    path: /mnt/usb
    src: "{{ nas_usb_disk_id }}"
    fstype: ext4
    opts: defaults,nofail,x-systemd.device-timeout=10s
    state: mounted
  when: nas_usb_disk_id is defined

# --- NTP ---
- name: System | Ensure systemd-timesyncd is running
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

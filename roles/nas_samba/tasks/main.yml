---
# =============================================================================
# Role: nas_samba
# Purpose: Deploy Samba configuration with shares on the NAS.
# =============================================================================

- name: Samba | Deploy smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: testparm -s %s
    backup: true
  notify: restart samba

- name: Samba | Ensure share directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.force_user }}"
    group: "{{ item.force_user }}"
    mode: "0755"
  loop: "{{ nas_samba_shares }}"

- name: Samba | Set Samba password for raphael
  ansible.builtin.shell: |
    (echo "{{ nas_samba_user_password }}"; echo "{{ nas_samba_user_password }}") | smbpasswd -s -a raphael
  no_log: true
  changed_when: false

- name: Samba | Enable and start smbd + nmbd
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smbd
    - nmbd

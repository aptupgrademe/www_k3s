---
# =============================================================================
# Role: nas_pihole
# Purpose: Install and configure Pi-hole v6 on Debian 13.
#          Pi-hole acts as local DNS resolver / ad blocker for the homelab.
#
# Extracted from hp1 (192.168.10.50):
#   Interface: eno1
#   Web port:  8000 (http) / 4443 (https)
#   Upstream:  8.8.8.8, 8.8.4.4
#   Version:   Core 6.4.2 / Web 6.5 / FTL 6.6.2
# =============================================================================

# --- Dependencies ---
- name: Pi-hole | Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - git
      - libcap2-bin
      - dns-root-data
    state: present
    update_cache: true

# --- Pre-configure unattended installation ---
- name: Pi-hole | Create /etc/pihole directory
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pi-hole | Deploy setupVars.conf for unattended install
  ansible.builtin.template:
    src: setupVars.conf.j2
    dest: /etc/pihole/setupVars.conf
    owner: root
    group: root
    mode: "0644"

# --- Install Pi-hole (skip if already installed) ---
- name: Pi-hole | Check if already installed
  ansible.builtin.stat:
    path: /usr/local/bin/pihole
  register: _pihole_bin

- name: Pi-hole | Download and run installer (unattended)
  ansible.builtin.shell: |
    curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
  environment:
    PIHOLE_SKIP_OS_CHECK: "true"
  when: not _pihole_bin.stat.exists
  changed_when: true

# --- Post-install configuration ---
- name: Pi-hole | Deploy pihole.toml overrides (web port, interface)
  ansible.builtin.template:
    src: pihole-overrides.toml.j2
    dest: /etc/pihole/pihole.toml.d/ansible-overrides.toml
    owner: pihole
    group: pihole
    mode: "0640"
  failed_when: false
  notify: restart pihole-FTL

# --- Set web password from vault ---
- name: Pi-hole | Set web interface password
  ansible.builtin.command: pihole setpassword "{{ nas_pihole_password }}"
  no_log: true
  changed_when: false
  when: nas_pihole_password is defined

# --- Ensure service is running ---
- name: Pi-hole | Enable and start pihole-FTL
  ansible.builtin.systemd:
    name: pihole-FTL
    enabled: true
    state: started

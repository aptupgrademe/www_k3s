---
# =============================================================================
# Role: next_packages
# Purpose: Install repositories and host packages for AlmaLinux 9.
#          Sets up MariaDB (nextcloud_mariadb_repo_version), Redis, SELinux tools, and utilities.
#          Nginx and PHP run inside K3s (next_k3s_deploy), not on the host.
# Variables: none role-internal - the package lists are inline in this file.
# =============================================================================
#
# How it works: the numbered STEPs below run top to bottom - repositories
# first (CRB, EPEL, MariaDB Community), then the system update, a reboot if
# the running kernel is already gone, then the packages, then services.
# Same structure as blog_packages, plus MariaDB and Redis, which run on the
# HOST here (not in K3s like on the blog).
#
# Ansible concepts used here:
#   "ask, then act" with dnf commands  "dnf repolist" / "dnf module list"
#                  are read first (changed_when: false, check_mode: false),
#                  the enabling command only runs "when" needed - the dnf
#                  MODULE has no option for "enable repo X" or "disable
#                  module Y", so command + a guard keeps it idempotent
#   community.general.ini_file  sets one option in one [section] of an INI
#                  file (a .repo file is INI) - from the community.general
#                  collection, see requirements.yml
#   rpm_key        imports a GPG key so dnf trusts the repository's packages
#   {{ var }} inside a task NAME  the name shows the value at run time
#                  ("... repository (10.11)")


# -----------------------------------------------------------------------------
# STEP 0: Hostname
# Without this the system hostname stays "localhost" (cloud image default),
# which every $(hostname -f)-based mail subject (rkhunter, dnf-automatic
# reboot check, clamav scan, etc.) then shows verbatim – useless when several
# servers share the same alert setup, since you can't tell which one sent it.
# -----------------------------------------------------------------------------
- name: Packages | Set system hostname to the public FQDN
  ansible.builtin.hostname:
    name: "{{ nextcloud_hostname }}"

- name: Packages | Ensure /etc/hosts has a matching entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1  {{ nextcloud_hostname }}"


# -----------------------------------------------------------------------------
# STEP 1: Install DNF plugin
# -----------------------------------------------------------------------------
- name: Packages | Install 'dnf-plugins-core' (required for config-manager sub-command)
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present


# -----------------------------------------------------------------------------
# STEP 2: Enable the CRB repository
# -----------------------------------------------------------------------------
- name: Packages | Read list of currently enabled repositories (to check if CRB is active)
  ansible.builtin.command: dnf repolist --enabled
  register: enabled_repos
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: Packages | Enable CRB repository (only if not already active)
  ansible.builtin.command: dnf -y config-manager --set-enabled crb
  when: "'crb' not in enabled_repos.stdout"
  changed_when: true


# -----------------------------------------------------------------------------
# STEP 3: Install the EPEL repository
# -----------------------------------------------------------------------------
- name: Packages | Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Packages | Enable module_hotfixes for EPEL (prevents modular filtering errors)
  community.general.ini_file:
    path: /etc/yum.repos.d/epel.repo
    section: epel
    option: module_hotfixes
    value: "1"
    mode: "0644"


# -----------------------------------------------------------------------------
# STEP 4: Add the MariaDB Community repository (series: nextcloud_mariadb_repo_version)
# -----------------------------------------------------------------------------
- name: Packages | Import MariaDB Community GPG key
  ansible.builtin.rpm_key:
    state: present
    key: https://mirror.mariadb.org/yum/RPM-GPG-KEY-MariaDB

- name: Packages | Add the MariaDB Community repository ({{ nextcloud_mariadb_repo_version }})
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/mariadb.repo
    content: |
      [mariadb]
      name=MariaDB {{ nextcloud_mariadb_repo_version }} - AlmaLinux 9
      baseurl=https://mirror.mariadb.org/yum/{{ nextcloud_mariadb_repo_version }}/rhel/9/$basearch
      gpgkey=https://mirror.mariadb.org/yum/RPM-GPG-KEY-MariaDB
      gpgcheck=1
      enabled=1
    mode: "0644"

- name: Packages | Is the AppStream mariadb module already disabled?
  ansible.builtin.command: dnf -q module list --disabled mariadb
  register: mariadb_module_disabled
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false  # rc 1 = no disabled mariadb module (yet)

- name: Packages | Disable the AppStream mariadb module (prevents shadowing the Community packages)
  ansible.builtin.command: dnf -y module disable mariadb
  when: "'[x]' not in mariadb_module_disabled.stdout"
  changed_when: true
  failed_when: false


# -----------------------------------------------------------------------------
# STEP 5: Full system update
# -----------------------------------------------------------------------------
# Kernel packages are excluded: sshd's systemd hardening drop-in
# (common_ssh, ProtectKernelModules=yes) puts every SSH session — including
# Ansible's own connection — into a private mount namespace where
# /usr/lib/modules is masked as an empty read-only tmpfs. Installing a new
# kernel there always fails. Security kernel updates still land via
# dnf-automatic (common_dnf_automatic), which runs locally via a systemd
# timer, outside the SSH session and thus unaffected by that sandboxing.
- name: Packages | Upgrade all system packages to the latest version  # noqa: package-latest - a full update is the point of this task
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
    exclude: kernel*


# -----------------------------------------------------------------------------
# Reboot if the running kernel's module directory is genuinely gone
# -----------------------------------------------------------------------------
# Cloud images occasionally already have a newer kernel installed (by the
# provider's first-boot update or a prior dnf-automatic run) before Ansible
# ever connects, while still running the old, now-unpacked kernel. Any task
# that reads /lib/modules/<running kernel> (e.g. common_sysctl's modprobe for
# tcp_bbr) then fails with a confusing "No such file or directory" instead of
# a clear "reboot needed" message.
#
# Must check via systemd-run, NOT ansible.builtin.stat directly: once
# common_ssh's hardening drop-in (ProtectKernelModules=yes) is active – which
# it already is on any host that completed a common_ssh run before, including
# earlier partial runs of this same play – /lib/modules is masked empty
# inside the SSH session's own private mount namespace. A plain stat here
# would see that mask and wrongly conclude a reboot is needed even when the
# real kernel modules are perfectly fine. systemd-run escapes that sandbox.
- name: Packages | Check whether the running kernel's module directory still exists
  ansible.builtin.command: >-
    systemd-run --wait --pipe --quiet --
    test -d /lib/modules/{{ ansible_facts['kernel'] }}
  register: running_kernel_modules
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false

- name: Packages | Reboot – running kernel's modules are gone, a newer kernel is already installed
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: running_kernel_modules.rc != 0


# -----------------------------------------------------------------------------
# STEP 6: Install required packages
# -----------------------------------------------------------------------------
- name: Packages | Install packages for the web stack
  ansible.builtin.dnf:
    name:
      # --- Database ---
      - MariaDB-server

      # --- Redis ---
      - redis

      # --- SELinux tooling ---
      - policycoreutils
      - policycoreutils-python-utils
      # container-selinux is required for K3s to run containers under SELinux
      - container-selinux

      # --- Firewall ---
      - nftables

      # --- Utility packages ---
      - curl
      - unzip
      - tar
      - git
      - cronie                # required for rkhunter daily cron job
      - rsync
      - rdiff-backup
      - tmux
      - nano

      # --- Performance/troubleshooting diagnostics ---
      - htop
      - sysstat                # iostat, mpstat, sar
      - strace

      # --- Prerequisite for Ansible MySQL modules ---
      - python3-PyMySQL
    state: present


# -----------------------------------------------------------------------------
# STEP 7: Enable and start services
# -----------------------------------------------------------------------------
- name: Packages | Enable and start MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Packages | Enable and start Redis
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true


# -----------------------------------------------------------------------------
# STEP 8: Disable firewalld (we use nftables via systemd)
# -----------------------------------------------------------------------------
- name: Packages | Disable and stop firewalld (we use nftables via systemd)
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  failed_when: false

- name: Packages | Disable unnecessary NFS/RPC/LDAP services (not needed on this host)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - rpcbind
    - rpcbind.socket
    - sssd
    - sssd-kcm.socket
  failed_when: false

- name: Packages | Mask gssproxy (starts via socket activation despite disabled state)
  ansible.builtin.systemd:
    name: gssproxy
    masked: true
    state: stopped
  failed_when: false

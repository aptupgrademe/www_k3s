---
# =============================================================================
# Role: next_redis
# Purpose: Ensure Redis is running and reachable from K3s pods.
#          Redis binds to 127.0.0.1 and the node's public IP so that pods can
#          connect via the K8s ExternalService → Endpoints → node IP.
#          nftables rules (common_firewall) restrict port 6379 to the K3s pod
#          CIDR ({{ k3s_pod_cidr }}) and localhost.
# Target:  AlmaLinux 9
# Variables: bind address and port come from the inventory
#            (nextcloud_ipv4 in host_vars/<host>/vars.yml).
# =============================================================================
#
# How it works: Redis is installed by next_packages; this role makes sure it
# runs, edits three lines of /etc/redis/redis.conf (bind, protected-mode,
# requirepass), restarts Redis right away if one changed, and waits until
# it answers on the node IP - because the next roles in the same play need
# it there.
#
# Ansible concepts used here:
#   lineinfile + backup: true  edit one line; backup keeps a timestamped
#                  copy of the old file next to it whenever it changes
#   ansible.builtin.service   the init-system-neutral service module
#                  (systemd module elsewhere in this repo - same effect here)
#   meta: flush_handlers  run the notified restart NOW, not at play end
#   wait_for host/port    waits until a TCP port accepts connections


- name: Redis | Check that the Redis password is present in the vault
  ansible.builtin.assert:
    that:
      - nextcloud_redis_pass is defined
      - nextcloud_redis_pass | length > 0
    fail_msg: >-
      nextcloud_redis_pass is missing from this host's vault.yml. Add a line
      like  nextcloud_redis_pass: "<a fresh random password>"  (see
      vault.yml.example) and re-encrypt with ansible-vault. Redis now requires
      authentication instead of relying solely on the nftables rule, and the
      same value is handed to Nextcloud via the K8s Secret.


# -----------------------------------------------------------------------------
# systemd sandbox (2026-10-20) - live before the service starts, same pattern
# as next_mariadb, so a fresh host never runs Redis unsandboxed
# -----------------------------------------------------------------------------
# The SELinux module first: without it the drop-in below (NoNewPrivileges)
# keeps redis-server out of redis_t and Redis does not start.
# selinux-policy-devel comes from common_selinux_monitoring on every host;
# installed here as well so the role does not depend on the order.
- name: Redis | Policy build tools (selinux-policy-devel)
  ansible.builtin.dnf:
    name: selinux-policy-devel
    state: present

- name: Redis | SELinux module source directory
  ansible.builtin.file:
    path: /etc/selinux/local/redis
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Redis | SELinux module source (NNP transition into redis_t)
  ansible.builtin.copy:
    src: homelab_redis_nnp.te
    dest: /etc/selinux/local/redis/homelab_redis_nnp.te
    owner: root
    group: root
    mode: "0600"
  register: redis_te

- name: Redis | Loaded SELinux modules
  ansible.builtin.command: semodule -l
  register: redis_semodules
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: Redis | Build and load the SELinux module
  ansible.builtin.shell: |
    set -e
    cd /etc/selinux/local/redis
    make -f /usr/share/selinux/devel/Makefile homelab_redis_nnp.pp >/dev/null
    semodule -i homelab_redis_nnp.pp
    rm -rf tmp   # intermediate files of the devel Makefile (semanage_store_t, flagged by restorecon -n)
  when: redis_te is changed or 'homelab_redis_nnp' not in redis_semodules.stdout_lines
  changed_when: true

- name: Redis | Ensure systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/redis.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Redis | Deploy systemd hardening drop-in
  ansible.builtin.copy:
    src: systemd-hardening.conf
    dest: /etc/systemd/system/redis.service.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  register: redis_dropin
  notify: Restart Redis

- name: Redis | Reload systemd so the drop-in takes effect
  ansible.builtin.systemd:
    daemon_reload: true
  when: redis_dropin is changed


# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
- name: Redis | Ensure Redis service is enabled and started
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true


# -----------------------------------------------------------------------------
# Network binding
# -----------------------------------------------------------------------------
# Bind to loopback and the node's public IP so K3s pods can reach Redis.
# nftables restricts port 6379 to the K3s pod CIDR and localhost.
- name: Redis | Ensure Redis binds to localhost and node IP
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^bind\s+'
    line: 'bind 127.0.0.1 {{ nextcloud_ipv4 }}'
    backup: true
  notify: Restart Redis

- name: Redis | Ensure Redis protected-mode is enabled
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^protected-mode\s+'
    line: 'protected-mode yes'
    backup: true
  notify: Restart Redis

# no_log: the line contains the password; lineinfile would otherwise
# print it in the diff (--diff) and on failure.
# Defence in depth. The bind address above is the node's *public* IP (pods
# reach Redis through the ExternalService -> Endpoints -> node IP path), so
# until now the only thing standing between the internet and this Redis was
# a single nftables rule. protected-mode does not help once a real bind
# address is configured. One firewall rule silently failing is not a
# hypothetical here -- fail2ban sat dead for two days on the blog host
# without anyone noticing -- and an unauthenticated Redis holding Nextcloud's
# file locks and session data is not something to leave on one layer.
- name: Redis | Ensure Redis requires authentication
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^requirepass\s+'
    line: 'requirepass {{ nextcloud_redis_pass }}'
    backup: true
  no_log: true
  notify: Restart Redis

# No snapshots (2026-10-20). This Redis holds only file locks with a TTL and
# a cache Nextcloud rebuilds by itself; the package default (save 3600 1 300
# 100 60 10000) wrote dump.rdb for nothing, and a restore of it after a
# restart would bring back keys without expiry from the moment of the dump.
# The blog's Redis pod runs with --save "" for the same reason.
- name: Redis | Disable RDB snapshots
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^save\s'
    line: 'save ""'
    backup: true
  notify: Restart Redis

# Flush handlers immediately so Redis restarts with the new bind address
# before next_config (which runs in the same play) tries to connect via the
# pod → ExternalService → host IP path.  Without this, Redis still listens
# on 127.0.0.1 only when occ commands run and the connection is refused.
- name: Redis | Flush handlers to apply config changes now
  ansible.builtin.meta: flush_handlers

# The last snapshot would otherwise be loaded at every start from now on -
# Redis no longer rewrites it. Only old cache/lock data, safe to drop; with
# save "" no new one appears, so this stays idempotent.
- name: Redis | Remove the last snapshot left from before save ""
  ansible.builtin.file:
    path: /var/lib/redis/dump.rdb
    state: absent

- name: Redis | Wait for Redis to be ready on host IP
  ansible.builtin.wait_for:
    host: "{{ nextcloud_ipv4 }}"
    port: 6379
    timeout: 30

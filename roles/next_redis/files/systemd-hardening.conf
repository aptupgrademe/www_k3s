# Managed by Ansible (next_redis) - do not edit manually.
# systemd sandbox for the host Redis, the same kind as MariaDB's
# (next_mariadb/files/systemd-hardening.conf). Added 2026-10-20: until then
# Redis ran with the package unit only (systemd-analyze security: 9.2 UNSAFE)
# - SELinux confined it to redis_t, but the second layer was missing.
#
# Redis listens on TCP 6379 (no privileged port) and runs as user redis, so
# it needs no capabilities at all.
#
# NoNewPrivileges needs the SELinux module homelab_redis_nnp (files/
# homelab_redis_nnp.te, loaded by this role BEFORE this drop-in): the
# distribution policy does not allow the transition init_t -> redis_t under
# NNP, so without it redis-server stays in init_t and dies on its own log
# file ("Can't open the log file: Permission denied", avc: denied
# { nnp_transition }) - Redis was down for two minutes on the smaller host
# on 2026-10-20 when that was learned. Leaving NoNewPrivileges out does not
# help either: SystemCallFilter, MemoryDenyWriteExecute, RestrictNamespaces
# and most options below imply it for a non-root service.
[Service]
AmbientCapabilities=
CapabilityBoundingSet=
NoNewPrivileges=yes

# Read-only file system except its data and log directory. RuntimeDirectory
# (/run/redis, from the package unit) stays writable. The pidfile in
# redis.conf points to /var/run/redis_6379.pid, which user redis could never
# write anyway (Type=notify does not need it); Redis logs that and goes on.
ProtectSystem=strict
ReadWritePaths=/var/lib/redis
ReadWritePaths=-/var/log/redis
PrivateTmp=yes
ProtectHome=yes
PrivateDevices=yes

ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectProc=invisible
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes

SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
# AF_NETLINK: glibc enumerates interfaces over netlink (getifaddrs) - the
# lesson from MariaDB and the SSH sandbox; Redis binds to the node IP.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

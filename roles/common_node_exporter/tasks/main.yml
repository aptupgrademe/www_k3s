---
# =============================================================================
# Role: common_node_exporter
# Purpose: Install Prometheus Node Exporter on AlmaLinux 9.
#          Binds to 127.0.0.1:9100 – only accessible from localhost.
#          Prometheus (common_prometheus) scrapes this endpoint.
# =============================================================================
#
# How it works: same four steps as common_prometheus (system user, pinned
# binary from GitHub only when the version differs, systemd unit, hardening
# drop-in); the Ansible concepts are explained in detail there. Node
# Exporter has no config file - everything is a command-line flag in the
# unit, so a flag change means a new unit file -> handlers "reload systemd"
# + "restart node_exporter".
#
# What it exports: host metrics (CPU, memory, disks, filesystems, network,
# systemd) as text on http://127.0.0.1:9100/metrics. Prometheus pulls that
# page every scrape interval; nothing is pushed.


# -----------------------------------------------------------------------------
# System user
# -----------------------------------------------------------------------------
- name: Node Exporter | Create system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    home: /var/lib/node_exporter
    create_home: false


# "node_exporter, version 1.12.1 (...)" -> awk keeps "1.12.1", the format
# of node_exporter_version in versions.yml, so the "when:" below can
# compare the two strings directly.
# -----------------------------------------------------------------------------
# Binary installation
# -----------------------------------------------------------------------------
# Download/extract/install only when the installed binary is not the pinned
# version: the archive lives in /tmp, which a reboot empties - before, every
# run after a reboot downloaded it again and reported "changed" although the
# right version was already installed.
- name: Node Exporter | Installed version
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/node_exporter --version 2>&1 | head -1 | awk '{print $3}'
  register: node_exporter_installed_version
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false  # not installed yet -> empty, so it gets installed

- name: Node Exporter | Download archive
  when: (node_exporter_installed_version.stdout | trim) != node_exporter_version
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/\
          v{{ node_exporter_version }}/\
          node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"

- name: Node Exporter | Extract archive
  when:
    - (node_exporter_installed_version.stdout | trim) != node_exporter_version
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Node Exporter | Install binary
  when:
    - (node_exporter_installed_version.stdout | trim) != node_exporter_version
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: restart node_exporter


# Lines starting with "#" inside content: are part of the FILE (systemd
# ignores them as comments), not YAML comments - the "|" block keeps
# everything literally.
# -----------------------------------------------------------------------------
# Systemd service
# -----------------------------------------------------------------------------
- name: Node Exporter | Install systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      # netdev.device-exclude hides the K8s/container virtual interfaces (veth*,
      # cni0, flannel.1, docker*, br-*, kube-ipvs*, dummy*, lo) so the netdev
      # metrics -- and every Grafana Network panel -- show only real NICs like
      # eth0 (the server's actual in/out) instead of dozens of veth* churn.
      # '\\.' because systemd unescapes ExecStart: a bare '\.' still reached the
      # exporter but logged "Ignoring unknown escape sequences" on every reload.
      ExecStart=/usr/local/bin/node_exporter \
        --web.listen-address=127.0.0.1:9100 \
        --collector.textfile.directory=/var/lib/node_exporter/textfile \
        --collector.netdev.device-exclude=^(veth.*|cni[0-9]+|flannel\\.[0-9]+|docker[0-9]+|br-.*|kube-ipvs.*|dummy.*|lo|nodelocaldns)$
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart node_exporter

# Textfile collector: *.prom files in here are served as metrics. Written by
# root jobs (common_trivy), only read by node_exporter - hence root-owned.
# Its own SELinux type comes from common_selinux_monitoring.
- name: Node Exporter | Textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

# Heartbeats of the periodic jobs (2026-10-26). Each job calls
# "heartbeat-mark <task> <max age in s>" when it has finished; the file it
# writes here becomes job_heartbeat_timestamp_seconds{task=...} and
# job_heartbeat_max_age_seconds, and the Grafana rule "Regelmäßiger Job
# meldet sich nicht" fires when a task is older than its own max age. Found
# the hard way: the auditd notifier was silent for six weeks and nothing
# noticed. Cron jobs append it to their command line (common_cis_hardening,
# common_rkhunter, common_clamav, common_auditd, common_dnf_automatic);
# systemd timers get it as ExecStartPost below (runs only after a successful
# ExecStart). Label "task", not "job": Prometheus owns "job".
- name: Node Exporter | Heartbeat helper for periodic jobs
  ansible.builtin.copy:
    dest: /usr/local/sbin/heartbeat-mark
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # heartbeat-mark <task> <max_age_seconds> - managed by Ansible (common_node_exporter)
      # Written atomically (tmp + mv) so node_exporter never reads half a file.
      case "$1" in ''|*[!a-z0-9_]*) echo "usage: heartbeat-mark <task> <max_age_s>" >&2; exit 2 ;; esac
      d=/var/lib/node_exporter/textfile
      t=$(mktemp "$d/.heartbeat_$1.XXXXXX") || exit 1
      printf 'job_heartbeat_timestamp_seconds{task="%s"} %s\njob_heartbeat_max_age_seconds{task="%s"} %s\n' \
        "$1" "$(date +%s)" "$1" "${2:-90000}" > "$t" && chmod 0644 "$t" && mv -f "$t" "$d/heartbeat_$1.prom"

- name: Node Exporter | Drop-in directories of the systemd timer jobs
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ heartbeat_units | selectattr('stack', 'in', ['all', stack]) | list }}"
  loop_control:
    label: "{{ item.unit }}"

- name: Node Exporter | Heartbeat drop-ins for the systemd timer jobs
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.unit }}.d/heartbeat.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_node_exporter): heartbeat after a successful run
      [Service]
      ExecStartPost=/usr/local/sbin/heartbeat-mark {{ item.task }} {{ item.max_age }}
  loop: "{{ heartbeat_units | selectattr('stack', 'in', ['all', stack]) | list }}"
  loop_control:
    label: "{{ item.unit }}"
  notify: reload systemd

- name: Node Exporter | Ensure node_exporter.service.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/node_exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Node Exporter | Deploy systemd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      PrivateTmp=yes
      ProtectHome=yes
      ProtectSystem=strict
      NoNewPrivileges=yes
      CapabilityBoundingSet=
      # AF_NETLINK is required: the netdev and arp collectors read network
      # stats over a netlink socket. Without it both fail at runtime ("address
      # family not supported by protocol"), node_network_*_bytes metrics are
      # never exported, and Grafana's Network Traffic panels stay empty.
      RestrictAddressFamilies=AF_INET AF_INET6 AF_NETLINK
      RestrictRealtime=yes
      RestrictSUIDSGID=yes
      LockPersonality=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      SystemCallArchitectures=native
  notify:
    - reload systemd
    - restart node_exporter

- name: Node Exporter | Enable and start service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

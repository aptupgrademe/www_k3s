---
# =============================================================================
# Role: common_monit
# Purpose: Install Monit as a watchdog that e-mails on service/resource state
#          changes and auto-restarts fail2ban. Silent while healthy, so any
#          mail actually means something. Motivated by fail2ban sitting dead
#          for two days unnoticed.
# =============================================================================
#
# How it works:
#   1. assert that the mail relay settings exist (Monit is useless if it
#      cannot send mail)
#   2. install Monit, find out which of the candidate services exist here
#   3. deploy small check scripts + the config (/etc/monitrc and
#      /etc/monit.d/checks.conf, both Jinja templates)
#   4. let Monit validate its own config (monit -t), start it, confirm
# Monit then runs on its own: every monit_check_interval seconds it runs
# each check and mails only on a STATE CHANGE (ok -> failed, failed -> ok),
# so a healthy server sends nothing.
#
# Ansible concepts used here:
#   assert          stop early with a clear message instead of failing
#                   later with a confusing one
#   loop + register a looped task registers ONE variable whose ".results"
#                   is a list - one entry per item, each with its own rc,
#                   stdout ... and the original "item"
#   zip + selectattr pairs every candidate with its result and keeps only
#                   the services whose "systemctl cat" returned rc 0
#   copy with src:  copies a file from the role's files/ directory (copy
#                   looks there automatically)
#   failed_when with a condition  turns a "succeeded" command into a
#                   failure based on its OUTPUT (the last task)

- name: Monit | Fail fast if the mail relay vars are missing from the vault
  ansible.builtin.assert:
    that:
      - mail_smtphost is defined and mail_smtphost | length > 0
      - mail_smtpname is defined and mail_smtppassword is defined
    fail_msg: >-
      Monit reuses the msmtp relay for its alerts but mail_smtphost/mail_smtpname/
      mail_smtppassword are not in this host's vault.yml. They are the same
      values common_msmtp already uses - Monit just needs them for its own SMTP.

- name: Monit | Install package (EPEL)
  ansible.builtin.dnf:
    name: monit
    state: present

- name: Monit | Ensure state directory exists (for idfile/statefile)
  ansible.builtin.file:
    path: /var/lib/monit
    state: directory
    owner: root
    group: root
    mode: "0700"

# "systemctl cat <unit>" prints the unit file and exits non-zero if the
# unit does not exist - a read-only way to ask "is this installed?".
- name: Monit | Detect which candidate services exist on this host
  ansible.builtin.command: "systemctl cat {{ item }}.service"
  register: monit_unit_check
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false
  loop: "{{ monit_candidate_services }}"

# Only monitor services that actually exist here, so the same role is safe on
# both blog and nextcloud hosts (e.g. mysqld_exporter runs on nextcloud only).
- name: Monit | Build the list of present services
  ansible.builtin.set_fact:
    monit_present_services: >-
      {{ monit_candidate_services
         | zip(monit_unit_check.results)
         | selectattr('1.rc', 'equalto', 0)
         | map(attribute='0') | list }}
    monit_hostname: "{{ ansible_facts['fqdn'] | default(inventory_hostname) }}"

# Monit's "check program" runs a script and alerts on a non-zero exit;
# each script prints WHY it failed, which ends up in the alert mail.
- name: Monit | Deploy check-program helper scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - monit-check-service.sh
    - monit-check-firewall.sh
    - monit-check-pods.sh
    - monit-check-certs.sh
    - monit-check-f2b-jails.sh

# Monit refuses to start if its control file is readable by anyone but
# its owner - hence 0600, which also protects the SMTP password inside.
- name: Monit | Deploy main config (/etc/monitrc, mode 0600 required)
  ansible.builtin.template:
    src: monitrc.j2
    dest: /etc/monitrc
    owner: root
    group: root
    mode: "0600"
  no_log: true          # contains the SMTP relay password
  notify: restart monit

- name: Monit | Ensure /etc/monit.d exists
  ansible.builtin.file:
    path: /etc/monit.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Monit | Deploy check definitions
  ansible.builtin.template:
    src: checks.conf.j2
    dest: /etc/monit.d/checks.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart monit

# No failed_when here on purpose: a config error must stop the play
# before the (notified) restart would take Monit down with a broken
# config.
# systemd sandboxing (since 2026-10-19; "systemd-analyze security monit" was
# 9.6 UNSAFE with the plain distro unit). Monit runs as root and must keep
# doing its job: systemctl start/stop (fail2ban), nft list, k3s kubectl,
# fail2ban-client, openssl to the certificate endpoints, mail via msmtp.
# None of that writes below /usr, /boot or /etc, reads home directories or
# touches kernel tunables, modules or logs - so those are locked. Not set on
# purpose: NoNewPrivileges (would also stop the SELinux domain transitions
# of every program Monit starts, the MariaDB lesson) and ProtectSystem=strict
# (state, mail queue and check scripts write in several places under /var).
- name: Monit | Drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/monit.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Monit | Deploy systemd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/monit.service.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common_monit) - see the task comment for the why.
      [Service]
      ProtectSystem=full
      ProtectHome=yes
      PrivateTmp=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectKernelLogs=yes
      ProtectClock=yes
      ProtectHostname=yes
      ProtectControlGroups=yes
      RestrictRealtime=yes
      RestrictSUIDSGID=yes
      LockPersonality=yes
      SystemCallArchitectures=native
  notify: restart monit

- name: Monit | Validate configuration syntax
  ansible.builtin.command: monit -t
  register: monit_validate
  changed_when: false
  check_mode: false   # read-only query, also runs in --check

- name: Monit | Show validation result
  ansible.builtin.debug:
    msg: "{{ monit_validate.stdout_lines }}"

- name: Monit | Enable and start
  ansible.builtin.systemd:
    name: monit
    enabled: true
    state: started
    daemon_reload: true

- name: Monit | Confirm the daemon is active after configuring
  ansible.builtin.command: systemctl is-active monit
  register: monit_active
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: monit_active.stdout != "active"

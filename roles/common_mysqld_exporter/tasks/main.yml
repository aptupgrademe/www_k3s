---
# =============================================================================
# Role: common_mysqld_exporter
# Purpose: Install Prometheus mysqld_exporter for host-side MariaDB (Nextcloud).
#          Binds to 127.0.0.1:9104 – only accessible from localhost.
#          Prometheus (common_prometheus) scrapes this endpoint.
#          The Prometheus DB user 'prometheus'@'127.0.0.1' is created by next_mariadb.
# =============================================================================
#
# How it works: same pattern as common_node_exporter / common_prometheus
# (system user, pinned binary only when the version differs, systemd unit),
# plus one extra file: the database credentials the exporter logs in with.
# Only used on the Nextcloud hosts, where MariaDB runs on the host itself;
# the blog's MariaDB runs in K3s and has its exporter as a sidecar
# container (blog_k3s_deploy).
#
# Ansible concepts new in this role:
#   no_log: true   hides the task's arguments and result from the output
#                  and logs - here because "content:" contains a password.
#                  Without it, "-v" or a failed task would print it.
#   variable from the vault   mysqld_exporter_db_password (defaults/) points
#                  to nextcloud_db_exporter_pass, which lives encrypted in
#                  host_vars/<host>/vault.yml.


# -----------------------------------------------------------------------------
# System user
# -----------------------------------------------------------------------------
- name: mysqld_exporter | Create system user
  ansible.builtin.user:
    name: mysqld_exporter
    system: true
    shell: /sbin/nologin
    home: /var/lib/mysqld_exporter
    create_home: false


# -----------------------------------------------------------------------------
# Binary installation
# -----------------------------------------------------------------------------
# Download/extract/install only when the installed binary is not the pinned
# version: the archive lives in /tmp, which a reboot empties - before, every
# run after a reboot downloaded it again and reported "changed" although the
# right version was already installed.
- name: mysqld_exporter | Installed version
  ansible.builtin.shell: |
    set -o pipefail
    /usr/local/bin/mysqld_exporter --version 2>&1 | head -1 | awk '{print $3}'
  register: mysqld_exporter_installed_version
  changed_when: false
  check_mode: false   # read-only query, also runs in --check
  failed_when: false  # not installed yet -> empty, so it gets installed

- name: mysqld_exporter | Download archive
  when: (mysqld_exporter_installed_version.stdout | trim) != mysqld_exporter_version
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/mysqld_exporter/releases/download/\
          v{{ mysqld_exporter_version }}/\
          mysqld_exporter-{{ mysqld_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/mysqld_exporter-{{ mysqld_exporter_version }}.tar.gz"
    mode: "0644"

- name: mysqld_exporter | Extract archive
  when:
    - (mysqld_exporter_installed_version.stdout | trim) != mysqld_exporter_version
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack
  ansible.builtin.unarchive:
    src: "/tmp/mysqld_exporter-{{ mysqld_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/mysqld_exporter-{{ mysqld_exporter_version }}.linux-amd64/mysqld_exporter"

- name: mysqld_exporter | Install binary
  when:
    - (mysqld_exporter_installed_version.stdout | trim) != mysqld_exporter_version
    - not ansible_check_mode   # --check downloads nothing, so there is nothing to unpack
  ansible.builtin.copy:
    src: "/tmp/mysqld_exporter-{{ mysqld_exporter_version }}.linux-amd64/mysqld_exporter"
    dest: /usr/local/bin/mysqld_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: restart mysqld_exporter


# mode 0600 + owner mysqld_exporter: only the exporter (and root) can read
# the password. The [client] section is the standard MySQL/MariaDB
# option-file format the exporter reads via --config.my-cnf.
# -----------------------------------------------------------------------------
# MySQL client config (.my.cnf style)
# mysqld_exporter reads credentials from this file via --config.my-cnf flag.
# The prometheus user is created by next_mariadb with PROCESS, BINLOG MONITOR
# (MariaDB 10.11 name of REPLICATION CLIENT) and SELECT.
# -----------------------------------------------------------------------------
- name: mysqld_exporter | Write MySQL client config
  ansible.builtin.copy:
    dest: /etc/mysqld_exporter.cnf
    owner: mysqld_exporter
    group: mysqld_exporter
    mode: "0600"
    content: |
      [client]
      user=prometheus
      password={{ mysqld_exporter_db_password }}
      host=127.0.0.1
      port=3306
  no_log: true
  notify: restart mysqld_exporter


# After=mariadb.service: at boot, start after the database so the first
# scrapes do not all fail. (After= only orders the start; it does not make
# the exporter depend on MariaDB running.)
# -----------------------------------------------------------------------------
# Systemd service
# -----------------------------------------------------------------------------
- name: mysqld_exporter | Install systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/mysqld_exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus MariaDB Exporter
      After=network.target mariadb.service

      [Service]
      User=mysqld_exporter
      ExecStart=/usr/local/bin/mysqld_exporter \
        --config.my-cnf=/etc/mysqld_exporter.cnf \
        --web.listen-address=127.0.0.1:9104
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart mysqld_exporter

- name: mysqld_exporter | Enable and start service
  ansible.builtin.systemd:
    name: mysqld_exporter
    enabled: true
    state: started
    daemon_reload: true

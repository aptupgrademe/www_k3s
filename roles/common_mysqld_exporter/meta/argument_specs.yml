---
# Inputs from host_vars - keep in sync with inventory/host_vars/*/*.example.
argument_specs:
  main:
    short_description: Install Prometheus mysqld_exporter for host-side MariaDB (Nextcloud)
    description:
      - Host-specific inputs of this role (inventory/host_vars/<host>/vars.yml and vault.yml).
      - Ansible validates them when the role starts - a missing or wrongly typed value fails
      - right there instead of halfway through the play. Values with no_log never show up in output.
      - Role defaults (defaults/main.yml) and group_vars/all/ are not repeated here.
    options:
      mysql_root_password:
        description: MariaDB root password
        type: str
        required: true
        no_log: true
      nextcloud_db_exporter_pass:
        description: Password of the least-privilege mysqld_exporter DB user
        type: str
        required: true
        no_log: true
      blog_db_exporter_pass:
        description: Password of the least-privilege mysqld_exporter DB user
        type: str
        no_log: true

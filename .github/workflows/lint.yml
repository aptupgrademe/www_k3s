---
# Same checks as the local pre-commit hooks (.pre-commit-config.yaml), on
# GitHub for every push and pull request - so a commit made without the
# hooks installed is still caught before anyone runs it against a server.
name: Lint

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # Reads .ansible-lint / .ansible-lint-ignore and installs the
      # collections pinned in requirements.yml.
      - uses: ansible/ansible-lint@v26.10.0

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # whole history, not just the last commit
      - name: Scan the full git history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git --redact --verbose .

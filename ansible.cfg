[defaults]
# To avoid --ask-vault-pass on every run, create a file containing the vault
# password and uncomment the line below (never commit .vault_pass to git):
# vault_password_file  = .vault_pass

# all hosts managed as root (no sudo needed)
remote_user          = root
remote_tmp           = $HOME/.ansible/tmp
# Hosts of one play are handled in parallel (cvjm + sofie in nextcloud-k3s.yml).
# forks never meant "one host after the other": the default linear strategy
# runs task 1 on every host, then task 2 ... - forks=1 only serialised that.
# Where a whole host must finish before the next starts (updates), the play
# sets "serial: 1" itself (nextcloud-update.yml).
forks                = 5
poll_interval        = 15
# SSH connection timeout in seconds (also passed to ssh as ConnectTimeout;
# generous for the first boot after a reimage)
timeout              = 30
private_key_file     = $HOME/.ssh/id_rsa
# Left ON deliberately: these warnings are the earliest signal that something
# will break with a future ansible-core - e.g. a module name that only still
# resolves through a legacy redirect. Silencing them hides exactly the class
# of problem this repo cares about.
deprecation_warnings = True
nocolor              = 0
# auto-detect Python without warnings
interpreter_python   = auto_silent
# Host keys are checked: every play connects as root to internet-facing
# servers, so an unchecked key is an open door for a man-in-the-middle.
# New hosts are accepted on first contact (accept-new in ssh_args below);
# a CHANGED key aborts. After deliberately reimaging a host:
#   ssh-keygen -R "[<ip>]:10022"   (and "<ip>" for the first run on port 22)
host_key_checking    = True

# No fact cache: with the default "gathering = implicit" a cache is only
# written, never read, and with "smart" facts could be up to an hour stale
# (RAM, kernel after an update). Fresh facts cost a few seconds per play.

# Show per-task timing at the end of each playbook run.
callbacks_enabled        = profile_tasks
# Multi-line, readable task results and error messages instead of one JSON line.
callback_result_format   = yaml

[privilege_escalation]
# Connections are made as root (remote_user above), so nothing needs escalating.
# The become_method/become_user/become_ask_pass keys were removed: with
# become = false they never take effect and only suggest otherwise.
become               = false

[ssh_connection]
# Pipelining: Ansible pipes scripts directly via SSH stdin instead of copying
# them as temporary files. Removes 2 extra SSH round-trips per task → ~40%
# faster on a high-latency connection.
pipelining           = True
# ControlMaster/ControlPersist: reuse SSH connections across tasks.
# 600s keeps the master alive for an entire playbook run without reconnecting.
# StrictHostKeyChecking=accept-new: no prompt for a new host, but a changed
# key of a known host aborts (see host_key_checking above).
# ServerAliveInterval: keeps long silent tasks (Nextcloud upgrade, occ runs)
# from being dropped by a NAT/router idle timeout.
# Connect timeout comes from "timeout" in [defaults].
ssh_args             = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30 -o ServerAliveCountMax=4

[colors]
error                = bright red
verbose              = cyan

[defaults]
# To avoid --ask-vault-pass on every run, create a file containing the vault
# password and uncomment the line below (never commit .vault_pass to git):
# vault_password_file  = .vault_pass

# all hosts managed as root (no sudo needed)
remote_user          = root
remote_tmp           = $HOME/.ansible/tmp
# one host at a time (single-server setup)
forks                = 1
poll_interval        = 15
sudo_exe             = sudo
# SSH connection timeout in seconds
timeout              = 10
private_key_file     = $HOME/.ssh/id_rsa
deprecation_warnings = False
nocolor              = 0
# auto-detect Python without warnings
interpreter_python   = auto_silent
# skip known_hosts check (IPs can change on re-imaged test hosts)
host_key_checking    = False

[privilege_escalation]
become               = false          # tasks run directly as root; no become needed
become_method        = sudo
become_user          = root
become_ask_pass      = false

[ssh_connection]
# ControlMaster/ControlPersist: reuse SSH connections to speed up multi-task plays.
# ConnectTimeout=99: allow slow connections (e.g. first boot after reimage).
# StrictHostKeyChecking=no: avoids prompt when host key changes (test/re-imaged servers).
ssh_args             = -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=99

[colors]
error                = bright red
verbose              = cyan


